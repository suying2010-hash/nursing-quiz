是错误说法。B、C、D均符合《护士条例》及护理管理规定。故选A。"},{"id":"S219","num":219,"type":"single","q":"以下哪一项不属于护士的基本权利？","options":["享有获得医疗机构物质报酬的权利","享有安全执业的权利","享有学习、培训的权利","享有收受患者报酬的权利","享有人格尊严和人身安全不受侵犯的权利"],"letters":["A","B","C","D","E"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"护士依法享有获得报酬、安全执业、学习培训、人格尊严和人身安全不受侵犯等权利。收受患者报酬属于违规行为，不是权利。故选D。"},{"id":"S220","num":220,"type":"single","q":"以下哪一项不属于护士应履行的义务？","options":["正确的执行医嘱","紧急情况，立即为患者实施抢救","发现医嘱有误，给予更改","进行护理操作时，严格的执行三查七对"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"护士发现医嘱有误，应当向开具医嘱的医师提出，必要时向上级报告，不得自行更改医嘱。其余各项（正确执行医嘱、紧急抢救、三查七对）均属护士义务。故选C。"},{"id":"S221","num":221,"type":"single","q":"护士延续注册时限为几年？","options":["2年","3年","4年","5年"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"护士执业注册有效期为5年，延续注册后的有效期同样为5年。故选D。"},{"id":"S222","num":222,"type":"single","q":"实习护生小王在带教老师的监督下进行静脉输液，因未严格查对，错将22床头孢曲松输给21床患者，导致21床患者发生过敏性休克而死亡。该事故属于（  ）？","options":["一级医疗事故","二级医疗事故","三级医疗事故","四级医疗事故"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"因未严格查对致患者死亡，属于最严重的情形，按《医疗事故分级标准》，造成患者死亡的为一级医疗事故。故选A。"},{"id":"S223","num":223,"type":"single","q":"护士执业证书被吊销后，多久可以再次申请护士执业注册？","options":["1年后","1年半","2年后","3年后"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"护士执业证书被吊销的，自吊销之日起2年内不得再次申请护士执业注册。故选C。"},{"id":"S224","num":224,"type":"single","q":"申请护士执业注册的时限为通过护士执业资格考试之日起（  ）？","options":["1年内","2年内","3年内","4年内"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"《护士条例》规定，通过护士执业资格考试的人员，应在考试通过之日起3年内提出执业注册申请；超过3年的，需按规定重新接受培训和考核。故选C。"},{"id":"S225","num":225,"type":"single","q":"健康医务人员患血源性传染病的原因最主要的是？","options":["针刺伤","对患者的侵袭性操作","接触患者的污染体液","为污染伤口换药"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"医务人员感染血源性传染病（乙肝、丙肝、艾滋病等）最主要的途径是针刺伤等锐器伤，因此锐器的规范处置与防护是职业防护重点。故选A。"},{"id":"S226","num":226,"type":"single","q":"疑似职业病病人在诊断、医学观察期的费用承担者是？","options":["用人单位","职业病防治机构","患者本人","县级以上人民政府"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"《职业病防治法》规定，疑似职业病病人在诊断、医学观察期间的费用，由用人单位承担。故选A。"},{"id":"S227","num":227,"type":"single","q":"国家的根本法是？","options":["刑法","民法","宪法","诉讼法"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"宪法是国家的根本法，具有最高法律效力，其他法律均不得与之相抵触。故选C。"},{"id":"S228","num":228,"type":"single","q":"以下不属于医疗废物的是？","options":["使用过的注射器针头","传染病人的生活垃圾","包扎伤口拆下的敷料","骨折病人的饮料瓶"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"医疗废物是医疗卫生机构在诊疗活动中产生的具有感染性、毒性及其他危害性的废物。使用过的针头、传染病人的生活垃圾、拆下的敷料均属医疗废物；骨折病人的饮料瓶属于普通生活垃圾。故选D。"},{"id":"S229","num":229,"type":"single","q":"医疗卫生机构对医疗废物进行登记,登记资料至少保存（  ）？","options":["2年","3年","4年","5年"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"《医疗废物管理条例》规定，医疗废物登记资料至少保存3年。故选B。"},{"id":"S230","num":230,"type":"single","q":"某护士原在A省执业注册,因工作调动变更执业注册到B省,后又调动变更执业注册至C省,当其需要执业注册延续时,应向以下哪个部门申请 ？","options":["A省卫生厅","B省卫生厅","C省卫生厅","A省或C省卫生厅"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"护士执业注册发生变更的，延续注册应向最后一次（现执业地）注册部门申请，即C省卫生行政部门。故选C。"},{"id":"S231","num":231,"type":"single","q":"国家对传染病防治的方针是什么（  ）？","options":["预防为主","防治结合、分类管理","依靠科学、依靠群众","以上三项"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"《传染病防治法》规定，国家对传染病实行预防为主、防治结合、分类管理，依靠科学、依靠群众的方针。三项均正确，故选D。"},{"id":"S232","num":232,"type":"single","q":"医疗机构发现甲类传染病病人、病原携带者应当予以隔离治疗。拒绝隔离治疗或者隔离期未满擅自脱离隔离治疗的,可以由()协助医疗机构采取强制隔离治疗措施。","options":["公安机关","卫生行政部门","卫生监督机构","卫生防疫机构"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"甲类传染病病人拒绝隔离治疗或隔离期未满擅自脱离的，可由公安机关协助医疗机构采取强制隔离治疗措施。故选A。"},{"id":"S233","num":233,"type":"single","q":"医疗机构应当实行传染病( )、( )制度,对传染病病人或者疑似传染病病人,应当引导至相对隔离的分诊点进行初诊。","options":["隔离、消毒","预检、分诊","分类、隔离","定点、隔离"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"医疗机构应当实行传染病预检、分诊制度，对传染病病人或疑似病人引导至相对隔离的分诊点初诊。故选B。"},{"id":"S234","num":234,"type":"single","q":"医疗卫生机构应当建立医疗废物的暂时贮存设施、设备,不得露天存放医疗废物;医疗废物暂时贮存的时间不得超过( )天。","options":["1","2","3","4"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"《医疗废物管理条例》规定，医疗废物暂时贮存的时间不得超过2天。故选B。"},{"id":"S235","num":235,"type":"single","q":"医疗事故分为( )级,其中造成患者死亡、重度残疾的属 ( )级。","options":["四级;四级","四级;一级","三级;一级","三级;四级"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"医疗事故分为四级：一级造成患者死亡、重度残疾；二级中度残疾、器官组织损伤导致严重功能障碍；三级轻度残疾、器官组织损伤导致一般功能障碍；四级造成明显人身损害的其他后果。故选B（四级；一级）。"},{"id":"S236","num":236,"type":"single","q":"属于乙类传染病的是（  ）。","options":["鼠疫","霍乱","麻疹","丝虫病"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"鼠疫、霍乱属甲类；麻疹属乙类；丝虫病属丙类。故选C。"},{"id":"S237","num":237,"type":"single","q":"属于丙类传染病的是（  ）。","options":["风疹","麻疹","副伤寒","百日咳"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"风疹属丙类传染病；麻疹、副伤寒、百日咳均属乙类。故选A。"},{"id":"S238","num":238,"type":"single","q":"甲类传染病的报告时限是（  ）。","options":["2小时","4小时","6小时","8小时"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"甲类传染病及按甲类管理的乙类传染病，责任报告人应在2小时内通过传染病疫情监测信息系统进行网络直报。故选A。"},{"id":"S239","num":239,"type":"single","q":"以下哪个部门定期公布全国传染病疫情？","options":["国务院","国务院卫生行政部门","省级以上人民政府","省级以上人民政府卫生行政部门","县级以上人民政府"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"国务院卫生行政部门负责定期公布全国传染病疫情信息；省级卫生行政部门公布本行政区域的疫情。故选B。"},{"id":"S240","num":240,"type":"single","q":"在传染病疫情控制时,医疗机构的职责中错误的是（ ）。","options":["对本单位内被传染病病原体污染的场所,依法实施消毒和无害化处理","对甲类传染病患者的密切接触者,在指定场所进行医学观察","对所有传染病患者给予隔离治疗","对拒绝隔离治疗的甲类传染病患者,由公安部门协助医疗机构采取强制隔离措施","对甲类传染病患者,确诊前在指定场所单独隔离治疗"],"letters":["A","B","C","D","E"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"隔离治疗针对的是甲类传染病患者、病原携带者和疑似病人等，并不是\"所有传染病患者\"都要隔离。C项表述过于绝对，是错误项。故选C。"},{"id":"S241","num":241,"type":"single","q":"医务人员未按照规定报告传染病疫情,或者隐瞒、谎报、缓报传染病疫情的,根据情节轻重,可以给予以下处罚,其中不正确的是。","options":["警告","开除","吊销执业执照","罚款","撤职"],"letters":["A","B","C","D","E"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"《传染病防治法》对此类违法行为的处理为：责令改正、通报批评、警告，对责任人员给予降级、撤职、开除处分，并可依法吊销执业证书，法条中没有\"罚款\"。故选D。"},{"id":"S242","num":242,"type":"single","q":"生产经营用于传染病防治的消毒产品,须经以下哪个部门的审批。","options":["县级以上人民政府","市级以上人民政府卫生行政部门","市级以上人民政府","省级以上人民政府卫生行政部门","省级以上人民政府"],"letters":["A","B","C","D","E"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"用于传染病防治的消毒产品，须经省级以上人民政府卫生行政部门审批。故选D。"},{"id":"S243","num":243,"type":"single","q":"医疗机构发现重大食物中毒事件时,应当在多长时间内向所在地县级人民政府卫生行政主管部门报告。","options":["30分钟","2小时","4小时","24小时"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"《突发公共卫生事件应急条例》规定，发现重大食物中毒等突发事件，应在2小时内向所在地县级人民政府卫生行政主管部门报告。故选B。"},{"id":"S244","num":244,"type":"single","q":"以下关于跌倒的预防措施中，说法正确的是（   ）。","options":["护理偏盲患者时，宜站在健侧，并通过声音等增强患者对空间、位置的感知。","指导患者睡眠时抬高床头小于10°，以舒适为宜。","指导患者一旦发生体位性低血压，应立即就近坐下或搀扶平躺休息；","患者淋浴时有人陪伴，水温以38℃～45℃为宜。"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"发生体位性低血压时，应立即就近坐下或搀扶平躺休息，防止跌倒。其余三项表述与指南不符。故选C。"},{"id":"S245","num":245,"type":"single","q":"以下情境中，不属于跌倒评估时机的是（   ）。","options":["病情变化","术前术后","转病区后","特殊检查治疗后","使用影响意识、活动、易导致跌倒的药物"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"跌倒风险评估时机包括：入院时、转病区后、病情变化、特殊检查治疗后、使用影响意识/活动或易致跌倒的药物时等。按题库答案，\"术前术后\"不在所列评估时机之内，故选B。"},{"id":"S246","num":246,"type":"single","q":"下列哪项不属于预防跌倒的护理措施（    ）。","options":["患者有人陪护","使用带有扶手的椅子","床边及卫生间光线明亮","衣裤合适，穿防滑鞋","走廊、卫生间设置扶手"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"陪护、光线明亮、合适衣裤及防滑鞋、走廊卫生间扶手均为预防跌倒措施。题库将\"使用带有扶手的椅子\"列为不属于的选项，故选B。"},{"id":"S247","num":247,"type":"single","q":"诊断下肢DVT的金标准是","options":["D-二聚体检测","静脉造影","静脉超声","CT检查","磁共振检查"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"下肢深静脉血栓（DVT）诊断的金标准是静脉造影（有创）；D-二聚体用于筛查，静脉超声是首选的无创检查方法。故选B。"},{"id":"S248","num":248,"type":"single","q":"腹壁注射抗凝剂的部位","options":["上起自左右肋缘下l cm，下至耻骨联合上1 cm,左右至脐周10 cm,避开脐周2 cm以内","上起自左右肋缘下2 cm，下至耻骨联合上2 cm,左右至脐周8 cm,避开脐周3 cm以内","上起自左右肋缘下3 cm，下至耻骨联合上1cm,左右至脐周10 cm,避开脐周2 cm以内","上起自左右肋缘下1cm，下至耻骨联合上1cm,左右至脐周8cm,避开脐周2 cm以内"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"腹壁注射抗凝剂的部位：上起左右肋缘下1 cm，下至耻骨联合上1 cm，左右至脐周10 cm，避开脐周2 cm以内。故选A。"},{"id":"S249","num":249,"type":"single","q":"腹壁注射抗凝剂时，患者宜取何种体位","options":["半坐卧位","平卧位","屈膝仰卧位","侧卧位"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"屈膝仰卧位可使腹部放松，便于皮下注射，减轻疼痛和皮下出血。故选C。"},{"id":"S250","num":250,"type":"single","q":"护理人员给与患者踝泵运动指导，正确的是","options":["每天6-8组，每组10-30次","每天3-4组，每组20-30次","每天4-6组，每组20-30次","每天5-8组，每组10-30次","每天3-5组，每组20-30次"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"踝泵运动指导：每天3～4组，每组20～30次，可促进下肢静脉血液回流，预防血栓。故选B。"},{"id":"S251","num":251,"type":"single","q":"使用抗凝剂最易出现的并发症是","options":["出血","血栓形成","骨质疏松","过敏反应","血小板减少"],"letters":["A","B","C","D","E"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"抗凝药物通过抑制凝血起效，最常见、最需警惕的并发症是出血。故选A。"},{"id":"S252","num":252,"type":"single","q":"我院血栓评分多少分为高危？","options":["0-2分","3-4分","1分","5分以上"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"按院内血栓风险评估（Caprini量表）分级，评分5分及以上为高危，需采取药物预防等较强措施。故选D。"},{"id":"S253","num":253,"type":"single","q":"滤器植入术后，股静脉穿刺点需压迫止血","options":["1-2小时","2-4小时","4-6小时","12-24小时","24小时以上"],"letters":["A","B","C","D","E"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"滤器植入术后，股静脉穿刺点需压迫止血4～6小时，防止穿刺点出血或血肿。故选C。"},{"id":"S254","num":254,"type":"single","q":"静脉血栓形成病因中，血流缓慢主要见于","options":["长期卧床","肿瘤","妊娠","运动过度"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"静脉血栓形成的三要素是血流缓慢、血管壁损伤、血液高凝状态。血流缓慢主要见于长期卧床、制动；肿瘤、妊娠多与高凝状态有关。故选A。"},{"id":"S255","num":255,"type":"single","q":"血栓形成的病人，急性期需卧床休息，床上活动时应避免大幅度动作，目的是","options":["预防出血","促进血液回流","缓解疼痛","预防水肿","防止血栓脱落"],"letters":["A","B","C","D","E"],"answer":[4],"answerLetters":["E"],"cat":"综合护理题库","explanation":"血栓形成的急性期血栓尚不稳定，大幅度活动、按摩可能使血栓脱落引起肺栓塞，因此需卧床并避免大幅度动作。故选E。"},{"id":"S256","num":256,"type":"single","q":"静脉血栓形成病人的患肢应处于","options":["高于心脏水平20-30cm","低于心脏水平20-30cm","高于心脏水平30-40cm","低于心脏水平30-40cm","平置于下肢水平"],"letters":["A","B","C","D","E"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"患肢应抬高，高于心脏水平20～30 cm，以促进静脉回流、减轻肿胀。故选A。"},{"id":"S257","num":257,"type":"single","q":"静脉血栓形成病人禁止哪项护理操作","options":["戒烟","足背运动","患肢高于心脏水平20-30cm","热敷按摩患肢","食用富含纤维素丰富的食物"],"letters":["A","B","C","D","E"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"热敷、按摩患肢会使血栓脱落，导致肺栓塞，是血栓病人的禁忌。戒烟、足背运动、抬高患肢、高纤维饮食均是推荐措施。故选D。"},{"id":"S258","num":258,"type":"single","q":"以下哪项不是肺栓塞的临床表现","options":["咳嗽","咳痰","胸痛","呼吸困难","咳血"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"肺栓塞常见表现为呼吸困难、胸痛、咯血、咳嗽，\"咳痰\"并非其典型表现。故选B。"},{"id":"S259","num":259,"type":"single","q":"PE是指","options":["深静脉血栓形成","肺栓塞","肌间静脉血栓","血小板","脑梗塞"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"PE是Pulmonary Embolism的缩写，即肺栓塞；深静脉血栓形成缩写为DVT。故选B。"},{"id":"S260","num":260,"type":"single","q":"发生下列什么症状需要高度怀疑深静脉血栓形成","options":["一侧肢体突发肿胀及疼痛","胸闷气促","头痛头晕","下肢动脉搏动消失","下肢静脉曲张成团"],"letters":["A","B","C","D","E"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"一侧肢体突发肿胀、疼痛是深静脉血栓形成的典型表现，应高度怀疑；胸闷气促提示可能已发生肺栓塞。故选A。"},{"id":"S261","num":261,"type":"single","q":"踝泵运动的锻炼中，每个动作需要保持（）秒","options":["5-10S","1-3S","3-5S","10-20S","10-25S"],"letters":["A","B","C","D","E"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库", ,"C","D","E"],"answer":[4],"answerLetters":["E"],"cat":"综合护理题库","explanation":"按题库依据的指南，对拔除导管者，抗凝治疗一般建议持续至拔管后3个月。故选E。"},{"id":"S275","num":275,"type":"single","q":"静脉导管相关性血栓, (  )是最基本的治疗。","options":["抗凝","溶栓","腔静脉滤器置入"],"letters":["A","B","C"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"抗凝是静脉导管相关血栓最基本的治疗，可防止血栓蔓延；溶栓和滤器置入仅用于特殊情况。故选A。"},{"id":"S276","num":276,"type":"single","q":"CVC优选穿刺部位（）。","options":["锁骨下静脉","颈静脉","股静脉","以上都是"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"成人CVC优选锁骨下静脉，感染风险相对较低；颈内静脉、股静脉感染和血栓风险相对更高。故选A。"},{"id":"S277","num":277,"type":"single","q":"PICC 的最佳穿刺血管是()。","options":["贵要静脉","头静脉","正中静脉","尺静脉"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"PICC首选贵要静脉：管径粗、直、静脉瓣少，血流量大，到达上腔静脉路径最短，并发症最少。头静脉较细且有分支和瓣膜，不如贵要静脉。故选A。"},{"id":"S278","num":278,"type":"single","q":"PICC 及 CVC 可用生理盐水或 ()U/mL 肝素盐水封管。","options":["10","0-10","0-20","0-100"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"PICC和CVC封管可用生理盐水或浓度为10 U/mL的肝素盐水。故选A。"},{"id":"S279","num":279,"type":"single","q":"PORT 在治疗间歇期应至少每()维护一次。","options":["1周","4周","1月","4月"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"输液港在治疗间歇期应至少每4周维护（冲封管）一次，防止导管堵塞。故选B。"},{"id":"S280","num":280,"type":"single","q":"PORT导管应选用()液体进行封管。","options":["10单位肝素稀释液","肝素原液","灭菌注射用水","100单位肝素稀释液","生理盐水"],"letters":["A","B","C","D","E"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"PORT导管封管应使用100 U/mL的肝素稀释液，因其为完全植入式、间歇期长，需要较高浓度肝素维持通畅。故选D。"},{"id":"S281","num":281,"type":"single","q":"臂围测量的位置()。","options":["肘窝上5CM","肘关节上5CM","肘窝上10CM","肘窝下5CM","肘关节上10CM"],"letters":["A","B","C","D","E"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"臂围测量位置统一为肘窝上10 cm，用于观察置管侧肢体有无肿胀（与血栓相关）。故选C。"},{"id":"S282","num":282,"type":"single","q":"发生静脉炎时如何处理不包括（）。","options":["局部用50%硫酸镁或95％乙醇溶液行湿热敷，每日2次，每次20分钟","超短波理疗，每日2次，每次15～20分钟","停止在此部位静脉输液，无需抬高肢体","喜辽妥外涂"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"发生静脉炎应停止在此处输液，并抬高患肢、制动，同时可局部湿热敷、理疗或涂药。\"无需抬高肢体\"错误。故选C。"},{"id":"S283","num":283,"type":"single","q":"连接 PORT时应使用（），持续输液时无损伤针应每 （） 更换一次。","options":["专用的无损伤针穿刺，3d","专用的无损伤针穿刺，7d","普通穿刺针，每24h","专用的无损伤针穿刺，每24h"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"连接PORT必须使用专用无损伤针；持续输液时无损伤针应每7天更换一次。故选B。"},{"id":"S284","num":284,"type":"single","q":"皮肤消毒是穿刺部位护理程序的一部分，首选()。","options":["碘伏(聚维酮碘)","碘酒","70%的乙醇","洗必泰含量>0.5%的酒精溶液"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"INS及团体标准首选含洗必泰（氯己定）>0.5%的醇溶液进行皮肤消毒；不能使用氯己定时可选碘伏等。按题库答案选D。"},{"id":"S285","num":285,"type":"single","q":"使用 PICC 输血、输蛋白、输脂肪乳等高粘滞性药物后应如何操作（）。","options":["立即静脉滴注生理盐水，冲洗导管","常规冲管后，立即用 10ml-20ml 生理盐水脉冲式冲管，再输注其他液体","以上都不是","以上都是"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"输血、输蛋白、脂肪乳等高黏滞性药物易附着管壁导致堵塞，输注后应立即用10～20 ml生理盐水脉冲式冲管，再输注其他液体。故选B。"},{"id":"S286","num":286,"type":"single","q":"无菌透明敷料应至少每（）d 更换一次，无菌纱布敷料应至少每（）d 更换一次。","options":["7,2","7,3","3,2","3,3"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"无菌透明敷料至少每7天更换一次，无菌纱布敷料至少每2天更换一次；敷料潮湿、松动、污染时应立即更换。故选A。"},{"id":"S287","num":287,"type":"single","q":"下列哪项不是深静脉置管的适应症()。","options":["长期输液治疗","大量、快速扩容","血液净化","心功能不全"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"深静脉置管适用于长期输液、大量快速扩容、血液净化、监测中心静脉压等。心功能不全不是适应证，反而需严格控制输液量。故选D。"},{"id":"S288","num":288,"type":"single","q":"药物渗出是指静脉治疗过程中（）进入静脉管腔以外的周围组织。","options":["腐蚀性药物","非腐蚀性药物","刺激性药物","非刺激性药物"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"药物渗出指非腐蚀性药物进入血管外周围组织；药物外渗指腐蚀性药物进入周围组织。故选B。"},{"id":"S289","num":289,"type":"single","q":"一次性静脉输液钢针可用于()给药，腐蚀性药物、刺激性药物()使用一次性静脉输液钢针。","options":["单次,不应","单次,可以","多次,不应","对次,可以"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"一次性静脉输液钢针只适用于单次给药；腐蚀性、刺激性药物易外渗，不应使用钢针输注。故选A。"},{"id":"S290","num":290,"type":"single","q":"在满足治疗方案的前提下，应选择()。","options":["管径最细，管腔数量最多的导管","管径最粗，管腔数量最多的导管","管径最细，管腔数量最少的导管","管径最粗，管腔数量最少的导管"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"在满足治疗方案的前提下，应选择管径最细、管腔数量最少的导管，以降低感染、血栓和静脉炎风险。故选C。"},{"id":"S291","num":291,"type":"single","q":"我院目前使用的一次性硅胶胃管留置时间是不超过（）天","options":["10","14","28","30"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"按题库依据，我院使用的一次性硅胶胃管留置时间不超过28天。故选C。"},{"id":"S292","num":292,"type":"single","q":"对患者进行管道滑脱风险评估，评估结果属于高风险的是","options":["≥7分","≥6分","≥4分","≥3分"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"按我院《非计划拔管风险评估表》，评分≥7分为高风险，需加强防范。故选A。"},{"id":"S293","num":293,"type":"single","q":"低危导管标识的颜色","options":["红色","蓝色","黄色","黑色"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"按我院管道标识规定，低危导管使用黄色标识（高危导管为红色）；具体颜色以院内规定为准。故选C。"},{"id":"S294","num":294,"type":"single","q":"管道标识的粘贴部位统一为","options":["常规贴于距离各管道末端","任意位置","距离引流管出口5~10cm","引流管前端"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"管道标识统一粘贴于距各管道末端的规定位置，便于识别和交接，不得随意粘贴。故选A。"},{"id":"S295","num":295,"type":"single","q":"胸腔闭式引流管从胸腔引流伤口处脱落首先如何处理","options":["稳定患者情绪、交代注意事项","用手立即捏闭伤口处皮肤","用止血钳夹紧或反折引流管","立即用凡士林纱布覆盖引流伤口"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"胸腔闭式引流管从胸腔引流伤口脱落时，应首先用手立即捏闭伤口处皮肤，防止气胸；随后消毒并用凡士林纱布覆盖，再通知医生处理。故选B。"},{"id":"S296","num":296,"type":"single","q":"管道风险评估为高风险患者，护士如何进行评估","options":["每班进行评估","每24小时进行评估一次","每周评估两次，评估时间为周一和周四","每周评估一次，评估时间为周一"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"管道滑脱高风险患者每24小时评估一次；低、中风险患者每周评估两次（周一、周四），病情变化时随时评估。故选B。"},{"id":"S297","num":297,"type":"single","q":"我院进行导管风险管理评估人群是","options":["所有住院患者","所有留置导管的住院患者","所有留置导管的患者","所有患者"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"管道风险管理评估对象是所有留置导管的住院患者，不是所有住院患者，也不包括门诊患者。故选B。"},{"id":"S298","num":298,"type":"single","q":"成人通过胃管鼻饲喂食时，其胃管插入的深度为","options":["15~25cm","25~35cm","35~45cm","45~55cm"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"成人胃管插入深度一般为45～55 cm（前额发际至剑突的距离）。故选D。"},{"id":"S299","num":299,"type":"single","q":"插胃管时，患者出现呛咳、发绀时，护士应","options":["嘱患者深呼吸","立即拔出胃管重插","嘱患者左吞咽动作","让患者休息一会在插"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"插胃管时出现呛咳、发绀，提示胃管误入气管，应立即拔出，休息调整后重新插入。故选B。"},{"id":"S300","num":300,"type":"single","q":"少尿是指24小时尿量","options":["＜100ml","＜200ml","＜300ml","＜400ml"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"24小时尿量少于400 ml（或每小时少于17 ml）为少尿；少于100 ml为无尿。故选D。"},{"id":"S301","num":301,"type":"single","q":"鼻饲液的温度一般是","options":["38~40℃","30~35℃","35~40℃","40~45℃"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"鼻饲液温度一般为38～40℃，过冷易引起腹泻、腹痛，过热会烫伤黏膜。故选A。"},{"id":"S302","num":302,"type":"single","q":"两次鼻饲之间最好间隔","options":["38~60min","1~3h","2~4h","4~6h"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"两次鼻饲之间最好间隔2～4小时，既保证胃排空，又能满足营养需要。故选C。"},{"id":"S303","num":303,"type":"single","q":"为女患者插尿管，初次消毒的顺序是","options":["由外向内，自上而下","由内向外，自上而下","由外向内，自下而上","顺序没有关系，只要清洁"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"女患者导尿初次消毒的顺序为由外向内、自上而下，依次消毒阴阜、大阴唇、小阴唇；每个棉球只用一次，避免污染尿道口。故选A。"},{"id":"S304","num":304,"type":"single","q":"胸腔闭式引流，水封瓶长管侵入水中","options":["3～4 cm","1～2 cm","5～6 cm","7~8cm"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"水封瓶长管应浸入水中3～4 cm，既保证水封、防止空气进入胸腔，又不至于阻力过大影响引流。故选A。"},{"id":"S305","num":305,"type":"single","q":"胸腔闭式引流瓶应该低于胸壁引流口平面","options":["10~15 cm","30~60 cm","60~100 cm","70~80cm"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"引流瓶应低于胸壁引流口平面60～100 cm，防止瓶内液体倒流入胸腔。故选C。"},{"id":"S306","num":306,"type":"single","q":"为保持胸腔闭式引流管能够有效引流，以下说法错误的是","options":["如果病情允许，取半坐位","定期以离心方向挤捏引流管","鼓励做深呼吸，咳嗽，但不要变动体位，以防引流管脱出","注意观察引流管，防止受压，扭曲，阻塞"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"保持有效引流需半坐位、定期挤捏引流管、保持通畅，同时应鼓励患者深呼吸、咳嗽并适当变换体位以利引流（妥善固定防脱出即可），而不是\"不要变动体位\"。故选C。"},{"id":"S307","num":307,"type":"single","q":"前列腺摘除术后，停止膀胱冲洗的最佳时间为","options":["肉眼观察无血尿10天","肉眼观察无血尿7天","肉眼观察无血尿5天","肉眼观察无血尿2天"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"前列腺摘除术后膀胱冲洗，待冲洗液澄清、肉眼观察无血尿约2天后可停止冲洗（按题库答案）。故选D。"},{"id":"S308","num":308,"type":"single","q":"成人插胃管深度一般为","options":["前额发际至胸骨剑突处或耳垂经鼻尖至胸骨剑突的距离","前额眉弓至胸骨剑突处或耳垂经鼻尖至胸骨剑突的距离","前额发际至胸骨柄或耳垂经鼻尖至胸骨剑突的距离","前额发际至胸骨剑突处或耳垂经鼻至胸骨剑突的距离"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"成人胃管插入长度可测量\"前额发际至胸骨剑突\"或\"耳垂经鼻尖至胸骨剑突\"的距离，一般为45～55 cm。故选A。"},{"id":"S309","num":309,"type":"single","q":"为昏迷病人插胃管时为避免胃管误入气管应该","options":["和清醒病人一样，没有特殊","头偏向一侧,快速插入","托起头部，插入15cm时将患者头后仰","让患者头向后仰，插入15cm时将患者头托起，使下额靠近胸骨柄"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"昏迷患者吞咽和咳嗽反射消失，插胃管时先使头后仰，插入约15 cm（会厌部）时托起头部使下颌靠近胸骨柄，加大咽喉部通道弧度，使管端沿食管壁顺利插入，避免误入气管。故选D。"},{"id":"S310","num":310,"type":"single","q":"某女，40岁。胆道手术后T管引流2周，拔管前先试行夹管l～2天，夹管期间应注意观察的内容有","options":["饮食、睡眠","腹痛、发热、黄疽","大便的颜色","引流口有无渗液"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"T管拔管前试行夹管，目的是观察胆汁是否能顺利流入肠道。夹管期间如出现腹痛、发热、黄疸，提示胆道梗阻或感染，应立即开放T管并报告医生。故选B。"},{"id":"S311","num":311,"type":"single","q":"男性，60岁。行左侧肺叶切除术后2h，病人自觉胸闷，呼吸急促，测血压，脉搏均正常，见水封瓶内有少嚣淡红色液体，水柱波动不明显，考虑为","options":["肺己复张","胸腔内出血","引流管阻塞","肺炎、肺不张"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"术后患者胸闷、呼吸急促，生命体征平稳，水封瓶引流液很少、水柱波动不明显，提示引流管不通畅（阻塞或受压），应检查管路并挤捏通管。肺已复张时患者无不适；胸腔内出血会有大量血性引流液及血压、脉搏变化。故选C。"},{"id":"S312","num":312,"type":"single","q":"值班护士一旦发现前列腺手术后患者持续膀胱冲洗引流液颜色逐渐加深，下列哪项不属于立即处理措施","options":["加快冲洗速度","立即通知医师，开通静脉通路","安慰患者，使其不要过于紧张","给予抗炎治疗"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"冲洗液颜色逐渐加深提示活动性出血，应立即加快冲洗、通知医师、建立静脉通路并安抚患者。给予抗炎治疗不属于立即处理措施。故选D。"},{"id":"S313","num":313,"type":"single","q":"我院使用的管道滑脱风险评估工具是","options":["《住院患者非计划性拔管风险评估量表》","《非计划拔管风险评估表》","《住院患者非计划性拔管风险因素评估量表》","《住院患者管道滑脱预防评估量表》"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"我院使用的管道滑脱风险评估工具为《非计划拔管风险评估表》（按院内规定）。故选B。"},{"id":"S314","num":314,"type":"single","q":"膀胱高度膨胀而又极度虚弱的患者，导尿时首次放尿不应超过（）","options":["500ml","1000ml","1500ml","2000ml"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"膀胱高度膨胀且极度虚弱的患者，首次放尿不应超过1000 ml，以免膀胱内压骤降发生虚脱，或膀胱黏膜急剧充血引起血尿。故选B。"},{"id":"S315","num":315,"type":"single","q":"发现脑脊液呈毛玻璃状或有絮状物提示","options":["出血","感染","正常","颅内压增高"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"正常脑脊液无色透明；毛玻璃状或有絮状物，提示细胞数增多，多见于感染（如化脓性脑膜炎）。故选B。"},{"id":"S316","num":316,"type":"single","q":"膀胱高度膨胀者，一次放尿不得超过1000 m1，主要是预防发生","options":["虚脱胀痛","虚脱或感染","血尿或感染","虚脱或血尿"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"一次放尿过多，腹腔内压骤降，血液大量滞留于腹腔血管引起血压下降而虚脱；膀胱内压突然降低，黏膜急剧充血可发生血尿。故选D（虚脱或血尿）。"},{"id":"S317","num":317,"type":"single","q":"留置胸腔闭式引流管的拔管指征不包括(","options":["24h引流液<50 ml 或24h引流脓液<10m1","胸片示肺膨胀良好无漏气","患者无呼吸困难","一般置管48～72h后，只有少量气体溢出"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"胸腔闭式引流拔管指征：24小时引流液明显减少（<50 ml，脓液<10 ml），胸片示肺膨胀良好、无漏气，患者无呼吸困难。若置管后仍有气体溢出，说明存在漏气、肺未完全复张，不能拔管，故D不是拔管指征。故选D。"},{"id":"S318","num":318,"type":"single","q":"“T”管引流常见的并发症不包括","options":["出血","引流不通畅","水电解质平衡紊乱","感染"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"T管引流常见并发症有引流不通畅、感染、水电解质平衡紊乱、胆汁渗漏等；按题库答案，出血不在常见并发症之列。故选A。"},{"id":"S319","num":319,"type":"single","q":"搬动胸腔闭式引流的病人过床时，最重要的是","options":["保证引流管通畅","引流瓶不能高于病人胸腔平面","避免引流管受压，折曲","夹紧引流管，暂停引流"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"搬动带胸腔闭式引流的患者过床时，应先夹紧（双钳夹闭）引流管，暂停引流，防止引流瓶位置变化导致液体倒流或管道脱出，转移后再开放。故选D。"},{"id":"S320","num":320,"type":"single","q":"留置尿管气囊内注入液体的种类及液体量是","options":["生理盐水，3～5 m1","空气，5 ml","生理盐水，根据各类管道注明量为准","注射用水，10～30ml"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"留置尿管气囊内应注入无菌液体，注入量以各类导管注明的容量为准，不可随意增减，也不得注入空气。故选C。"},{"id":"S321","num":321,"type":"single","q":"长期留置导尿管发生尿液混浊、沉淀或结晶时应","options":["多饮水并进行膀胱冲洗","经常更换卧位","膀胱内滴药","热敷下腹部"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"长期留置尿管出现尿液混浊、沉淀或结晶，应鼓励患者多饮水（每日2000 ml以上）起到内冲洗作用，并进行膀胱冲洗，防止堵管和感染。故选A。"},{"id":"S322","num":322,"type":"single","q":"正常成人每日胆汁分泌量是","options":["200~300ml","300~400ml","500~600ml","800~1200ml"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"正常成人每日胆汁分泌量约800～1200 ml。故选D。"},{"id":"S323","num":323,"type":"single","q":"关于“T”管引流目的说法，正确的是","options":["引流胆汁","引流残余结石","支撑胆道，防止胆道狭窄","以上都是"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"\"T\"管引流的目的包括：引流胆汁和减压、引流残余结石、支撑胆道防止狭窄，三项均正确。故选D。"},{"id":"S324","num":324,"type":"single","q":"管道风险评估为低、中风险患者，护士如何进行评估","options":["每班进行评估","每24小时进行评估一次","每周评估两次，评估时间为周一和周四","每周评估一次，评估时间为周一"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"管道风险评估频次：高风险每24小时评估一次；低、中风险每周评估两次（周一、周四）。故选C。"},{"id":"S325","num":325,"type":"single","q":"乳胶材质导尿管留置时间不应该超过多少天？（  ）","options":["7天","15天","30天","3个月"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"乳胶导尿管材质易引起组织反应、容易结垢，留置时间不应超过7天。故选A。"},{"id":"S326","num":326,"type":"single","q":"硅胶材质导尿管留置时间最长是多少天（  ）？","options":["7天","15天","28天","3个月"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"硅胶导尿管组织相容性好，最长留置时间为28天（按院内规定）。故选C。"},{"id":"S327","num":327,"type":"single","q":"病人术后留置胃肠减压，提示可以拔出胃管的指征是","options":["体温正常","腹胀减轻","肛门排气","食欲增加"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"肛门排气提示胃肠蠕动功能恢复，此时可停止胃肠减压并拔除胃管。体温正常、腹胀减轻、食欲增加均不能作为直接指征。故选C。"},{"id":"S328","num":328,"type":"single","q":"新入院或转入患者（）h内完成首次入院评估","options":["1","2","4","8"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"按护理评估规定，新入院或转入患者应在2小时内完成首次入院评估。故选B。"},{"id":"S329","num":329,"type":"single","q":"（）用于理解数字并能表达疼痛的患者","options":["口述分级评分法","数字疼痛评分法","面部表情评分法","视觉模拟评分法"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"数字疼痛评分法（NRS）适用于能理解数字并能表达疼痛程度的患者；面部表情评分法适用于儿童、老年人或表达困难者。故选B。"},{"id":"S330","num":330,"type":"single","q":"静脉用药后（）护士对患者疼痛情况再次进行评估","options":["4小时","1小时","30分钟","15分钟"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"静脉用药起效快，用药后15分钟应再次评估疼痛，观察镇痛效果与不良反应。故选D。"},{"id":"S331","num":331,"type":"single","q":"（）是患者疼痛时首选的用药方法","options":["口服给药","肌肉注射","静脉输液","贴剂"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"疼痛治疗用药原则强调无创、简便、安全，口服给药是首选途径。故选A。"},{"id":"S332","num":332,"type":"single","q":"（）是疼痛评估的关键","options":["医生的决定","家属的要求","患者的主诉","护士的评估"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"疼痛是主观感受，患者的主诉是疼痛评估的关键，也是最可靠的依据。故选C。"},{"id":"S333","num":333,"type":"single","q":"口服药用药后（）护士对患者疼痛情况再次进行评估","options":["4小时","1小时","30分钟","15分钟"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"口服药物起效较慢，用药后1小时再次评估疼痛情况。故选B。"},{"id":"S334","num":334,"type":"single","q":"根据世界卫生组织疼痛治疗用药三阶梯方案，对于重度疼痛（4-6分）患者应选用（）治疗方案","options":["非阿片类+辅助用药","弱阿片类+非阿片类+辅助用药","强阿片类+非阿片类+辅助用药","强阿片类+弱阿片类+辅助用药"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"世界卫生组织三阶梯方案：轻度疼痛用非阿片类+辅助药；中度疼痛用弱阿片类+非阿片类+辅助药；重度疼痛用强阿片类+非阿片类+辅助药。题中4～6分在数字评分法中通常属中度，对应第二阶梯，按题库答案选B。"},{"id":"S335","num":335,"type":"single","q":"无痛及轻度疼痛时，应每日白班进行至少（）次疼痛评估，直至出院","options":["1","2","3","4"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"无痛及轻度疼痛的患者，每日白班至少评估1次，直至出院。故选A。"},{"id":"S336","num":336,"type":"single","q":"以下哪个是跌倒的高风险人群？","options":["20岁健康年轻人","40岁经常运动的中年人","70岁行动缓慢的老年人","50岁身体强壮的中年人"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"高龄、行动缓慢、平衡及肌力下降者是跌倒的高风险人群，70岁行动缓慢的老年人风险最高。故选C。"},{"id":"S337","num":337,"type":"single","q":"患者穿着哪种鞋子容易增加跌倒风险？","options":["防滑平底鞋","高跟鞋","合脚的运动鞋","软底布鞋"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"高跟鞋重心不稳、接触面小，易致跌倒；防滑平底鞋、合脚运动鞋、软底布鞋相对更安全。故选B。"},{"id":"S338","num":338,"type":"single","q":"下列哪种药物服用后可能增加跌倒风险？","options":["维生素","钙片","降压药","健胃消食片"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"降压药可引起体位性低血压、头晕，增加跌倒风险；镇静催眠、利尿、降糖药等同理。维生素、钙片、健胃消食片一般不增加跌倒风险。故选C。"},{"id":"S339","num":339,"type":"single","q":"以下哪个不是跌倒的常见危险因素？","options":["视力障碍","身体健康的年轻人","服用镇静药物","地面湿滑"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"视力障碍、服用镇静药物、地面湿滑均是常见危险因素；身体健康的年轻人不是危险因素。故选B。"},{"id":"S340","num":340,"type":"single","q":"以下哪种情况最容易增加患者跌倒风险？","options":["病房地面干燥整洁","患者穿着防滑拖鞋","患者独自在卫生间","病房灯光充足"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"卫生间地面湿滑，患者独自如厕时无人保护，起身、转身时易跌倒，是最易增加跌倒风险的情形。其余三项均是预防措施。故选C。"},{"id":"S341","num":341,"type":"single","q":"为预防跌倒，患者起床时应采取的正确姿势是？","options":["迅速坐起","直接站立","先在床上坐一会儿，再缓慢起身","迅速起床"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"起床应遵循\"慢\"原则：先在床上坐一会儿，再缓慢起身，避免体位性低血压引起头晕跌倒。故选C。"},{"id":"S342","num":342,"type":"single","q":"下列哪个不是跌倒风险评估的内容？","options":["患者年龄","患者饮食习惯","患者用药情况","患者行动能力"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"跌倒风险评估内容包括年龄、既往史、用药情况、行动能力、意识及感知等；饮食习惯不是评估内容。故选B。"},{"id":"S343","num":343,"type":"single","q":"为降低跌倒风险，病房的床高度应调整为？","options":["越高越好","越低越好","以患者坐在床边，双脚能平稳着地为宜","随意调整"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"病床高度以患者坐在床边、双脚能平稳着地为宜，过高上下床易跌倒，过低起身困难。故选C。"},{"id":"S344","num":344,"type":"single","q":"患者发生跌倒后导致头部血肿需要冰袋冷敷，跌到伤害程度分级属于（  ）。","options":["严重度 1 级","严重度2级","严重度3级","严重度4级"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"跌倒伤害严重度1级：血肿、擦伤、疼痛，需冰敷、包扎、伤口清洁、肢体抬高、局部用药等。故选A。"},{"id":"S345","num":345,"type":"single","q":"患者张某，男性，高血压病史22年，长期服用硝苯地平缓释片，近期突然出现头痛、头晕，测血压170/100mmHg，从护理安全角度应重点关注（  ）。","options":["活动受限情况","血压变化","防跌倒坠床","呕吐情况"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"高血压患者长期服用降压药，出现头痛头晕、血压升高，存在头晕、体位性低血压等问题，从护理安全角度应重点防跌倒坠床。故选C。"},{"id":"S346","num":346,"type":"single","q":"患者发生跌倒后导致肌肉或关节损伤，需要缝合、夹板固定，跌到伤害程度分级属于（  ）。","options":["严重度 1 级","严重度2级","严重度3级","严重度4级"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"跌倒伤害严重度2级：肌肉或关节损伤，需要缝合、使用皮肤胶、夹板固定等。故选B。"},{"id":"S347","num":347,"type":"single","q":"患者跌倒导致骨折、神经或内部损伤， 需要手术、石膏固定等治疗，跌到伤害程度分级属于（    ）。","options":["严重度 1 级","严重度2级","严重度3级","严重度4级"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"跌倒伤害严重度3级：骨折、神经或内部损伤，需要手术、石膏、牵引等。故选C。"},{"id":"S348","num":348,"type":"single","q":"《Morse跌到风险评估量表》属于低风险分值是（   ）。","options":["≤24 分","25～44 分","≤45分","≤25分"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"Morse跌倒风险评估量表：<25分为无/极低风险，25～44分为低风险，≥45分为高风险。故选B。"},{"id":"S349","num":349,"type":"single","q":"下列不属于跌倒的是（   ）？","options":["患者熟睡，翻身时从床上跌落","患者如厕时，起身时未站稳，再次跌回马桶上","患者起床站立时，感乏力，跌落在地上，未受伤","患者起床取水杯时，沿床沿向下滑，未落地"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"跌倒是指突发、不自主、非故意的体位改变，倒在地上或更低平面。患者沿床沿下滑但未落地、未到更低平面，不算跌倒；其余三项均属跌倒。故选D。"},{"id":"S350","num":350,"type":"single","q":"下列哪类患者有发生跌倒的风险（   ）？","options":["步态不稳者","头晕、眩晕、血压不稳者","意识/精神障碍者","使用降压、镇静催眠、抗癫痫、利尿缓泻剂等药物","以上都是"],"letters":["A","B","C","D","E"],"answer":[4],"answerLetters":["E"],"cat":"综合护理题库","explanation":"步态不稳、头晕眩晕血压不稳、意识/精神障碍，以及使用降压、镇静催眠、抗癫痫、利尿缓泻剂等药物的患者，均有跌倒风险。故选E（以上都是）。"},{"id":"S351","num":351,"type":"single","q":"指导患者卧位转为站位时，需遵循“起床三部曲”指 （   ）？","options":["平卧30s、坐起30s、站立30s","平卧15s、坐起15s、站立15s","平卧20s、坐起20s、站立20s","平卧5s、坐起5s、站立5s"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"\"起床三部曲\"指平卧30秒、坐起30秒、站立30秒，再行走，预防体位性低血压。故选A。"},{"id":"S352","num":352,"type":"single","q":"跌倒的高危人群不包括（   ）？","options":["近3个月有跌倒史的患者","贫血或营养不良的患者","血压不稳定、虚弱、头晕的患者","服用消炎药的患者","视力较差的患者"],"letters":["A","B","C","D","E"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"近期有跌倒史、贫血或营养不良、血压不稳定/虚弱/头晕、视力较差者均是跌倒高危人群；服用消炎药一般不增加跌倒风险。故选D。"},{"id":"S353","num":353,"type":"single","q":"自动列入高风险的患者包括（   ）？","options":["眩晕患者","重度贫血患者","产后 24 小时内的产妇","麻醉复苏室、手术室","以上都是"],"letters":["A","B","C","D","E"],"answer":[4],"answerLetters":["E"],"cat":"综合护理题库","explanation":"眩晕、重度贫血、产后24小时内的产妇，以及麻醉复苏室、手术室等特殊场所的患者，均自动列为跌倒高风险。故选E。"},{"id":"S354","num":354,"type":"single","q":"关于跌倒安全的护理措施包括（   ）。","options":["跌倒高风险患者安置于护士站附近，方便观察","选用稳固性较好的座椅","抱扶患者前，先评估再选用安全的抱扶方法","运送患者时需加用安全带及上床栏","以上均是"],"letters":["A","B","C","D","E"],"answer":[4],"answerLetters":["E"],"cat":"综合护理题库","explanation":"高风险患者安置在护士站附近、选用稳固座椅、先评估再选择安全的抱扶方法、运送时加安全带及床栏，均是正确的跌倒安全措施。故选E。"},{"id":"S355","num":355,"type":"single","q":"关于跌倒风险评估，以下说法不正确的是（   ）。","options":["成人Morse评分≥25分或儿童 Humpty Dumpty评分≥7分的患者，每周评估1次","新入院患者，责任护士当班完成首次评估","患者转病区后、发生病情变化随时评估","使用影响意识、活动、易导致跌倒的药物时，需随时进行评估"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"新入院患者应在2小时内完成首次跌倒风险评估，而不是\"当班完成\"，因此B说法不正确；A、C、D均符合评估规范。故选B。"},{"id":"S356","num":356,"type":"single","q":"在跌倒伤害程度分级中，以下那种情况属于跌倒伤害严重度2级（    ）？","options":["患者跌倒导致肌肉或关节损伤，需要缝合、使用皮肤胶、夹板固定等。","患者跌倒导致血肿、擦伤、疼痛，需要冰敷、包扎、伤口清洁、肢体抬高、局部用药等。","患者跌倒导致骨折、神经或内部损伤， 需要手术、石膏、牵引等。"],"letters":["A","B","C"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"跌倒伤害严重度2级为肌肉或关节损伤，需要缝合、皮肤胶、夹板固定等；B是1级，C是3级。故选A。"},{"id":"S357","num":357,"type":"single","q":"《Humpty Dumpty 评估量表》属于低风险分值是？","options":["7～11 分","≥12分","≤12分","≤7分"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"Humpty Dumpty儿童跌倒评估量表：7～11分为低风险，≥12分为高风险。故选A。"},{"id":"S358","num":358,"type":"single","q":"利伐沙班片20mg口服用药的时机为","options":["饭前半小时","饭后半小时","饭后一小时","饭前一小时","随餐同服"],"letters":["A","B","C","D","E"],"answer":[4],"answerLetters":["E"],"cat":"综合护理题库","explanation":"利伐沙班15 mg、20 mg规格需随餐服用，与食物同服可显著提高生物利用度。故选E。"},{"id":"S359","num":359,"type":"single","q":"我院采用的那种血栓风险评估工具？","options":["Autar量表","Caprini量表","Wells量表","Padua量表"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"我院采用Caprini量表评估外科及住院患者的静脉血栓风险；Padua量表多用于内科患者，Wells量表用于DVT/PE的临床可能性评估。故选B。"},{"id":"S360","num":360,"type":"single","q":"推荐糖尿病患者膳食能量的宏量营养素占总能量比分别为","options":["蛋白质15%~20%、碳水化合55%~60%、脂肪20%~25%","蛋白质15%~20%、碳水化合50%~60%、脂肪15%~35%。","蛋白质10%~20%、碳水化合50%~60%、脂肪20%~35%。","蛋白质15%~20%、碳水化合45%~60%、脂肪20%~35%。"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"糖尿病患者宏量营养素供能比推荐：蛋白质15%～20%，碳水化合物45%～60%，脂肪20%～35%。故选D。"},{"id":"S361","num":361,"type":"single","q":"建议超重肥胖患者按照每个月减少（  ）的速度减重","options":["2~4 kg","1~2 kg","3~4kg","5~6 kg"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"超重肥胖患者减重应循序渐进，建议每月减少1～2 kg，过快易导致肌肉丢失和营养不良。故选B。"},{"id":"S362","num":362,"type":"single","q":"我国成人健康体重的体质指数（BMI）应保持在 （  ）之间","options":["18.5～23.9kg/m2","19.0～28.5kg/m2","24.0～28.5kg/m2","18.5～28.5kg/m2"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"我国成人健康体重的BMI范围为18.5～23.9 kg/m²；24.0～27.9为超重，≥28.0为肥胖。故选A。"},{"id":"S363","num":363,"type":"single","q":"糖尿病患者可在（   ）运动","options":["餐后","餐前","两餐间","睡前"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"糖尿病患者宜在餐后（约1小时）运动，此时血糖较高，运动有助于降糖，且不易发生低血糖。故选A。"},{"id":"S364","num":364,"type":"single","q":"有利血糖控制的进餐顺序是","options":["先吃主食最后喝汤","先吃菜最后吃主食","先吃肉最后吃菜","先吃菜最后吃肉"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"有利于血糖控制的进餐顺序为先吃蔬菜，再吃肉蛋等蛋白质，最后吃主食，可延缓碳水化合物吸收、降低餐后血糖峰值。故选B。"},{"id":"S365","num":365,"type":"single","q":"（   ）是影响餐后血糖最重要的营养因素","options":["蔬菜的种类和数量","蛋白质的种类和数量","碳水化合物的种类和数量","脂肪的种类和数量"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"碳水化合物是影响餐后血糖最主要的营养素，其种类（升糖指数）和数量决定餐后血糖水平。故选C。"},{"id":"S366","num":366,"type":"single","q":"糖尿病患者是否需要加餐、什么时间加餐，以及选择何种零食，应根据（   ）来决定","options":["糖尿病类型","患者具体血糖波动的特点","患者的病程","患者的个人意愿"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"是否加餐、何时加餐及零食种类，应根据患者具体的血糖波动特点个体化决定。故选B。"},{"id":"S367","num":367,"type":"single","q":"院内转运由（       ）负责决定。","options":["患者本人","患者家属","责任护士或值班护士","主管医师或值班医师"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"院内转运属于医疗决策，应由主管医师或值班医师评估并决定；护士负责执行和配合。故选D。"},{"id":"S368","num":368,"type":"single","q":"危重患者转运前的工作不包括（       ）","options":["停止一切输液","做好患者评估","确定转运路线","跟家属沟通"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"危重患者转运前需评估患者、确定路线、与家属沟通，并确保必要的静脉通路及生命支持。\"停止一切输液\"会中断必要治疗和用药，不属于转运前工作。故选A。"},{"id":"S369","num":369,"type":"single","q":"危重患者转运的医务人员是（        ）","options":["接受过专业训练的医务人员","实习生","家属","护工"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"危重患者转运必须由接受过专业训练、能处理途中突发情况的医务人员负责，实习生、家属、护工均不具备相应能力。故选A。"},{"id":"S370","num":370,"type":"single","q":"我院2号楼某科室前往CT室检查，在CT室门口突发猝死，你作为陪同检查的医务人员该如何处置（    ）","options":["转移到就近临床科室进行抢救","先转移至原科室再进行抢救","边转移边抢救至原科室","就地抢救，联系1楼急救小组协作抢救后转移至有条件科室进行进一步治疗"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"患者突发猝死应第一时间就地抢救（心肺复苏），不得为转移而延误抢救；同时呼叫急救小组协作，待复苏成功、病情允许后再转运至有条件的科室。故选D。"},{"id":"S371","num":371,"type":"single","q":"机械通气患者转运的禁忌症（       ）","options":["患者血流动力学稳定","在运输过程中无法通过手动通气，便携式呼吸机进行提供足够的氧气和通气","生命体征稳定","在运输过程中无法维持气道控制"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"机械通气患者转运的禁忌之一，是途中无法通过手动通气或便携式呼吸机保证足够的氧合和通气。血流动力学稳定、生命体征稳定不是禁忌。故选B。"},{"id":"S372","num":372,"type":"single","q":"机械通气患者转运过程中的设备相关因素有（        ）","options":["患者意识昏迷","转运前未评估测量生命体征","仪器电池电量不足","患者呕吐"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"设备相关因素包括仪器电量不足、管路连接不良、氧气不足等；患者意识昏迷、呕吐属患者因素，转运前未评估属人员/流程因素。故选C。"},{"id":"S373","num":373,"type":"single","q":"未开启的胰岛素的储存温度为","options":["2-8℃","15-30℃","冷冻","零度以下"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"未开启的胰岛素应冷藏保存于2～8℃，不可冷冻，冷冻后药效会被破坏。故选A。"},{"id":"S374","num":374,"type":"single","q":"速效胰岛素的主要作用为","options":["控制餐后血糖","控制餐前血糖","控制睡前血糖","控制夜间血糖"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"速效胰岛素起效快、作用时间短，主要用于控制餐后血糖。故选A。"},{"id":"S375","num":375,"type":"single","q":"已开启的胰岛素的储存温度为","options":["2-8℃","15-30℃","冷冻","零度以下"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"已开启的胰岛素无需冷藏，可在15～30℃室温下保存（一般不超过28天），避免阳光直射和高温。故选B。"},{"id":"S376","num":376,"type":"single","q":"长效胰岛素及其类似物的主要作用为","options":["控制餐后血糖","控制餐前血糖","控制睡前血糖","控制夜间及空腹血糖"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"长效胰岛素及其类似物作用平稳持久，提供基础胰岛素水平，主要控制夜间及空腹血糖。故选D。"},{"id":"S377","num":377,"type":"single","q":"餐时短效胰岛素的首选注射部位为","options":["大腿前外侧","臀部","腹部","上臂"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"腹部皮下脂肪丰富、吸收快而稳定，是餐时短效胰岛素的首选注射部位；大腿、臀部吸收较慢，适合中长效制剂。故选C。"},{"id":"S378","num":378,"type":"single","q":"以下哪项是CVC护理中常见的并发症？","options":["导管相关性感染","导管堵塞","导管移位","所有以上"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"CVC护理中常见并发症包括导管相关性感染、导管堵塞、导管移位等，ABC均正确。故选D。"},{"id":"S379","num":379,"type":"single","q":"CVC护理中，以下哪项是预防感染的重要措施？","options":["无菌操作","减少导管使用频率","增加导管更换次数","以上都是"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"预防CVC相关感染的核心措施是严格无菌操作（置管、维护、接头消毒）；频繁更换导管反而增加感染风险。故选A（题库答案）。"},{"id":"S380","num":380,"type":"single","q":"建议用中心静脉输注的药物的种类有","options":["持续输注发疱剂","血管活性药和对血管内膜有刺激性的药物","渗透压＞90OmoSm/L的药物和液体","胃肠外营养液","以上都是"],"letters":["A","B","C","D","E"],"answer":[4],"answerLetters":["E"],"cat":"综合护理题库","explanation":"发疱剂、血管活性药、对血管内膜有刺激的药物、渗透压>900 mOsm/L的药物及胃肠外营养液，均建议经中心静脉输注。故选E。"},{"id":"S381","num":381,"type":"single","q":"以下哪种情况属于医护人员针刺伤？","options":["护士小张在库房检查科室备用物资时，因用力过大，被未开启包装的采血针扎伤手指","王医生在家帮儿子整理学习用品时，不小心被大头针扎破手指","实习生小李在给5床患者拔出输液针头时，不小心被输液针头扎破手指","护理部王老师在整理资料时，被订书钉扎破手指","以上都是"],"letters":["A","B","C","D","E"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"针刺伤指医护人员在工作中被医疗锐器（污染的针头等）刺伤。C项实习生拔针时被输液针头扎伤，属于针刺伤；A项针头未开启包装，B、D项不在工作中或非医疗锐器，均不属于。故选C。"},{"id":"S382","num":382,"type":"single","q":"如果发生了感染性职业暴露，该如何紧急处置？","options":["挤压--清洗--消毒包扎--上报（报告、评估、追踪）","冲洗--消毒包扎--上报（报告、评估、追踪）","消毒--挤压--清洗--包扎--上报（报告、评估、追踪）","挤压--清洗--上报（报告、评估、追踪）","以上都不对"],"letters":["A","B","C","D","E"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"感染性职业暴露的紧急处置流程：挤压（从近心端向远心端挤出血液）→清洗（流动水/生理盐水）→消毒包扎→上报（报告、评估、追踪）。故选A。"},{"id":"S383","num":383,"type":"single","q":"如果发生针刺伤，应如何挤压伤口？","options":["由近心端向远心端挤压，尽可能挤出损伤处的血液","由远心端向近心端挤压，尽可能挤出损伤处的血液","按压伤口，避免血液流出","切开伤口，充分暴露，使用生理盐水反复冲洗","以上都不对"],"letters":["A","B","C","D","E"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"发生针刺伤后应由近心端向远心端挤压，尽可能挤出损伤处的血液，再用流动水冲洗。不可按压伤口使血液滞留，也不可切开伤口。故选A。"},{"id":"S384","num":384,"type":"single","q":"需要空腹的静脉血检验项目，以下哪项空腹时间是正确的？","options":["6小时","12小时","24小时","4小时","以上都不对"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"需空腹的静脉血检验项目，一般要求空腹至少8小时、以12小时左右为宜，同时避免饮酒和剧烈运动。按题库答案选B（12小时）。"},{"id":"S385","num":385,"type":"single","q":"静脉采血应该如何选择穿刺部位？","options":["首选手背的浅表静脉","首选手臂肘前区静脉","特殊患者可以选用足踝处的静脉","血液透析患者可以使用动静脉造瘘侧手臂的血管","以上都对"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"静脉采血首选手臂肘前区静脉（正中静脉、头静脉、贵要静脉）。手背静脉、足踝静脉仅在无法选择肘前区时使用；血液透析患者动静脉造瘘侧手臂禁止采血。故选B。"},{"id":"S386","num":386,"type":"single","q":"新入院患者张某，需要采集多管血液标本，以下采集顺序，哪一项是正确的？","options":["蓝管--红管--绿管--紫管","黑管--紫管--绿管--红管","蓝管--紫管--黑管--红管","红管--蓝管--紫管--绿管","以上都不对"],"letters":["A","B","C","D","E"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"多管采血顺序：血培养→蓝管（凝血）→红/黄管（血清）→绿管（肝素）→紫管（EDTA）→灰管。为避免添加剂交叉污染，选项中蓝→红→绿→紫顺序正确。故选A。"},{"id":"S387","num":387,"type":"single","q":"护士长进入3病室，看到李护士正在为患者张大爷进行静脉采血，李护士即将结束静脉采血，护士长看到李护士的以下操作，哪一项是不正确的？","options":["先松开止血带，从采血针上拔出最后一支采血管，然后从静脉拔出采血针","拔出采血针后，在穿刺部位覆盖无菌棉签，嘱患者按压穿刺点5 min，直至出血停止","为了快速止血，李护士指导患者曲肘按压，以增加额外的压力","张大爷按压不当，导致穿刺处形成淤青，李护士指导患者在24 h内给予冷敷","以上都不对"],"letters":["A","B","C","D","E"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"采血后应伸直手臂按压穿刺点，不可曲肘按压，曲肘会使局部压力不均、易形成淤青或血肿。A、B、D的做法均正确。故选C。"},{"id":"S388","num":388,"type":"single","q":"纯母乳喂养的定义（ ）？","options":["除了吃母乳外，还可以添加少量奶粉","除了吃母乳外，还可以食用少量水","除了吃母乳外，不给新生儿吃任何食物或饮料","母乳不够，适当添加配方奶"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"纯母乳喂养指除母乳外，不给婴儿吃任何其他食物或饮料，包括水和配方奶（药物、维生素、矿物质补充剂除外）。故选C。"},{"id":"S389","num":389,"type":"single","q":"WHO推荐纯母乳喂养可至婴儿（ ）？","options":["5个月","6个月","10个月","12个月"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"WHO推荐婴儿出生后前6个月纯母乳喂养，6个月后在继续母乳喂养的基础上添加辅食。故选B。"},{"id":"S390","num":390,"type":"single","q":"我院是哪年被授予“爱婴医院”称号（ ）？","options":["1992年","1994年","1995年","1996年"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"该题为院内信息，按题库答案，我院于1994年被授予\"爱婴医院\"称号。故选B。"},{"id":"S391","num":391,"type":"single","q":"新生儿出生后皮肤早接触、早吸吮时间应不少于多长时间（ ）？","options":["30分钟","60分钟","90分钟","120分钟"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"爱婴医院要求新生儿出生后尽早皮肤接触、早吸吮，按题库规定接触时间不少于90分钟。故选C。"},{"id":"S392","num":392,"type":"single","q":"早吸吮，下列哪项是正确的（ ）？","options":["生后30分钟内婴儿开始吸吮母亲乳头","生后1小时内婴儿开始吸吮母亲乳头","生后2小时内婴儿开始吸吮母亲乳头","生后3小时内婴儿开始吸吮母亲乳头"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"早吸吮指生后1小时内让婴儿开始吸吮母亲乳头，可促进乳汁分泌和子宫收缩。故选B。"},{"id":"S393","num":393,"type":"single","q":"护理人文关怀是指在诊疗护理过程中护理人员本着(       )对患者的生命与健康、权利与需求、人格与尊严、生活质量与生命价值的真诚关怀和照顾。","options":["人道精神","人本主义精神","关怀的精神","主动服务的精神"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"护理人文关怀的定义强调护理人员本着人道精神，对患者的生命与健康、权利与需求、人格与尊严、生活质量与生命价值给予真诚关怀和照顾。故选A。"},{"id":"S394","num":394,"type":"single","q":"20世纪80年代，美国关怀科学家Watson博士提出，关怀是护理的(      )。关怀是护士的法定职责和义务。","options":["本质和核心","核心","责任","主要内容"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"Watson提出关怀是护理的本质和核心，关怀是护士的法定职责和义务。故选A。"},{"id":"S395","num":395,"type":"single","q":"护理人员工作时坚守岗位，遵循礼仪规范属于人文关怀环境规范的哪一项？","options":["关怀性物理环境","关怀性心理/社会环境","关怀性设施设置","医院关怀文化氛围"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"坚守岗位、遵循礼仪规范属于人的行为与氛围，归于关怀性心理/社会环境；物理环境、设施设置指硬件条件。故选B。"},{"id":"S396","num":396,"type":"single","q":"医用粘胶相关性皮肤损伤（MARSI）的核心定义不包含以下哪类损伤？","options":["机械性损伤","皮炎","压力性损伤","毛囊炎"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"MARSI（医用粘胶相关性皮肤损伤）的核心定义涵盖机械性损伤、皮炎（接触性/过敏性）、毛囊炎、浸渍等；压力性损伤是由压力或剪切力引起，属于另一类损伤。故选C。"},{"id":"S397","num":397,"type":"single","q":"依据T/CNAS 51-2025标准，高风险患者使用医用粘胶产品时，优先选择的类型是","options":["橡胶类高粘性粘胶","硅胶类低致敏性粘胶","聚异丁烯类普通粘胶","丙烯酸酯类强粘性粘胶"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"高风险患者应优先选择硅胶类低致敏性粘胶，粘性适中、移除时对皮肤损伤小；橡胶类、丙烯酸酯类粘性强，易引起皮肤损伤。故选B。"},{"id":"S398","num":398,"type":"single","q":"规范移除医用粘胶敷料的操作要求是","options":["垂直皮肤快速撕脱，节省操作时间","顺毛发生长方向，0°/180°平行皮肤缓慢剥离","用酒精浸湿敷料后立即揭除","牵拉皮肤至紧绷状态后剥离"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"移除粘胶敷料应顺毛发生长方向、以0°/180°平行于皮肤缓慢剥离，同时按压皮肤，减少表皮剥脱。垂直快速撕脱、牵拉皮肤紧绷均易造成损伤。故选B。"},{"id":"S399","num":399,"type":"single","q":"对于MARSI中的张力性水疱，直径≥2cm时的正确护理措施是","options":["直接刺破水疱，涂抹抗生素软膏","消毒后低位穿刺吸液，覆盖无菌敷料","暴露水疱，等待自然干涸","用碘伏消毒后加压包扎"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"直径≥2 cm的张力性水疱，应消毒后在水疱低位穿刺抽吸渗液，保留疱皮并覆盖无菌敷料；小水疱可保持完整。故选B。"},{"id":"S400","num":400,"type":"single","q":"MARSI风险评估的关键要求是","options":["仅在首次粘贴粘胶前评估1次","初次使用粘贴粘胶前及皮肤状况变化时需动态评估","仅评估外源性风险因素即可","年龄＜65岁患者无需评估"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"MARSI风险评估应动态进行：初次使用粘胶前评估，皮肤状况变化时重新评估；并综合内源性与外源性风险因素。故选B。"},{"id":"S401","num":401,"type":"single","q":"输注刺激性或发疱性抗肿瘤药物时，不应使用的血管通路装置是","options":["中心静脉血管通路","外周血管通路装置","一次性静脉输液钢针","植入式静脉给药装置"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"刺激性或发疱性抗肿瘤药物外渗后组织损伤严重，应通过中心静脉、外周血管通路装置或植入式给药装置输注，不应使用一次性静脉输液钢针（易穿破血管、固定不牢）。故选C。"},{"id":"S402","num":402,"type":"single","q":"使用便携式输注泵输注抗肿瘤药物时，宜选择的血管通路是","options":["外周静脉血管通路","中心静脉血管通路","一次性静脉输液钢针","输液港"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"使用便携式输注泵持续输注抗肿瘤药物时间长、药物刺激性强，宜选择中心静脉血管通路（如PICC、CVC），安全性更高。故选B。"},{"id":"S403","num":403,"type":"single","q":"收集含抗肿瘤药物的医疗废弃物时，容器应具备的标识是？（  ）","options":["感染性废物标识","有毒性药物标识","损伤性废物标识","病理性废物标识"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"含抗肿瘤药物的医疗废弃物具有细胞毒性，收集容器应有\"有毒性药物\"标识，以区别于感染性、损伤性、病理性废物，防止职业暴露。故选B。"},{"id":"S404","num":404,"type":"single","q":"依据T/CNAS 53-2025标准，抗肿瘤药物静脉给药前的医嘱核对要求是","options":["单人核对即可","双人核对，确认药物相关信息及溶媒","仅核对药物名称和剂量","无需核对给药顺序"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"抗肿瘤药物静脉给药前须双人核对，核对内容包括药物名称、剂量、给药途径、溶媒、给药顺序等，防止用药错误。故选B。"},{"id":"S405","num":405,"type":"single","q":"吞咽障碍患者口服给药过程中最致命的危险是","options":["药物剂量不足","误吸与窒息","依从性下降","营养不良"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"吞咽障碍患者口服给药时，药物或液体易误入气道，造成误吸和窒息，是最致命的危险；其余选项虽可能发生，但不危及生命。故选B。"},{"id":"S406","num":406,"type":"single","q":"误吸是指液体或固体物质进入","options":["口腔","食管","声门以下气道","胃"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"误吸指液体或固体物质（食物、口咽分泌物、胃内容物）进入声门以下的气道。故选C。"},{"id":"S407","num":407,"type":"single","q":"给药前吞咽功能快速初步筛查常用","options":["洼田饮水试验","VFSS","V-VST","吞咽造影"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"洼田饮水试验操作简单、无需设备，常用于给药前吞咽功能的快速初步筛查；VFSS（吞咽造影）是金标准，需特殊设备。故选A。"},{"id":"S408","num":408,"type":"single","q":"V-VST 的中文名称是","options":["视频吞咽造影检查","容积-黏度吞咽测试","反复唾液吞咽测试","吞咽诱发测试"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"V-VST是Volume-Viscosity Swallow Test，即容积-黏度吞咽测试，通过不同容积和黏度的液体评估吞咽安全性和有效性。故选B。"},{"id":"S409","num":409,"type":"single","q":"下列哪种口服药物剂型通常不可碾碎","options":["普通片","缓释片","分散片","咀嚼片"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"缓释片、控释片、肠溶片碾碎后会破坏缓释结构，导致药物突释或失效，通常不可碾碎；普通片、分散片、咀嚼片可碾碎或分散后服用。故选B。"},{"id":"S410","num":410,"type":"single","q":"吞咽障碍患者无法坐起时，给药至少应采取多少度的半卧位","options":["10°-15°","20°-25°","30°-45°","60°-90°"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"吞咽障碍患者无法坐起时，给药至少应采取30°～45°半卧位，以减少误吸风险；服药后仍保持体位一段时间。故选C。"},{"id":"S411","num":411,"type":"single","q":"偏瘫患者喂食者应站于","options":["患侧","健侧","头侧","足侧"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"偏瘫患者喂食时，喂食者应站于健侧，食物放在健侧口腔后部，利用健侧咀嚼和吞咽，降低误吸风险。故选B。"},{"id":"S412","num":412,"type":"single","q":"POCT的中文全称是","options":["即时检验/床边检测","常规实验室检测","集中检验","快速生化检测"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"POCT即Point-of-Care Testing，中文为即时检验（床边检测），在患者身边快速得到结果。故选A。"},{"id":"S413","num":413,"type":"single","q":"POCT的核心优势不包括","options":["极速出结果","操作简便","可完全替代检验科标准检验","减少患者往返"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"POCT的优势是出结果快、操作简便、减少患者往返；但其准确度和检测范围有限，不能完全替代检验科的标准检验。故选C。"},{"id":"S414","num":414,"type":"single","q":"所有POCT项目必须同步开展","options":["室内质控和室间质评","仅室内质控","仅室间质评","不需要质控"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"所有POCT项目必须同步开展室内质控和室间质评，以保证结果准确可靠。故选A。"},{"id":"S415","num":415,"type":"single","q":"POCT质控分级中，A级要求POCT项目比对符合率达到","options":["0.8","0.9","0.95","1"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"按题库依据的POCT质控分级，A级要求项目比对符合率达到95%。故选C。"},{"id":"S416","num":416,"type":"single","q":"允许误差（控制限）中，室内质控通常为","options":["0.05","0.1","0.15","0.2"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"按题库依据，室内质控的允许误差（控制限）通常为5%。故选A。"},{"id":"S417","num":417,"type":"single","q":"医院POCT管理牵头部门是","options":["检验科","医务科","护理部","设备科"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"按我院规定，医院POCT管理的牵头部门是医务科，检验科负责技术指导和质控。故选B。"},{"id":"S418","num":418,"type":"single","q":"POCT检验结果报告书写要求","options":["可使用铅笔","可使用圆珠笔","必须使用钢笔或签字笔","可涂改"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"检验报告属医疗文书，必须用钢笔或签字笔书写，字迹清晰，不得涂改，便于长期保存。故选C。"},{"id":"S419","num":419,"type":"single","q":"便携式血糖仪检测原理中，当前主流技术是","options":["化学比色法","电化学法","光学法","离心法"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"目前便携式血糖仪主流检测技术是电化学法（葡萄糖氧化酶/脱氢酶产生电流），具有样本量少、速度快、抗干扰较好的优点。故选B。"},{"id":"S420","num":420,"type":"single","q":"血糖检测采血时，消毒使用","options":["75%乙醇","95%乙醇","碘伏","生理盐水"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"血糖检测采血前用75%乙醇消毒，待其完全干燥后再采血，避免酒精混入血样影响结果。故选A。"},{"id":"S421","num":421,"type":"single","q":"血糖检测时，应弃去第几滴血","options":["第一滴","第二滴","第三滴","不弃去"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"第一滴血可能混有组织液或残留消毒液，影响结果，应弃去第一滴，用第二滴血进行检测。故选A。"},{"id":"S422","num":422,"type":"single","q":"便携式血糖仪与生化分析仪比对，血糖仪测定值大于4.2 mmol/L时，差异应小于","options":["0.05","0.1","0.15","0.2"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"按题库依据的比对要求，血糖仪测定值>4.2 mmol/L时，与生化分析仪结果的差异应小于20%。故选D。"},{"id":"S423","num":423,"type":"single","q":"血糖仪贮存环境要求","options":["阳光直射","高温潮湿","阴凉干燥、避光通风","强磁场"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"血糖仪应存放在阴凉干燥、避光通风处，避免阳光直射、高温潮湿和强磁场，以保证试纸和仪器性能。故选C。"},{"id":"S424","num":424,"type":"single","q":"维生素C等强还原剂对血糖检测结果的影响是","options":["假性偏高","假性偏低","无影响","不确定"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"维生素C等强还原剂会干扰电化学反应，使血糖检测结果假性偏低。故选B。"},{"id":"S425","num":425,"type":"single","q":"红细胞压积(HCT)过高会使血糖检测结果","options":["偏高","偏低","无影响","不确定"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"红细胞压积（HCT）过高时血液黏稠，影响试纸反应，使血糖结果偏低；HCT过低则偏高。故选B。"},{"id":"S426","num":426,"type":"single","q":"血糖检测温度需维持在","options":["0-10℃","10-25℃","25-37℃","任意温度"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"血糖检测应在10～25℃（环境温度适宜）的范围内进行，温度过高或过低都会影响酶反应和测定结果。故选B。"},{"id":"S427","num":427,"type":"single","q":"护理工作兼具人文关怀与什么双重属性","options":["技术操作","法律规范","经济效益","科研创新"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"护理工作既体现人文关怀，又受法律规范约束，护士须依法执业、履行法定义务，兼具人文与法律双重属性。故选B。"},{"id":"S428","num":428,"type":"single","q":"《民法典》第1218条确立的医疗损害责任原则是","options":["无过错责任","过错责任","公平责任","连带责任"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"《民法典》第1218条规定，患者在诊疗活动中受到损害，医疗机构或其医务人员有过错的，由医疗机构承担赔偿责任，确立的是过错责任原则。故选B。"},{"id":"S429","num":429,"type":"single","q":"《民法典》第1219条规定，实施特殊检查、特殊治疗前，需取得","options":["科室主任同意","患者或家属明确同意","护士长同意","医务科批准"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"《民法典》第1219条要求，实施手术、特殊检查、特殊治疗前，应向患者说明病情和医疗措施，并取得其明确同意；不宜向患者说明的，应向近亲属说明并取得同意。故选B。"},{"id":"S430","num":430,"type":"single","q":"《民法典》第1222条规定，下列哪种情形直接推定医疗机构有过错","options":["治疗效果不佳","患者不配合","隐匿、伪造、篡改或销毁病历","限于当时水平难以诊疗"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"《民法典》第1222条规定，隐匿或拒绝提供病历资料、伪造篡改或违法销毁病历，以及违反诊疗规范遗失病历等情形，直接推定医疗机构有过错。故选C。"},{"id":"S431","num":431,"type":"single","q":"《护士条例》规定，护士发现医嘱违反法律、法规或诊疗规范，应当","options":["立即执行","自行修改","及时报告","忽略不管"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"《护士条例》规定，护士发现医嘱违反法律、法规、规章或诊疗技术规范的，应当及时向开具医嘱的医师提出，必要时向有关负责人报告，不得盲目执行或擅自修改。故选C。"},{"id":"S432","num":432,"type":"single","q":"护理文书书写的十二字原则是","options":["客观、真实、准确、及时、完整、规范","快速、简洁、方便、省时、省力、经济","全面、细致、生动、形象、具体、详实","科学、严谨、创新、实用、安全、有效"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"护理文书书写原则为客观、真实、准确、及时、完整、规范，这是护理记录的基本要求。其他选项不是文书书写原则。故选A。"},{"id":"S433","num":433,"type":"single","q":"护士代家属签署《跌倒风险告知书》，法院判决医院承担全部赔偿责任，主要因为","options":["告知书内容不全","病历真实性存疑","护士态度不好","家属未到场"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"护士代家属签字属于伪造签名，使病历的真实性存疑；在举证责任上医院难以证明已履行告知义务，故被判承担全部责任。故选B。"},{"id":"S434","num":434,"type":"single","q":"护士擅自调快输液速度致患者死亡，主要违反","options":["三查七对","分级护理","严格执行医嘱义务","消毒隔离"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"输液速度应严格按医嘱执行，护士擅自调快速度并致死，违反了严格执行医嘱的义务。故选C。"},{"id":"S435","num":435,"type":"single","q":"实习护士将本该输液泵输注的液体给予静滴，主要警示","options":["实习生可独立操作","带教老师无需在场","实习生高危操作禁止独立执行","输液泵无需核对"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"实习护士不具备独立执业资格，高危操作（如泵入药物）必须在带教老师直接指导下进行，禁止独立执行。故选C。"},{"id":"S436","num":436,"type":"single","q":"医疗纠纷发生后，第一步应","options":["立即报警","冷静沟通，安抚患方情绪","封存病历","向上级报告"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"医疗纠纷发生后，第一步应冷静沟通、安抚患方情绪，防止矛盾激化；随后按流程封存病历、上报并处理。故选B。"},{"id":"S437","num":437,"type":"single","q":"医疗纠纷处理中，国家推荐的首选途径是","options":["双方协商","人民调解","行政调解","司法诉讼"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"国家鼓励医疗纠纷通过人民调解解决，由专业调解组织居中调解，具有中立、免费、效率高的特点，是首选途径。故选B。"},{"id":"S438","num":438,"type":"single","q":"《医疗机构投诉管理办法》确立的核心原则是","options":["首诉负责制","分级负责制","谁主管谁负责","集体负责制"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"《医疗机构投诉管理办法》确立首诉负责制，即患者向医疗机构的任何部门或人员投诉，被投诉人都有责任受理并跟进，不得推诿。故选A。"},{"id":"S439","num":439,"type":"single","q":"护理核心制度中，最严重的护理差错通常违反","options":["分级护理","三查七对","交接班制度","消毒隔离"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"三查七对是护理核心制度，也是防止给药和治疗错误的最后一道防线，最严重的护理差错多源于违反三查七对。故选B。"},{"id":"S440","num":440,"type":"single","q":"2026年施行的《山东省医疗纠纷预防和处理办法》强调","options":["事后赔偿","源头预防","行政罚款","舆论管控"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"医疗纠纷预防和处理办法的立法理念是预防为先、源头治理，强调通过规范诊疗、加强沟通来减少纠纷，而非事后赔偿。故选B。"},{"id":"S441","num":441,"type":"single","q":"用于血型初检与输血相容性检测的血液标本，要求是","options":["必须同一时间采集","必须不同时间采集（紧急抢救除外）","可随意采集","仅需采集1次即可"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"血型初检与输血相容性检测的标本，要求不同时间采集（紧急抢救除外），以核对血型、避免因采血错误导致血型误判。故选B。"},{"id":"S442","num":442,"type":"single","q":"采集输血相容性检测标本时，正确做法是","options":["由1名护士单独采集","2名医护人员床旁双人核对","可提前贴好标签再带到床旁","可提前先采集，存放标本架，等用的时候再贴上标签从输液肢体直接采血"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"采集输血相容性检测标本必须由2名医护人员在床旁核对患者身份并当场贴标签，不可提前贴标签或提前采集，也不得从输液肢体采血。故选B。"},{"id":"S443","num":443,"type":"single","q":"根据《济宁市献血管理办法》规定，当血液供应紧缺时，在保证急危重症及孕产妇等患者用血的前提下，同等条件下可优先保障哪些人群的用血","options":["献血者本人","献血者本人及其父母、配偶和子女","献血者配偶、父母、子女、兄弟姐妹、祖父母、外祖父母、配偶父母、子女配偶","借朋友或非直系亲属献血证的患者"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"按题库依据，血液紧缺时，在保证急危重症及孕产妇用血的前提下，可优先保障献血者本人及其父母、配偶和子女。故选B。"},{"id":"S444","num":444,"type":"single","q":"根据《济宁市献血管理办法》规定，在本市行政区域内献血的无偿献血者，除本人可以享受无限量用血费用减免外，哪些人群可以享受减免累计不超过无偿献血者献血量的用血费用","options":["献血者父母、兄弟姐妹","献血者其父母、配偶和子女","献血者配偶、父母、子女、兄弟姐妹、祖父母、外祖父母","献血者配偶、父母、子女、兄弟姐妹、祖父母、外祖父母、配偶父母、子女配偶"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"按《济宁市献血管理办法》，献血者本人享受无限量用血费用减免；配偶、父母、子女、兄弟姐妹、祖父母、外祖父母、配偶父母、子女配偶可在不超过献血量的范围内减免。故选D。"},{"id":"S445","num":445,"type":"single","q":"输血完毕后的空血袋，应由用血科室保存多长时间后按医疗废物处理？","options":["12小时","24小时","48小时","72小时"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"输血完毕后的空血袋应由用血科室保存24小时，以备出现输血反应时追溯检验，之后按医疗废物处理。故选B。"},{"id":"S446","num":446,"type":"single","q":"疑似发生输血不良反应时，护理人员首先应采取的措施是？","options":["立即报告医生","立即停止输血","立即更换输液器","立即送检标本"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"疑似发生输血不良反应时，首要措施是立即停止输血，保留静脉通路（更换输液器、输注生理盐水），再报告医生并处理，以防反应加重。故选B。"},{"id":"S447","num":447,"type":"single","q":"使用电子设备核对患者输血信息时，还需额外进行什么操作？","options":["单人再次核对","口头再次双人核对","无需额外操作","电话核对"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"使用电子设备（PDA）核对输血信息时，仍需额外进行口头双人核对，确保患者与血液信息一致。故选B。"},{"id":"S448","num":448,"type":"single","q":"血液发出后原则上不得退回，同一袋血液最多允许退回几次？","options":["1次","2次","3次","无限制"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"血液发出后原则上不得退回，如确需退回，同一袋血液最多只允许退回1次，并须符合储存条件等规定。故选A。"},{"id":"S449","num":449,"type":"single","q":"紧急抢救、血型不明时，可优先发放","options":["O型红细胞+AB型血浆","A型红细胞+B型血浆","AB型红细胞+O型血浆","任意血型血液"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"紧急抢救、血型不明时，可优先发放O型红细胞和AB型血浆（O型红细胞无A、B抗原，AB型血浆无抗A、抗B抗体），可减少溶血反应风险。故选A。"},{"id":"S450","num":450,"type":"single","q":"下列哪种情况的血液，护理人员核对时应拒绝接收/输注？","options":["血袋标签完整清晰","血液在有效期内","血袋有破损渗漏","血浆无异常凝块"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"血袋有破损渗漏会导致污染，不得输注；标签完整清晰、在有效期内、血浆无异常凝块均是可接收的条件。故选C。"},{"id":"S451","num":451,"type":"single","q":"全血输注的绝对禁忌证为","options":["急性大出血患者","严重创伤患者","长期慢性贫血患者","低血容量休克患者"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"长期慢性贫血患者血容量正常，输全血易加重循环负荷、引起心衰，应输注红细胞制品，所以是全血输注的禁忌；急性大出血、严重创伤、低血容量休克可输全血。故选C。"},{"id":"S452","num":452,"type":"single","q":"护士接收临床用血时，血袋外观检查内容错误的是","options":["检查血袋有无破损、渗漏","观察血液有无凝块、溶血、浑浊","无需查看抗凝剂状态","检查标签是否完整清晰"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"接收血液时需检查血袋有无破损渗漏、血液有无凝块溶血浑浊、标签是否完整及抗凝剂状态等。\"无需查看抗凝剂状态\"错误。故选C。"},{"id":"S453","num":453,"type":"single","q":"开始输血后，前多长时间内需缓慢滴注，严密观察患者反应","options":["10分钟","15分钟","30分钟","60分钟"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"输血开始后前15分钟应缓慢滴注（约10～20滴/分），严密观察有无不良反应，无异常再调整至正常速度。故选B。"},{"id":"S454","num":454,"type":"single","q":"成人常规输血速度控制范围为","options":["1～2ml/min","3～5ml/min","6～8ml/min","10ml/min以上"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"成人常规输血速度约为3～5 ml/min（约60滴/分左右），年老体弱或心功能不全者应减慢。故选B。"},{"id":"S455","num":455,"type":"single","q":"一袋全血或红细胞制品输注完毕最长时限不得超过？","options":["2小时","3小时","4小时","6小时"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"一袋全血或红细胞制品应在4小时内输注完毕，防止室温下细菌繁殖。故选C。"},{"id":"S456","num":456,"type":"single","q":"血小板输注的最佳储存温度为？","options":["2～6℃","室温20～24℃振荡保存","-20℃冷冻保存","0℃恒温保存"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"血小板应在20～24℃室温下振荡保存，低温会导致血小板活化聚集、功能受损。故选B。"},{"id":"S457","num":457,"type":"single","q":"交叉配血试验必须确保（），杜绝标本混淆","options":["一人一管、一单一采","多人合并采血","批量统一送检","口头核对信息即可"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"交叉配血试验必须做到一人一管、一单一采，杜绝标本混淆；多人合并采血、批量送检、仅口头核对均存在错误风险。故选A。"},{"id":"S458","num":458,"type":"single","q":"对于头颈部创伤的成人心脏骤停患者，若推举下颌法和气道辅助装置无效，2025版AHA指南对经过训练施救者推荐的气道开放方法及推荐等级为（）","options":["仰头提颏法，1级","仰头提颏法，2b级","继续推举下颌法，2a级","环甲膜穿刺，3级"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"按题库依据的2025版AHA指南，头颈部创伤的心脏骤停患者，若推举下颌法和气道辅助装置均无效，经过训练的施救者可考虑改用仰头提颏法（2b级推荐）。故选B。"},{"id":"S459","num":459,"type":"single","q":"2025版AHA指南关于成人心脏骤停通气潮气量的要求是（）","options":["固定500‑600mL","给予能够产生可见胸廓隆起的潮气量","800‑1000mL","10‑15mL/kg"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"2025版AHA指南强调通气应给予\"能产生可见胸廓隆起\"的潮气量，不再强调固定毫升数，以避免通气不足和过度通气。故选B。"},{"id":"S460","num":460,"type":"single","q":"建立高级气道之前，2025版AHA指南对非专业施救者与专业医护人员按压‑通气比推荐为（）","options":["0.62638888889","1.2513888889","0.20902777778","持续按压不给予通气"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"建立高级气道之前，成人CPR的按压通气比为30:2（选项B，原文为被误转成时间格式的\"30:2\"）。持续按压不通气适用于已建立高级气道后。故选B。"},{"id":"S461","num":461,"type":"single","q":"根据2025版AHA指南，婴儿胸外按压推荐手法为（）","options":["传统双指按压法","单掌根或者双拇指环抱法","单手掌全掌按压","两手掌叠加按压"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"婴儿胸外按压推荐单掌根按压或双拇指环抱法，其中双拇指环抱法更易达到足够按压深度；传统双指法不再作为优先推荐。故选B。"},{"id":"S462","num":462,"type":"single","q":"2025版AHA指南新增要求：心脏骤停婴幼儿胸外按压暂停时间应控制在（）","options":["5秒以内","10秒以内","15秒以内","20秒以内"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"按压中断会使冠脉灌注压迅速下降，指南要求婴幼儿胸外按压暂停时间控制在10秒以内。故选B。"},{"id":"S463","num":463,"type":"single","q":"2025AHA指南对于成人女性心脏骤停贴除颤电极片的新增建议是（）","options":["必须完全脱去文胸，保证皮肤裸露","调整文胸位置而非脱除可能更为合理","电极片贴于文胸外侧即可","禁止使用AED对女性施救"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"2025版指南指出，女性贴除颤电极片时，调整文胸位置而非完全脱除可能更合理，以减少延误并保护隐私；同时不应因性别而放弃使用AED。故选B。"},{"id":"S464","num":464,"type":"single","q":"2025版AHA指南针对肥胖成人心脏骤停患者CPR技术建议为（）","options":["按压深度较普通人增加20%","应采用与非肥胖者相同的CPR技术","优先使用坐位CPR","必须使用机械按压装置"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"指南建议肥胖成人心脏骤停患者采用与非肥胖者相同的CPR技术（相同按压深度、频率和除颤方案），不需额外加深或必须使用机械装置。故选B。"},{"id":"S465","num":465,"type":"single","q":"院内心脏骤停IHCA链条第一个环节是（）","options":["启动应急反应系统","及早识别与预防","高质量CPR","除颤"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"院内心脏骤停（IHCA）生存链的第一个环节是\"及早识别与预防\"，即通过早期预警发现病情恶化，避免发生骤停；启动应急反应、高质量CPR、除颤依次在其后。故选B。"},{"id":"S466","num":466,"type":"single","q":"院外心脏骤停OHCA的急救链条不包含下面哪一项（）","options":["及早识别与预防","启动应急反应系统","高质量CPR、除颤","高级心肺复苏"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"院外心脏骤停（OHCA）生存链从\"启动应急反应系统\"开始，后续是高质量CPR与除颤、高级心肺复苏等；\"及早识别与预防\"是IHCA链条的第一环节，不在OHCA链条内。题干问\"不包含\"，故选A。"},{"id":"S467","num":467,"type":"single","q":"2025版指南提示，实施人工呼吸施救者应当避免（）","options":["胸廓轻微起伏","通气不足以及过度通气","按压通气30:2","尽量缩短按压中断"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"人工呼吸既要保证有效通气（胸廓隆起），也要避免通气不足和过度通气，过度通气会升高胸内压、减少回心血量并增加胃胀气和误吸风险。30:2和尽量缩短按压中断都是推荐做法。故选B。"},{"id":"S468","num":468,"type":"single","q":"下面关于2025AHA指南婴儿CPR说法正确的是（）","options":["继续优先采用传统双指按压法","双拇指环抱法更易达到足够按压深度","按压中断最长不超过15秒","婴儿不建议使用AED除颤"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"2025版指南婴儿CPR推荐双拇指环抱法，更容易达到足够的按压深度；传统双指法不再优先，按压中断应不超过10秒（C的15秒错误），婴儿心脏骤停同样可以使用AED。故选B。"},{"id":"S469","num":469,"type":"single","q":"女性，院外突发心脏骤停，施救者准备粘贴AED电极片，依据2025AHA指南，下列操作合理的是（）","options":["必须强行脱去全部内衣","调整文胸位置，不必完全脱除","电极片隔着衣物直接粘贴","放弃AED只做胸外按压"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"与第463题同一知识点：女性患者贴电极片时，调整文胸位置而不必完全脱除是合理做法。电极片不能隔着衣物粘贴，也不应放弃AED。故选B。"},{"id":"S470","num":470,"type":"single","q":"肥胖成年男性院外心脏骤停，目击者启动CPR，按照2025版AHA指南，CPR操作应该（）","options":["加大按压深度至8‑10cm","采用与非肥胖成人相同CPR技术","减少按压频率避免肋骨骨折","立即等待机械按压设备到场"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"与第464题同一知识点：肥胖成人按标准CPR技术实施，无需加大深度、降低频率或等待机械设备，等待会延误抢救。故选B。"},{"id":"S471","num":471,"type":"single","q":"鼻胃管双固定法中，胶布固定松紧度以容纳几指为宜？","options":["一指","二指","三指","四指"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"鼻胃管胶布固定应松紧适宜，以能容纳一指为宜，过紧会压迫鼻翼导致压力性损伤，过松则易脱管。故选A。"},{"id":"S472","num":472,"type":"single","q":"鼻胃管固定胶布应每多少小时更换固定位置？","options":["24小时","48小时","72小时","每周"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"鼻胃管固定胶布应每48小时更换固定位置（污染、潮湿或松脱时随时更换），以防鼻部压力性损伤。故选B。"},{"id":"S473","num":473,"type":"single","q":"持续经泵输注肠内营养液时，应每几小时冲管一次？","options":["2小时","4小时","6小时","8小时"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"持续经泵输注肠内营养时，营养液黏稠易附着管壁，应每4小时用温开水冲管一次，防止堵管。故选B。"},{"id":"S474","num":474,"type":"single","q":"肠内营养冲管时每次应使用温开水冲管，如何冲管？","options":["脉冲式","缓慢式","滴入式","冲击式"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"肠内营养管冲管应采用脉冲式（推一下停一下）冲洗，通过产生湍流更好地清除管壁残留物，比缓慢匀速冲洗效果好。故选A。"},{"id":"S475","num":475,"type":"single","q":"对免疫功能受损或危重患者，冲管宜使用哪种液体？","options":["生理盐水","温开水","灭菌注射用水","碳酸氢钠溶液"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"免疫功能受损或危重患者感染风险高，冲管宜使用灭菌注射用水，以降低经管路带入微生物的风险。故选C。"},{"id":"S476","num":476,"type":"single","q":"固体药物经营养管注入前须研磨溶解，需用至少多少毫升温水？","options":["10ml","15ml","20ml","30ml"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"固体药物经营养管注入前须研磨成粉并充分溶解，溶解用温水至少15 ml，给药前后再分别冲管，避免药物沉淀堵管。故选B。"},{"id":"S477","num":477,"type":"single","q":"pH值≤多少的酸性液体药物严禁与营养液混合？","options":["pH≤3","pH≤4","pH≤5","pH≤6"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"酸性药物（pH≤5）与营养液混合会使蛋白质变性、凝固，堵塞管路，因此严禁混合。故选C。"},{"id":"S478","num":478,"type":"single","q":"一次性推注肠内营养液时，单次体积不宜超过多少毫升？","options":["200ml","300ml","400ml","500ml"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"按本题库依据，一次性推注肠内营养液单次不宜超过400 ml，以降低腹胀、反流和误吸风险。故选C。"},{"id":"S479","num":479,"type":"single","q":"持续经泵输注的起始速度为多少？","options":["10-20ml/h","20-50ml/h","50-80ml/h","80-100ml/h"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"持续经泵输注应循序渐进，起始速度为20～50 ml/h，耐受后再逐步加量。故选B。"},{"id":"S480","num":480,"type":"single","q":"开封后的肠内营养液常温悬挂不得超过多长时间？","options":["4小时","6小时","8小时","12小时"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"按本题库依据，开封后的肠内营养液常温悬挂不得超过8小时，超时易细菌繁殖，应更换。故选C。"},{"id":"S481","num":481,"type":"single","q":"肠内营养液的理想输注温度是？","options":["30℃-35℃","37℃-40℃","40℃-45℃","45℃-50℃"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"肠内营养液理想输注温度为37～40℃，接近体温。过冷易引起腹泻腹痛，过热会烫伤黏膜、破坏营养成分。故选B。"},{"id":"S482","num":482,"type":"single","q":"胃残余量（GRV）超过多少毫升时应立即暂停喂养？","options":["200ml","250ml","400ml","500ml"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"按题库答案，胃残余量（GRV）超过500 ml应立即暂停喂养并评估。（临床上不少指南以200～250 ml作为需关注的界限，具体以本院规定为准。）故选D。"},{"id":"S483","num":483,"type":"single","q":"喂养管堵塞时首选的处理方法是？","options":["导丝通管","温开水冲洗","碳酸氢钠冲洗","暴力推注"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"喂养管堵塞首选温开水脉冲式冲洗并回抽；导丝通管、暴力推注可能损伤或穿破管路，不可首选。故选B。"},{"id":"S484","num":484,"type":"single","q":"温水冲管无效时，可使用哪种溶液浸泡分解堵塞物？","options":["生理盐水","5%葡萄糖","5%碳酸氢钠","碘伏溶液"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"温水冲管无效时，可用5%碳酸氢钠溶液浸泡，其碱性环境能溶解蛋白凝块，分解堵塞物。故选C。"},{"id":"S485","num":485,"type":"single","q":"肠内营养耐受性评分达到多少分时应立即暂停肠内营养？","options":["≥3分","≥4分","≥5分","≥6分"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"按肠内营养耐受性评分，≥5分提示不耐受，应立即暂停肠内营养并处理；3～4分减慢速度、观察。故选C。"},{"id":"S486","num":486,"type":"single","q":"长期留置鼻饲管者，建议每多长时间更换对侧鼻孔？","options":["1-2周","2-3周","4-6周","8-10周"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"长期留置鼻饲管者，建议每4～6周更换对侧鼻孔，以减轻鼻黏膜压迫和损伤。故选C。"},{"id":"S487","num":487,"type":"single","q":"根据《临床营养治疗管理规范》，住院患者营养风险筛查应在入院后多长时间内完成？","options":["12小时","24小时","48小时","72小时"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"《临床营养治疗管理规范》要求住院患者入院后24小时内完成营养风险筛查，以便尽早干预。故选B。"},{"id":"S488","num":488,"type":"single","q":"目前国际上应用最广泛的住院患者营养风险筛查工具是？","options":["MNA","SGA","NRS2002","PG-SGA"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"NRS 2002是欧洲肠外肠内营养学会（ESPEN）推荐的住院患者营养风险筛查工具，应用最广泛；MNA主要用于老年人，SGA、PG-SGA用于营养评估。故选C。"},{"id":"S489","num":489,"type":"single","q":"NRS2002营养风险筛查总评分达到多少分判定为存在营养风险？","options":["≥2分","≥3分","≥4分","≥5分"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"NRS 2002总评分≥3分判定为存在营养风险，需要制定营养支持计划；<3分每周复查。故选B。"},{"id":"S490","num":490,"type":"single","q":"医院基本膳食不包括以下哪一项？","options":["普通膳食","软食","半流质膳食","高蛋白膳食"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"医院基本膳食包括普通膳食、软食、半流质膳食、流质膳食；高蛋白膳食属于治疗膳食（根据病情调整营养素）。故选D。"},{"id":"S491","num":491,"type":"single","q":"适用于咀嚼困难、消化功能较弱患者的医院膳食是？","options":["普通膳食","软食","流质膳食","治疗膳食"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"软食质地软、易咀嚼消化，适用于咀嚼困难、消化功能较弱、低热及老年患者。故选B。"},{"id":"S492","num":492,"type":"single","q":"以下哪项属于治疗膳食？","options":["半流质膳食","低盐膳食","软食","流质膳食"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"治疗膳食是根据病情调整营养素或成分的膳食，如低盐、低脂、高蛋白、糖尿病膳食等。半流质、软食、流质属于基本膳食。故选B。"},{"id":"S493","num":493,"type":"single","q":"流质膳食一般每日供给多少餐次？","options":["3餐","4-5餐","6-7餐","8-10餐"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"流质膳食每次量少，需少量多餐，一般每日6～7餐，既保证摄入又减轻胃肠负担。故选C。"},{"id":"S494","num":494,"type":"single","q":"营养治疗五阶梯中的第一阶梯是？","options":["口服营养补充","全肠内营养","饮食+营养教育","部分肠外营养"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"营养治疗五阶梯从下到上依次为：饮食+营养教育→饮食+口服营养补充（ONS）→全肠内营养→部分肠内营养+部分肠外营养→全肠外营养。第一阶梯是饮食+营养教育。故选C。"},{"id":"S495","num":495,"type":"single","q":"营养治疗五阶梯的正确顺序是？","options":["饮食+营养教育→饮食+ONS→全肠内营养→部分肠内营养+部分肠外营养→全肠外营养","ONS→饮食+营养教育→全肠内营养→部分肠外营养→全肠外营养","饮食+营养教育→全肠内营养→ONS→部分肠外营养→全肠外营养","饮食+营养教育→ONS→部分肠外营养→全肠内营养→全肠外营养"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"五阶梯顺序遵循\"由简单到复杂、尽量利用胃肠道\"的原则：饮食+营养教育→饮食+ONS→全肠内营养→部分肠内+部分肠外→全肠外。故选A。"},{"id":"S496","num":496,"type":"single","q":"ONS是以下哪项的英文缩写？","options":["全肠外营养","口服营养补充","肠内营养","部分肠外营养"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"ONS是Oral Nutritional Supplements的缩写，即口服营养补充；全肠外营养为TPN，肠内营养为EN。故选B。"},{"id":"S497","num":497,"type":"single","q":"当患者经口进食无法满足营养需求多少时，应考虑给予肠内营养支持？","options":["30%-40%","40%-50%","50%-60%","60%-70%"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"当患者经口进食不能满足目标需要量的50%～60%时，应考虑给予肠内营养支持。故选C。"},{"id":"S498","num":498,"type":"single","q":"肠内营养制剂中，氨基酸型制剂的特点是？","options":["需要消化吸收","无需消化直接吸收","含完整蛋白质","渗透压较低"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"氨基酸型（要素型）制剂由氨基酸、单糖等小分子组成，无需消化、可直接吸收，适用于消化吸收功能严重障碍者；其渗透压相对较高。故选B。"},{"id":"S499","num":499,"type":"single","q":"肠内营养输注时，床头应抬高多少度以预防误吸？","options":["15°-20°","20°-25°","30°-45°","50°-60°"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"肠内营养输注时床头应抬高30°～45°，输注结束后保持30分钟，可减少反流误吸。故选C。"},{"id":"S500","num":500,"type":"single","q":"重症患者肠内营养启动时机，推荐在进入ICU后多少小时内开始？","options":["12-24小时","24-48小时","48-72小时","72小时后"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"重症患者在血流动力学稳定后应尽早开始肠内营养，推荐进入ICU后24～48小时内启动，有助于维护肠黏膜屏障、减少感染。故选B。"},{"id":"S501","num":501,"type":"single","q":"肠内营养的首选途径是？","options":["鼻胃管","鼻肠管","胃造瘘","口服"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"只要患者能经口进食，口服是最符合生理、最安全方便的营养摄入途径，因此首选口服；管饲是不能经口时才选择的途径。故选D。"},{"id":"S502","num":502,"type":"single","q":"肠内营养最常见的胃肠道并发症是？","options":["恶心呕吐","腹胀","腹泻","便秘"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"腹泻是肠内营养最常见的胃肠道并发症，与输注速度过快、渗透压高、温度低、污染等有关。故选C。"},{"id":"S503","num":503,"type":"single","q":"预防肠内营养相关性腹泻，以下措施错误的是？","options":["控制输注速度","营养液低温输注","严格无菌操作","循序渐进增加剂量"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"低温营养液会刺激肠道、增加腹泻，故\"低温输注\"是错误措施，应加温至37～40℃。控制速度、无菌操作、循序渐进都是正确预防措施。题干问\"错误\"，故选B。"},{"id":"S504","num":504,"type":"single","q":"肠内营养最严重的并发症是？","options":["腹泻","腹胀","误吸","管路堵塞"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"误吸可导致吸入性肺炎、窒息，严重时危及生命，是肠内营养最严重的并发症；腹泻、腹胀、堵管虽常见但危害较小。故选C。"},{"id":"S505","num":505,"type":"single","q":"临床营养诊疗工作的首要核心依据是（  ）","options":["患者主观饮食喜好","营养风险筛查与评估结果","医护人员临床经验","医院膳食储备情况"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"临床营养诊疗应以客观、规范的营养风险筛查与评估结果为依据，再制定个体化方案，而不是依据主观喜好或经验。故选B。"},{"id":"S506","num":506,"type":"single","q":"临床上开展营养诊疗工作，需严格遵循的核心原则是（  ）","options":["先治疗、后营养","营养支持优先于药物治疗","基于营养风险分层开展个体化诊疗","所有住院患者统一标准化营养干预"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"营养诊疗的核心原则是基于营养风险分层开展个体化诊疗：风险不同、方案不同，不能对所有患者\"一刀切\"，也不是简单的\"先治疗后营养\"或\"营养优先\"。故选C。"},{"id":"S507","num":507,"type":"single","q":"对于存在营养风险、可正常经口进食但摄入不足的患者，优先采用的营养干预阶梯是（  ）","options":["第一阶梯","第二阶梯（口服营养补充）","第三阶梯（全肠内营养）","第四阶梯（肠内+肠外联合营养）"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"能正常经口进食但摄入不足的患者，优先采用口服营养补充（ONS），在饮食基础上增加营养；若摄入仍不足再升级。故选B（第二阶梯）。"},{"id":"S508","num":508,"type":"single","q":"医院治疗膳食的核心定义是（  ）","options":["医院统一制作的普通患者餐食","根据患者病情、诊疗需求调整营养素配比、性状的专用膳食","仅针对慢性病患者的低盐低脂膳食","专供术后患者的流质膳食"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"治疗膳食是根据患者病情和诊疗需要，调整营养素配比或性状（如低盐、低脂、糖尿病、肾病膳食）的专用膳食，不仅限于慢性病或术后患者。故选B。"},{"id":"S509","num":509,"type":"single","q":"肠内营养管路护理中，成人鼻饲管常规冲管时间为（  ）","options":["每4-6小时一次，输注前后必冲管","每日一次即可","仅输注结束后冲管","出现堵塞后再冲管"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"成人鼻饲管常规每4～6小时冲管一次，每次输注（给药）前后必须冲管，以防堵管。故选A。"},{"id":"S510","num":510,"type":"single","q":"营养治疗五阶梯的递进原则是（  ）","options":["由肠外到肠内、由辅助到替代","由口服到管路、由简单到复杂","优先高级阶梯，快速改善营养","固定阶梯模式，不做动态调整"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"营养治疗五阶梯的递进原则是由口服到管路、由简单到复杂，并根据患者情况动态调整。故选B。"},{"id":"S511","num":511,"type":"single","q":"对于完全无法经口进食、胃肠道功能正常的患者，首选营养干预方式为（  ）","options":["肠外营养","全肠内营养管路输注","口服营养补充","单纯静脉补液"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"胃肠道功能正常但无法经口进食时，应首选肠内营养（全肠内营养管路输注），\"只要肠道能用就用肠道\"，肠外营养用于肠内无法满足时。故选B。"},{"id":"S512","num":512,"type":"single","q":"医院营养管理工作的法定核心依据不包括（  ）","options":["国家临床营养相关政策法规","行业诊疗指南与专家共识","科室自行制定的非规范经验","医疗质量控制标准"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"医院营养管理应以国家政策法规、行业指南与专家共识及医疗质量控制标准为依据；科室自行制定的非规范经验不属于法定核心依据。题干问\"不包括\"，故选C。"},{"id":"S513","num":513,"type":"single","q":"高钾血症时，早期心电图改变是","options":["ST段低平","出现U波","T波倒置","QT间期缩短","T波高尖，PR间期延长"],"letters":["A","B","C","D","E"],"answer":[4],"answerLetters":["E"],"cat":"综合护理题库","explanation":"高钾血症早期心电图表现为T波高尖（帐篷状）、PR间期延长；血钾继续升高可出现QRS增宽、P波消失，最终室颤。ST段低平、U波、T波倒置多见于低钾血症。故选E。"},{"id":"S514","num":514,"type":"single","q":"心电图对区别心肌梗死和心绞痛最有意义的改变是","options":["病理性Q波","T波异常高耸","ST段上抬","T波倒置","合并心律失常"],"letters":["A","B","C","D","E"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"心肌梗死时心肌坏死，出现病理性Q波（宽而深），这是不可逆损伤的标志；心绞痛是可逆性缺血，仅有ST-T改变，不出现病理性Q波。故选A。"},{"id":"S515","num":515,"type":"single","q":"监护急性心肌梗死患者时，发现哪种心律失常高度警惕室颤发生","options":["心房颤动","心房扑动","室性心动过速","室上性心动过速","房室传导阻滞"],"letters":["A","B","C","D","E"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"急性心梗患者出现室性心动过速，是室颤和猝死的先兆，需高度警惕并立即处理。故选C。"},{"id":"S516","num":516,"type":"single","q":"男性，30岁，阵发性心悸2年，每次突然发生，持续20分钟到1小时不等，心率200次/分，律齐，ORS波形正常，P波显示不清","options":["房颤","窦速","房扑","阵发性室上速"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"阵发性心悸、突发突止，心率约200次/分、节律规整、QRS正常、P波不清，是阵发性室上性心动过速（PSVT）的典型表现。房颤节律不齐，房扑呈锯齿波，窦速很少达200次/分。故选D。"},{"id":"S517","num":517,"type":"single","q":"心电图表现为PR间期延长，QRS波群正常的心律失常","options":["房早","室性心动过速","阵发性室上性心动过速","房室传导阻滞"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"PR间期延长而QRS正常，提示房室传导延迟，为一度房室传导阻滞（房室传导阻滞的表现），房早、室速、室上速均不是这种改变。故选D。"},{"id":"S518","num":518,"type":"single","q":"青年突发突发突止心悸，心电图窄QRS、节律规整、无P波，诊断","options":["房颤","室上速","室速","房扑","窦性心动过速"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"突发突止的心悸，心电图窄QRS、节律规整、无明显P波，是阵发性室上性心动过速（室上速）。故选B。"},{"id":"S519","num":519,"type":"single","q":"心梗猝死、心电示室颤，首要抢救","options":["静推利多卡因","非同步直流电除颤","肾上腺素静注","气管插管","按压"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"室颤时心室无有效收缩，首要抢救措施是尽快非同步直流电除颤（室颤无QRS波，无法同步）。按压、肾上腺素、利多卡因、插管均排在除颤之后或同步进行。故选B。"},{
