<!doctype html><html lang="zh-CN"><head><meta name="ms-sp-authoring-source" content="agent"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#15836f"><title>护理刷题</title><style>
:root{--g:#15836f;--bg:#f4f7f6;--ink:#19352e}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,#0d7563,#22a286);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:28px}header p{margin:8px 0 0;opacity:.92}main{max-width:780px;margin:auto;padding:16px 16px 110px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button,.card{border:0;border-radius:18px;background:#fff;box-shadow:0 4px 16px #153b3020}.mode{padding:20px 10px;font-size:16px;font-weight:700;color:#23463d}.mode span{display:block;font-size:27px;margin-bottom:7px}.stats{display:flex;gap:9px;margin:14px 0}.stat{flex:1;text-align:center;padding:12px 5px;background:#fff;border-radius:15px}.stat b{display:block;font-size:21px;color:var(--g)}select{width:100%;padding:13px;border:1px solid #d8e5e1;border-radius:12px;background:#fff;font-size:16px}.qcard{padding:20px}.top{display:flex;justify-content:space-between;gap:8px;color:#607a73;font-size:13px}.question{font-size:20px;line-height:1.55;font-weight:700;margin:16px 0}.opt{display:flex;gap:12px;width:100%;text-align:left;padding:14px;margin:9px 0;border:2px solid #e5eeeb;background:#fff;border-radius:14px;font-size:16px;box-shadow:none}.opt.sel{border-color:#29a789;background:#effbf8}.opt.good{border-color:#1e9d67;background:#eaf9f0}.opt.bad{border-color:#d85454;background:#fff0f0}.actions{display:flex;gap:10px;margin-top:16px}.primary,.secondary{padding:14px 12px;font-weight:700;font-size:16px;flex:1}.primary{background:var(--g);color:#fff}.secondary{background:#e5efec;color:#294d44}.feedback{margin-top:14px;padding:14px;border-radius:12px;background:#eef6f4;display:none;line-height:1.65}.why{margin-top:9px;padding-top:9px;border-top:1px solid #cfe2dc}.small{font-size:13px;color:#698079}.pill{padding:5px 9px;background:#e8f4f1;border-radius:99px;color:#21715e;white-space:nowrap}.full{grid-column:1/-1}.search{margin:10px 0;width:100%;padding:12px;border:1px solid #d8e5e1;border-radius:12px;font-size:16px}.banner{background:#fff8e7;border:1px solid #f0d994;border-radius:12px;padding:10px;font-size:13px;color:#765918;margin:12px 0}@media(max-width:420px){.question{font-size:18px}}
.loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#0d7563,#22a286)}.loginCard{width:min(440px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 14px 40px #003d3038}.loginCard h1{margin:0 0 4px;text-align:center}.loginCard p{text-align:center;color:#698079}.loginCard input{width:100%;padding:14px;margin:8px 0;border:1px solid #d8e5e1;border-radius:12px;font-size:16px}.loginBtn{width:100%;padding:14px;margin-top:10px;background:var(--g);color:#fff;font-weight:700;font-size:16px}.userbar{display:flex;justify-content:space-between;align-items:center;background:#eaf5f2;margin:0 0 12px;padding:9px 12px;border-radius:12px}.logout{box-shadow:none;background:transparent;color:#9b3b3b;font-weight:700}.loginErr{color:#c33;text-align:center;min-height:20px;font-size:14px}#appShell{display:none}.catalogBtn{position:fixed;right:14px;top:45%;z-index:20;width:48px;height:48px;border-radius:50%;background:var(--g);color:#fff;font-size:22px;box-shadow:0 5px 18px #1238}.drawerMask{display:none;position:fixed;inset:0;background:#0005;z-index:29}.drawer{position:fixed;top:0;right:-86%;width:min(86%,380px);height:100%;background:#fff;z-index:30;transition:right .25s ease;padding:calc(18px + env(safe-area-inset-top)) 16px 24px;box-shadow:-8px 0 30px #0003}.drawer.open{right:0}.drawerMask.open{display:block}.drawerHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.drawerClose{box-shadow:none;background:#e9f1ef;padding:8px 12px}.jumpBox{display:flex;gap:8px;margin-bottom:12px}.jumpBox input{min-width:0;flex:1;padding:10px;border:1px solid #d8e5e1;border-radius:10px;font-size:16px}.jumpBox button{padding:10px 14px;background:var(--g);color:#fff}.qgrid{height:calc(100vh - 190px);overflow-y:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-bottom:30px}.qnum{box-shadow:none;padding:10px 2px;border:1px solid #d8e5e1;border-radius:10px}.qnum.current{background:var(--g);color:#fff;border-color:var(--g)}.qnum.done{background:#e7f6f1;border-color:#96d3c2}.resumeNote{font-size:13px;color:#56756d;margin:8px 0 0}</style></head><body><section id="loginScreen" class="loginWrap"><div class="loginCard"><h1>🩺 护理刷题</h1><p>请输入个人账号登录</p><input id="loginUser" inputmode="numeric" autocomplete="username" placeholder="账号，例如 001"><input id="loginPass" type="password" autocomplete="current-password" placeholder="密码"><div id="loginErr" class="loginErr"></div><button class="loginBtn" onclick="login()">登录</button><p class="small">个人练习版 · 学习记录保存在当前设备</p></div></section><div id="appShell"><header><h1>🩺 护理刷题</h1><p>新题库 746 题 · 每题附答案解析</p></header><main><section id="home"><div id="adminPanel" style="display:none;background:white;padding:18px;border-radius:18px;margin-bottom:14px"><h2 style="margin-top:0">👑 管理员中心</h2><p class="small">可修改 001-010 的密码。本简单版数据只保存在当前管理员设备，修改后需把密码告知对应用户。</p><div id="accountList"></div></div><div class="userbar"><span>当前账号：<b id="currentUser"></b></span><button class="logout" onclick="logout()">退出登录</button></div><div class="stats"><div class="stat"><b id="doneN">0</b>已答</div><div class="stat"><b id="rightN">0</b>正确</div><div class="stat"><b id="wrongN">0</b>错题</div></div><div class="banner">说明：本版题目、答案和解析均直接采用新题库文档内容；涉及院内制度、指南或法规时，请以现行正式文件为准。</div><div id="resumeNote" class="resumeNote"></div><input id="search" class="search" placeholder="搜索题目关键词"><select id="cat"><option value="全部">全部题目（746题）</option></select><br><br><div class="grid"><button class="mode" onclick="start('seq')"><span>📚</span>继续顺序练习</button><button class="mode" onclick="restartSequence()"><span>⏮️</span>从第1题开始</button><button class="mode" onclick="start('rand')"><span>🎲</span>随机练习</button><button class="mode" onclick="start('exam')"><span>📝</span>模拟考试</button><button class="mode" onclick="start('wrong')"><span>❌</span>错题重练</button><button class="mode full" onclick="resetStats()"><span>🔄</span>清空学习记录</button></div></section><section id="quiz" style="display:none"><button id="catalogBtn" class="catalogBtn" style="display:none" onclick="toggleCatalog(true)">☰</button><div id="drawerMask" class="drawerMask" onclick="toggleCatalog(false)"></div><aside id="drawer" class="drawer"><div class="drawerHead"><h3 style="margin:0">题目目录</h3><button class="drawerClose" onclick="toggleCatalog(false)">关闭</button></div><div class="jumpBox"><input id="jumpInput" type="number" min="1" placeholder="输入题号"><button onclick="jumpByInput()">跳转</button></div><div id="qgrid" class="qgrid"></div></aside><div class="card qcard"><div class="top"><span id="progress"></span><span class="pill" id="kind"></span></div><div class="question" id="q"></div><div id="opts"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="secondary" onclick="goHome()">返回</button><button class="primary" id="submit" onclick="submitAns()">提交答案</button><button class="primary" id="next" style="display:none" onclick="nextQ()">下一题</button></div></div></section></main><script>const BANK=[{"id":"S1","num":1,"type":"single","q":"多腔CVC维护要求（）","options":["各腔独立冲封管","统一冲管即可","闲置腔不用封管","混合冲管"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"多腔CVC每个管腔都是独立的血液通路，都会接触血液，因此必须各腔分别冲管、封管，不能只冲一个腔代替全部。闲置腔也要按时维护，否则易形成血栓、堵管，并增加感染风险。"},{"id":"S2","num":2,"type":"single","q":"肝素过敏、活动性出血患者封管首选（）","options":["肝素盐水","生理盐水","葡萄糖","药液"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"肝素过敏或有活动性出血的患者，使用肝素可能引起过敏、肝素诱导的血小板减少症，或加重出血。这类患者应改用0.9%氯化钠注射液封管。"},{"id":"S3","num":3,"type":"single","q":"中心静脉导管冲封管标准操作原则是（）","options":["快速推注、常压封管","脉冲式冲管、正压封管","匀速推注、负压封管","随意推注"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"脉冲式（推-停-推）冲管能在管腔内形成湍流，冲净管壁上的药物残留和血液沉积物。正压封管是在推注最后一点封管液时边推边退针或夹闭，防止血液回流入管腔而堵管。"},{"id":"S4","num":4,"type":"single","q":"导管相关血流感染确诊后，首选处理是（）","options":["继续保留导管观察","立即拔除感染导管","仅更换敷料","冲管后继续使用"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"确诊导管相关血流感染（CRBSI）后，感染导管是持续的感染源，通常应立即拔除（尤其是短期CVC），再遵医嘱使用抗生素。继续留管、只换敷料或冲管后再用，都不能清除导管内的细菌和生物膜。"},{"id":"S5","num":5,"type":"single","q":"输液附加装置使用原则是（）","options":["越多越好","尽量减少，降低感染风险","常规加装三通","随意搭配"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"输液附加装置（三通、延长管、无针接头等）每增加一个连接点，就多一次污染和感染的机会，所以应在满足治疗需要的前提下尽量减少。不宜常规加装三通，也不能随意搭配。"},{"id":"S6","num":6,"type":"single","q":"CVC置管首选穿刺部位为（）","options":["股静脉","锁骨下静脉","颈内静脉","外周静脉"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"成人CVC置管时，锁骨下静脉的导管相关感染和血栓风险低于颈内静脉和股静脉，所以指南首选锁骨下静脉。股静脉靠近会阴，感染风险高；外周静脉不属于CVC穿刺部位。锁骨下穿刺气胸风险较高，应由有资质的人员操作，必要时在超声引导下进行。"},{"id":"S7","num":7,"type":"single","q":"为降低感染风险，应尽量避免的CVC穿刺部位是（）","options":["锁骨下静脉","股静脉","颈外静脉","上肢静脉"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"股静脉靠近会阴部，皮肤菌群多、易被污染，且活动时敷料易松动，导管相关感染和下肢深静脉血栓的风险都明显高于锁骨下静脉、颈内静脉，所以成人应尽量避免经股静脉置管。"},{"id":"S8","num":8,"type":"single","q":"无针接头消毒标准为（）","options":["快速擦拭1秒","充分摩擦消毒、完全待干后连接","盐水擦拭即可","无需消毒"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"无针接头是微生物进入管路的重要入口。消毒时要用消毒剂多方位用力擦拭，达到规定时间（通常不少于5秒），并等其完全干燥后再连接。擦拭时间太短、只用盐水擦拭或不消毒，都达不到消毒效果。"},{"id":"S9","num":9,"type":"single","q":"INS2024推荐静脉穿刺首选皮肤消毒剂为（）","options":["碘伏","2%葡萄糖酸氯己定醇","75%酒精","苯扎溴铵"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"INS指南推荐静脉穿刺前首选含氯己定的醇溶液（如2%葡萄糖酸氯己定乙醇）进行皮肤消毒。它起效快、杀菌谱广，且有持续抑菌作用，降低导管相关感染的效果优于碘伏和单纯酒精。"},{"id":"S10","num":10,"type":"single","q":"沿静脉走向出现条索状红线、红肿热痛，提示发生（）","options":["导管堵塞","静脉炎","药物渗出","过敏反应"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"沿静脉走向出现红线（条索状）、红、肿、热、痛，是静脉炎的典型表现。导管堵塞表现为输液不畅或无法回抽；药物渗出表现为穿刺点周围肿胀、皮温低；过敏反应则以皮疹、瘙痒为主。"},{"id":"S11","num":11,"type":"single","q":"常规静脉导管冲管首选液体为（）","options":["肝素盐水","0.9%氯化钠注射液","5%葡萄糖","灭菌注射用水"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"常规静脉导管冲管首选0.9%氯化钠注射液，它与血液等渗，安全、无抗凝副作用，且不会与多数药物发生配伍反应。葡萄糖易滋生微生物，灭菌注射用水为低渗液，都不适合用于冲管。"},{"id":"S12","num":12,"type":"single","q":"怀疑导管相关血流感染采血，正确方式是（）","options":["仅导管内采血","导管与外周静脉分别采血培养","仅采外周血","从输液管路采血"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"怀疑CRBSI时，应同时从导管和外周静脉分别采血做培养，通过比较两份血培养的阳性时间差和细菌数量来判断感染是否来自导管。只采一处血，或从输液管路采血，都容易污染，无法判断。"},{"id":"S13","num":13,"type":"single","q":"中心静脉导管冲管禁止使用小于多少规格注射器（）","options":["5ml","10ml","20ml","30ml"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"注射器规格越小，推注时产生的压力越大，容易造成导管破裂或导管移位。中心静脉导管冲管应使用不小于10ml的注射器，所以禁止使用小于10ml的规格。"},{"id":"S14","num":14,"type":"single","q":"药物外渗发生后，首要操作是（）","options":["立即拔管","停止输液、保留导管、回抽残余药液","局部热敷","局部冷敷"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"发生药物外渗后，首先要停止输液，保留导管（便于回抽和后续处理），并尽量回抽导管及周围残留药液，减少药物在组织中的存留量。随后再通知医生，按药物性质选择冷敷或热敷、使用拮抗剂等。不应一开始就盲目拔管或随意热敷、冷敷。"},{"id":"S15","num":15,"type":"single","q":"抽出的药液、开启的静脉溶媒，使用时限不超过（）","options":["1h","2h","4h","6h"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"药液抽出或溶媒开启后暴露在空气中，污染风险随时间增加，所以抽出的药液、开启的静脉溶媒应在2小时内使用完毕，超时应丢弃。"},{"id":"S16","num":16,"type":"single","q":"禁止使用外周静脉短导管输注的药物是（）","options":["普通补液","腐蚀性、刺激性药物","维生素类药物","电解质溶液"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"腐蚀性、刺激性药物（如化疗药、高渗液等）对血管壁损伤大，外周短导管血流量小、药物稀释不充分，容易引起静脉炎、药物外渗和组织坏死，应通过PICC、CVC或输液港等中心静脉通路输注。"},{"id":"S17","num":17,"type":"single","q":"静配中心提供的输液标签右上角显示“11批、12批、13批”，指的是（  ）。","options":["8:00  9:00  10:00用药","16:00  20:00  0:00用药","20:00   0:00   2:00用药","14:00   16:00   20:00用药"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"静配中心按用药时间把输液分成不同批次配送，标签右上角的\"11批、12批、13批\"分别对应16:00、20:00、0:00用药。具体批次与时间对应关系以本院规定为准。"},{"id":"S18","num":18,"type":"single","q":"关于病区发送的紧急静脉用药，说法正确的是 （  ）。","options":["每小时配送一次","每40分钟配送一次","每半小时安排配送一次，遇特殊情况电话沟通随时安排配送，不加药的空液体不按照紧急执行，非紧急情况不随意勾选“紧急”","每两小时配送一次"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"紧急静脉用药每半小时安排配送一次，特殊情况可电话沟通后随时配送。为保证真正紧急的用药不被延误，不加药的空液体不按紧急执行，非紧急情况也不能随意勾选\"紧急\"。其他选项的配送间隔不符合规定。"},{"id":"S19","num":19,"type":"single","q":"下列说法正确的是（   ）","options":["压疮分期分为6期","1期压疮表现为皮肤完整，皮肤呈紫红色","2期压疮为部分皮层缺失，伤口床呈粉色，有活性，也可表现为完整的或破损的浆液性水疱","有腐肉，可见窦道和潜行就一定是4期压疮"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"2期压疮是部分皮层缺失，伤口床呈粉红色、有活性，也可表现为完整或破损的浆液性水疱，所以C正确。A错：压疮分期不止6期的说法不严谨，常规为1-4期，另有不可分期和深部组织损伤。B错：1期是皮肤完整、指压不变白的红斑，紫红色提示深部组织损伤。D错：有腐肉、窦道和潜行，可能是3期、4期或不可分期，不能\"一定\"判为4期。"},{"id":"S20","num":20,"type":"single","q":"下列不属于压疮高危因素的是：（   ）","options":["大小便失禁","营养不良","烧伤","D. 强迫体位"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"大小便失禁（皮肤潮湿、浸渍）、营养不良（组织抵抗力差）和强迫体位（局部持续受压）都是公认的压疮高危因素。烧伤不属于题库认定的压疮典型高危因素，所以选C。"},{"id":"S21","num":21,"type":"single","q":"关于压疮下列说法正确的是：（   ）","options":["皮肤出现发红可给与按摩","给危重患者翻身时应避免拖拉拽","因为失禁导致的患者皮肤破溃也是压疮。","因为使用血氧饱和度夹导致的患者耳朵皮肤出现破溃不属于压疮。"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"给危重患者翻身时要避免拖、拉、拽，防止产生摩擦力和剪切力，所以B正确。A错：皮肤发红不能按摩，按摩会加重软组织损伤。C错：失禁导致的皮肤破溃属于失禁相关性皮炎，不是压疮。D错：血氧饱和度夹导致的耳部破溃属于医疗器械相关压力性损伤，是压疮的一种。"},{"id":"S22","num":22,"type":"single","q":"下列说法不正确的是：（   ）","options":["压疮随着时间的发展而发展。","长时期低压和短时间的高压都会导致压疮。","压疮的发生与营养不良有关系，应注意营养评估，补充营养","压疮的发生与发展与患者心理因素没有关系"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"压疮的发生与发展和患者的心理因素有关（如情绪低落、长期应激会影响进食、活动和组织修复），所以D\"没有关系\"的说法不正确。A、B、C均正确：压疮会随时间发展；长期低压和短时高压都可致压疮；营养不良会增加压疮风险。"},{"id":"S23","num":23,"type":"single","q":"符合压疮高风险预警上报流程的是（  ）","options":["符合压疮高风险预警患者，责任护士在海泰异常上报直报系统填写《压疮高风险预警申报表》，当日提交科护士长","压疮（造口）管理小组现场评估审核指导，当将审核结果提交至上报人","转科后同时递交至相关科室，做好交接，患者解除高风险或出院后通知原科室结案。","患者解除高风险或出院后护士长当天结案"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"按题库答案，压疮高风险预警的结案要求是：患者解除高风险或出院后，由护士长当天结案，所以选D。该题依据本院内部上报流程，其他选项在提交对象和结案方式上与制度不符，建议再对照本院《压疮高风险预警上报制度》核实。"},{"id":"S24","num":24,"type":"single","q":"预防医疗器械相关压疮下列说法错误的是(    )","options":["在医疗器械使用过程中，密切关注周围皮肤的受压情况，保持皮肤清洁干燥","及时为患者调整体位，重新放置医疗器械，使用压力再分布","必要时考虑使用预防性敷料来预防医疗器械相关性压疮","尽早去除相关医疗器械"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"本题题库答案为D。但从指南角度看，医疗器械相关压疮的预防措施包括：观察器械周围皮肤并保持清洁干燥（A）、调整体位并重新放置器械、使用压力再分布（B）、必要时使用预防性敷料（C），以及器械不再需要时尽早去除。D的内容本身是正确的，题干要求选\"错误\"项，建议再核对原题或题库答案。"},{"id":"S25","num":25,"type":"single","q":"使用敷料时，下列说法不正确的是(   )","options":["选择一种超过创面边缘4-5cm的敷料","根据不同部位选择合适的敷料","注意评估患者的经济状况和预后情况","用手压住敷料约30秒钟，以助定位"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"选用敷料时，一般应选择超出创面边缘2-3cm的敷料，而不是4-5cm，所以A说法不正确。B、C、D均是正确做法：按部位选敷料，评估经济状况和预后，用手压住敷料约30秒（利用体温使其贴合）。"},{"id":"S26","num":26,"type":"single","q":"压疮评估过程中常见的错误(   )","options":["患者入院后 2 小时内完成评估","如遇急症手术等特殊情况返回后完成评估","评分≤18分，有发生压疮的风险，床头警示牌，并做好预防措施，填写《压疮极高风险预警上报表》","病情变化如：（术后、产后、临时用药后、意识状态或肢体活动状态改变后、病情好转或恶化）再次评估"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"Braden评分≤18分只表示\"有发生压疮的风险\"（轻度风险），而\"极高风险\"通常是≤9分。把≤18分的患者填写《压疮极高风险预警上报表》，风险等级与上报表不匹配，所以C是评估中的错误做法。A、B、D均符合评估要求（入院后2小时内评估；急症特殊情况返回后补评；病情变化时再次评估）。"},{"id":"S27","num":27,"type":"single","q":"如何管理好失禁,下列错误的是（   ）","options":["找出失禁原因，与医生沟通后积极处理","给予导尿、肛周贴造口袋或使用OB内置式卫生棉解决大小便收集问题","及时清洗皮肤，用纱布或湿巾擦干皮肤","出现失禁性皮炎建议使用造口护肤粉、3M液体敷料保护皮肤"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"失禁后应及时清洗皮肤，并用柔软的毛巾轻轻蘸干（轻拍），避免用纱布或湿巾擦拭，因为擦拭会产生摩擦力，损伤已受浸渍的皮肤，所以C错误。A、B、D分别是病因处理、大小便收集和使用皮肤保护剂，都是失禁管理的正确措施。"},{"id":"S28","num":28,"type":"single","q":"关于1期压疮治疗下列说法错误的是(   )","options":["防止局部继续受压，保护皮肤，促进血运","使用气垫床，解除受压，预防剪切力，发红区皮肤加压按摩,增加翻身次数","管理失禁，温水清洗皮肤和局部。","可使用赛肤润涂抹"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"1期压疮发红区的皮肤已受损，禁止加压按摩，按摩会加重软组织损伤，所以B错误。正确做法是解除受压、预防剪切力、增加翻身次数；管理失禁并用温水清洗；可涂抹皮肤保护剂（如赛肤润）。"},{"id":"S29","num":29,"type":"single","q":"下列不属于强迫体位的是（   ）","options":["心力衰竭","呼吸衰竭","右股骨颈骨折","骨盆骨折、多发外伤等病情严重、医嘱严格限制翻身的患者"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"强迫体位是因病情被迫采取、不能随意改变的体位，如心力衰竭、呼吸衰竭的端坐位，以及骨盆骨折、多发外伤等医嘱严格限制翻身的情况。按题库答案，单纯的右股骨颈骨折不属于强迫体位，所以选C。"},{"id":"S30","num":30,"type":"single","q":"关于2期压疮下列说法说法错误的是（  ）","options":["部分皮层缺失,表现为浅表的开放型溃疡","创面呈粉红色，无腐肉。也可表现为完好的或开放/破损的血疱。","外观呈肿亮或干燥的浅表溃疡，","不应使用 2 期来描述皮肤撕裂、医用胶布所致损伤、会阴部皮炎、浸渍糜烂或表皮脱落。如出现局部组织瘀血肿胀，需考虑可能有深部组织损伤"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"2期压疮表现为部分皮层缺失，创面呈粉红色、无腐肉，水疱应是完整或破损的浆液性水疱。血疱提示深部组织损伤，不属于2期，所以B错误。A、C、D的描述符合2期特点。"},{"id":"S31","num":31,"type":"single","q":"不符合符合3期压疮特点的是（   ）","options":["可见皮下脂肪，但骨、肌腱、肌肉并未外露","可有腐肉存在，并掩盖组织损失的深度","可出现窦道和潜行。","鼻梁、耳朵、枕骨处、踝部因无皮下组织，因此这些部位发生3期压疮可能是表浅溃疡"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"3期压疮可有腐肉，但腐肉不会掩盖组织损失的深度。如果腐肉或焦痂掩盖了损失深度，就应判为\"不可分期\"，所以B不符合3期特点。A、C、D均符合：可见皮下脂肪但骨、肌腱、肌肉不外露；可有窦道和潜行；无皮下组织的部位（鼻梁、耳、枕部、踝部）3期可能是表浅溃疡。"},{"id":"S32","num":32,"type":"single","q":"不符合符合4期压疮特点的是（   ）","options":["全层组织缺失,不伴有骨、肌腱或肌肉外露","伤口床的某些部位有腐肉或焦痂，常常有潜行或隧道","鼻梁、耳朵、枕骨处、踝部因无皮下组织，此阶段压疮可能是表浅溃疡，","可能扩展到肌肉和/或支持结构（例如筋膜、肌腱或关节囊），有可能造成骨髓炎"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"4期压疮是全层组织缺失，伴有骨、肌腱或肌肉外露，可有腐肉、焦痂、潜行或窦道，并可能导致骨髓炎。\"不伴有骨、肌腱或肌肉外露\"是3期的特点，所以A不符合4期。"},{"id":"S33","num":33,"type":"single","q":"不符合符合深部组织损伤期压疮特点的是（  ）","options":["皮肤呈持续的非苍白性深红色，栗色或紫色","深度不明的紫色或栗色局部褪色的完整皮肤或浆液性水泡","是由皮下组织受压力和/或剪力所致损伤而造成","某区域发生压疮之前，可表现为与周围组织相比有痛感、硬实、潮湿、有渗出、发热或发凉"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"深部组织损伤表现为持续不褪色的深红、栗色或紫色的完整皮肤，或充血性（血）水疱，由皮下组织受压力或剪切力损伤所致，发生前局部可有疼痛、硬实、潮湿、发热或发凉等改变。浆液性水疱是2期压疮的表现，所以B不符合。"},{"id":"S34","num":34,"type":"single","q":"造成压疮的力学因素不包括:(    )","options":["垂直压力","摩擦力","剪切力","反作用力"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"造成压疮的三大力学因素是垂直压力、摩擦力和剪切力。反作用力不是压疮的力学致病因素，所以选D。"},{"id":"S35","num":35,"type":"single","q":"水胶体敷料用于(     ) 期压疮预防","options":["1","2","1.2.3","不可分期"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"水胶体敷料能减轻摩擦和剪切力、保持局部湿润，可用于1、2、3期压疮的预防和治疗，所以选C。4期压疮创面深、渗出多，一般不单用水胶体敷料。"},{"id":"S36","num":36,"type":"single","q":"压力之下人体最先受累的是(     )","options":["表皮","真皮","肌肉","脂肪"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"肌肉和脂肪组织代谢旺盛、耗氧量大，对缺血缺氧最敏感，所以在压力作用下最先受累，损伤从深部向表层发展，容易出现\"表面看不出、深部已坏死\"的情况。表皮对缺血耐受力最强，最后才出现改变。"},{"id":"S37","num":37,"type":"single","q":"压力性损伤感染的表现包括(    )","options":["蜂窝组织","疼痛性质改变","渗出量增加","周围组织皮温升高","以上选项均正确"],"letters":["A","B","C","D","E"],"answer":[4],"answerLetters":["E"],"cat":"综合护理题库","explanation":"压力性损伤感染的表现包括：蜂窝织炎、疼痛性质改变（疼痛加重）、渗出量增加、周围组织皮温升高，以及红肿、异味、脓性渗出等。A、B、C、D均属感染表现，所以选E\"以上选项均正确\"。"},{"id":"S38","num":38,"type":"single","q":"压力性损伤3期已经侵犯皮肤到","options":["真皮层","表皮层","皮下脂肪层","肌肉"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"3期压疮是全层皮肤缺失，损伤已累及皮下脂肪层，但骨、肌腱、肌肉未外露。仅到真皮层是2期，到肌肉、骨骼属于4期。"},{"id":"S39","num":39,"type":"single","q":"发生手术压力性损伤以术后(   ) 最多见","options":["1-3天","4-6天","12小时","2小时"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"手术压力性损伤多由术中长时间固定体位、局部受压所致。损伤在术后不会立即显现，通常在术后1-3天最多见，所以选A。"},{"id":"S40","num":40,"type":"single","q":"由于使用医疗器械导致相应部位粘膜出现的压力性损伤属于(     )","options":["2期","医疗器械压力性损伤","4期","粘膜压力性损伤"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"医疗器械造成的压力性损伤发生在黏膜部位（如口腔、鼻腔、尿道黏膜）时，称为黏膜压力性损伤。黏膜组织的解剖特点使其无法按1-4期分期，所以按题库答案选D。"},{"id":"S41","num":41,"type":"single","q":"不属于压力性损伤主要危害的是","options":["皮肤及软组织坏死","神经炎","脓毒症","加重全身其他原发疾病"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"压力性损伤的主要危害包括皮肤及软组织坏死、继发感染引起脓毒症、加重原发疾病、延长住院时间等。神经炎不是其主要危害，所以选B。"},{"id":"S42","num":42,"type":"single","q":"下列可以用来压疮预防的敷料，除外(   )","options":["纱布","水胶体敷料","泡沫敷料","银离子藻酸盐敷料"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"水胶体敷料、泡沫敷料可用于压疮预防，减少摩擦和剪切力。银离子藻酸盐敷料主要用于渗出多或有感染风险的伤口，不用于预防，所以按题库答案选D。"},{"id":"S43","num":43,"type":"single","q":"不属于摩擦力造成皮肤损害的特点的是（  )","options":["去除外层保护性角化皮肤，增加皮肤对压疮的敏感性。","摩擦可使局部皮肤温度增高，温度升高1℃，能加快组织代谢并增加氧的需要量10%","在持续压力引起组织缺氧的情况下，温度升高将更增加压疮的易发性","摩擦力比垂直压力更具危害性"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"摩擦力的危害特点包括：破坏皮肤角质层、增加皮肤对压疮的敏感性（A）；使局部温度升高，温度每升高1℃，组织代谢和需氧量约增加10%（B）；与持续压力缺氧共同作用时更易发生压疮（C）。\"摩擦力比垂直压力更具危害性\"没有依据，垂直压力才是压疮的主要原因，所以D不属于其特点。"},{"id":"S44","num":44,"type":"single","q":"皮肤监测的内容不包括（  ）","options":["永久红斑","指压不退色的充血,大水泡","局部皮肤变热","皮肤色素沉着"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"皮肤监测应关注与压疮发生发展相关的变化：持续性红斑、指压不褪色的充血或水疱、局部发热或发凉等。皮肤色素沉着不是压疮预警指标，所以选D。"},{"id":"S45","num":45,"type":"single","q":"关于禁止按摩，下列说说法不正确的是（   ）","options":["按摩可以促进局部皮肤的血液循环,有助于预防压疮","尸检证明,凡经按摩的组织显示浸渍和变性,未经按摩的组织无撕裂现象。","如皮肤持续发红,则表明软组织损伤,按摩必将加重损伤","按摩后局部皮肤温度升高,增加组织细胞的代谢及耗氧量,骨突处组织血流量下降"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"压疮预防中禁止按摩。按摩不但不能预防压疮，反而会引起局部组织损伤：经按摩的组织出现浸渍和变性；皮肤持续发红说明软组织已受损，按摩会加重损伤；按摩使局部皮温升高、耗氧增加，骨突处血流量下降。所以\"按摩有助于预防压疮\"（A）的说法不正确。"},{"id":"S46","num":46,"type":"single","q":"不属于压疮发生的内源性因素的是(   )","options":["感知觉","营养","组织灌注状态、年龄、体重、体温升高、精神心理因素以及急性应激因素等。","潮湿"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"内源性因素是患者自身的因素，如感知觉、营养、组织灌注、年龄、体重、体温升高、精神心理因素和急性应激等。潮湿来自外部环境（如汗液、大小便、渗液），属于外源性因素，所以选D。"},{"id":"S47","num":47,"type":"single","q":"《Braden 压疮风险评估量表》得分越低，风险越高（）","options":["正确","错误"],"letters":["A","B"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"Braden量表分值范围6-23分，得分越低，说明感知、潮湿、活动、移动、营养、摩擦力和剪切力等方面的状况越差，压疮风险越高，所以该说法正确。"},{"id":"S48","num":48,"type":"single","q":"强迫体位患者可以自动列入高风险患者。（）","options":["正确","错误"],"letters":["A","B"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"强迫体位的患者被迫长时间保持某一体位，局部持续受压且不易变换体位，所以按题库规定可直接列入压疮高风险患者，该说法正确。"},{"id":"S49","num":49,"type":"single","q":"粘膜压力性损伤由于损伤组织的解剖特点，无法进行分期。（）","options":["正确","错误"],"letters":["A","B"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"黏膜压力性损伤发生在黏膜上，黏膜没有皮肤那样的分层结构，无法按1-4期分期，所以该说法正确。"},{"id":"S50","num":50,"type":"single","q":"压疮评分低、中风险患者每周评估 2 次（）","options":["正确","错误"],"letters":["A","B"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"按题库答案，\"低、中风险患者每周评估2次\"的说法错误，所以选B。压疮评估频次按风险等级确定，风险越高评估越频繁，具体频次以本院《压疮风险评估制度》为准。"},{"id":"S51","num":51,"type":"single","q":"压疮预防中提倡使用环状或圈形装置、充水手套。（）","options":["正确","错误"],"letters":["A","B"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"该说法错误，所以选B。环状或圈形装置（如橡胶圈）、充水手套会压迫周围组织，使周围血液回流受阻，造成静脉充血和水肿，反而增加压疮风险，所以压疮预防中不提倡使用。"},{"id":"S52","num":52,"type":"single","q":"压疮高风险患者预防性使用新型敷料可以减少翻身次数（）","options":["正确","错误"],"letters":["A","B"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"该说法错误，所以选B。新型敷料（如泡沫敷料）能减轻摩擦力和剪切力，是预防措施的补充，但不能解除局部压力，所以不能替代翻身，也不能因此减少翻身次数。"},{"id":"S53","num":53,"type":"single","q":"充分抬高足跟，可在跟腱下垫一个软枕，预防足跟部压力伤（）","options":["正确","错误"],"letters":["A","B"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"该说法错误，所以选B。预防足跟压力伤要使足跟悬空，软枕应垫在小腿下方，使足跟离开床面。垫在跟腱下，会使跟腱或足跟继续受压。"},{"id":"S54","num":54,"type":"single","q":"按摩可以促进局部皮肤的血液循环,有助于预防压疮（）","options":["正确","错误"],"letters":["A","B"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"该说法错误，所以选B。压疮预防中禁止按摩，按摩会加重软组织损伤，使局部耗氧增加、骨突处血流量下降。预防靠的是解除压力，不是按摩。"},{"id":"S55","num":55,"type":"single","q":"体位变换是预防压疮的最有效措施。使用各种器具和敷料都不能替代翻身（）","options":["正确","错误"],"letters":["A","B"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"该说法正确，所以选A。定时变换体位能直接解除局部持续受压，是预防压疮最有效、最基本的措施。气垫床、敷料等只是辅助手段，不能替代翻身。"},{"id":"S56","num":56,"type":"single","q":"关于预防性皮肤护理，下列说法不正确的是","options":["保持皮肤清洁并适当补充水分","失禁后立即清洁皮肤","避免使用碱性肥皂和清洁剂","用柔软的多层软聚硅酮泡沫敷料保护受压部位，减少翻身次数"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"题干问\"说法不正确\"的一项。D不正确，因为软聚硅酮泡沫敷料只能减轻摩擦和剪切力，保护受压部位，不能解除压力，不能因此减少翻身次数。A、B、C分别是保持皮肤清洁并补水、失禁后立即清洁、避免碱性清洁剂，都是正确做法。"},{"id":"S57","num":57,"type":"single","q":"若出现以下现象则高度怀疑创面有生物膜","options":["创面延迟愈合，适当治疗后2周没有愈合迹象","创面深或面积大，伤口破裂，存在坏死组织","周围组织温度升高、疼痛、恶臭","抗生素治疗无效"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"生物膜是细菌分泌基质包裹形成的结构，对抗生素耐受，所以抗生素治疗无效是高度提示创面有生物膜的典型表现，题库答案选D。创面延迟愈合（A）、坏死组织多（B）、局部皮温升高和恶臭（C）也是常见线索，但特异性较低。本题题库答案与\"以上都是\"的常见说法有出入，建议再核对原题。"},{"id":"S58","num":58,"type":"single","q":"护理人员值班、交接班制度中要求各班按时交接班，接班者需要（   ）到病房，清点药品、物品，在接班者未到岗前，交班者不得离开岗位。","options":["提前15分钟","提前5分钟","交接班正点","没有明确要求"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"《护理人员值班、交接班制度》要求接班者提前15分钟到病房，清点药品和物品，接班者未到岗前，交班者不得离开岗位，所以选A。其他选项与制度不符。"},{"id":"S59","num":59,"type":"single","q":"采用Barthel自理能力评估量表对患者日常生活活动进行评定,Barthel指数分值达到（  ），自理能力等级为重度依赖。","options":["总分41~60分","总分≤40分","总分61~99分","总分100分"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"Barthel指数分级：总分≤40分为重度依赖，41~60分为中度依赖，61~99分为轻度依赖，100分为无需依赖。所以重度依赖对应总分≤40分。"},{"id":"S60","num":60,"type":"single","q":"抢救车上的氧气瓶24小时处于备用状态,当氧气瓶内压力低于（  ）时，电话通知中心供氧人员取回重新充氧或更换,严禁在科室现场充装气体。","options":["10MPa","5MPa","15MPa","3MPa"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"抢救车上的氧气瓶要保证随时可用，压力低于5MPa时应电话通知中心供氧人员取回重新充氧或更换，严禁在科室现场充装气体，所以选B。"},{"id":"S61","num":61,"type":"single","q":"对于院外带入压疮，入院后当班责任护士需要填写上报的表单是（  ）？","options":["《皮肤压力伤上报表》","《压疮高风险预警申报表》","A+B","无需上报"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"院外带入的压疮已经存在，应上报《皮肤压力伤上报表》，所以选A。《压疮高风险预警申报表》针对的是尚未发生压疮、但评估为高风险的患者，两者用途不同。该题依据本院上报制度，请以本院规定为准。"},{"id":"S62","num":62,"type":"single","q":"为患者实施约束时，注意保持约束肢体的功能位及一定活动度，约束用具松紧度为（  ），约束部位应给予皮肤保护。","options":["以能容纳1—2横指为宜","以能容纳2—3横指为宜","以能容纳3—4横指为宜","约束用具与肢体无缝隙"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"约束用具松紧度应以能容纳1—2横指为宜。太紧会影响肢体血液循环，造成皮肤损伤；太松则容易挣脱，起不到约束作用。"},{"id":"S63","num":63,"type":"single","q":"抢救结束后于(   )小时补下医嘱,执行者签全名及执行时间(执行时间为抢救当时时间。","options":["2","6","12","24"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"抢救时医生下达的是口头医嘱，抢救结束后应在6小时内补下医嘱，执行者签全名，执行时间为抢救当时的时间。这与第205题的要求一致。"},{"id":"S64","num":64,"type":"single","q":"服药、注射、输液查对制度中,不属于三看的内容的是 (   )。","options":["看药物有无浑浊变质","看药品有效期","看包装有无破损","看生产厂家信息"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"给药时的\"三查\"包括看药物有无浑浊变质、看有效期、看包装有无破损，也就是对药品质量的检查。生产厂家信息不属于三查内容，所以选D。"},{"id":"S65","num":65,"type":"single","q":"服药、注射、输液查对制度中,不属于七查的内容的是 (  )。","options":["姓名","床号","ID号","用药时间"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"按题库答案，床号不属于\"七查\"的内容，所以选B。患者身份识别应使用姓名、ID号等稳定的标识，床号可能随时调整，不能作为身份识别的依据。需要注意，传统的\"七对\"常把床号列入，本题以本院《查对制度》为准，建议再核对。"},{"id":"S66","num":66,"type":"single","q":"下列不属于手术安全核查步骤的是(   )。","options":["出病房前","手术前核查","出手术室前核查","实施麻醉前核查"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"手术安全核查分三个步骤：实施麻醉前核查、手术开始前核查、患者离开手术室前核查。\"出病房前\"不属于手术安全核查的步骤，所以选A。"},{"id":"S67","num":67,"type":"single","q":"关于特级护理要点说法错误的是(   )。","options":["根据医嘱,正确实施治疗、给药措施","每小时巡视患者","根据患者病情,正确实施基础护理和专科护理","根据医嘱测量出入量"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"特级护理的患者病情危重，需要严密观察、随时巡视，而不是\"每小时巡视\"。每小时巡视是一级护理的要求，所以B说法错误。A、C、D是特级护理的要点。"},{"id":"S68","num":68,"type":"single","q":"下列哪种情况的患者,可以确定为特级护理(   )？","options":["病情不稳定或随时可能发生变化的患者","大面积烧伤的患者","手术后或者治疗期间需要严格卧床的患者","自理能力重度依赖的患者"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"特级护理的指征包括病情危重、随时可能发生病情变化需要抢救的患者，以及严重创伤、大面积烧伤的患者。B符合。A（病情不稳定）表述较宽泛，C（需要严格卧床）和D（自理能力重度依赖）属于一级或二级护理的指征。"},{"id":"S69","num":69,"type":"single","q":"200ml血浆应控制在（  ）分钟内输完，最长不超过（  ）分钟。","options":["20分钟，30分钟","20分钟，40分钟","10分钟，20分钟","40分钟，60分钟"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"血浆应以患者能耐受的较快速度输注，200ml血浆应控制在20分钟内输完，最长不超过40分钟。输注太慢会使血浆中的凝血因子等成分失活，也增加污染风险。"},{"id":"S70","num":70,"type":"single","q":"不属于心电图危急值项目的是(   )？","options":["急性心肌缺血改变","二度房室传导阻滞","室性心动过速","心室颤动"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"心电图危急值通常包括急性心肌梗死或急性心肌缺血、室性心动过速、心室颤动、三度房室传导阻滞等可能很快危及生命的异常。二度房室传导阻滞不属于危急值项目，所以选B。具体项目以本院《危急值报告制度》为准。"},{"id":"S71","num":71,"type":"single","q":"临床用血超过(   )毫升,需报医务处审批。","options":["400","800","1600","2000"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"根据《临床输血技术规范》，同一患者一天申请备血量达到或超过1600ml，需报医务部门（医务处）批准，所以选C。"},{"id":"S72","num":72,"type":"single","q":"输血的三查不包括(   )？","options":["血液有效期","血液质量","血袋有无破损","输血次数"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"输血的\"三查\"是查血液有效期、查血液质量、查输血装置是否完好（血袋有无破损）。输血次数不属于查对内容，所以选D。"},{"id":"S73","num":73,"type":"single","q":"医师接到危急值通知后,护士根据医嘱积极处理,并在( )小时内在护理记录单中记录危急值项目、结果、处置措施等。","options":["2","4","6","8"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"医师接到危急值通知后，护士根据医嘱积极处理，并在6小时内于护理记录单中记录危急值项目、结果和处置措施，所以选C。该时限依据本院《危急值报告制度》。"},{"id":"S74","num":74,"type":"single","q":"输血异常情况处理不包括(   )？","options":["出现输血不良反应应立即减慢或停止输血,用静脉注射生理盐水维持静脉通路","血液输注完毕,废血袋送回输血科放置2-6摄氏度冰箱集中保留12小时","登陆不良事件管理系统填写输血不良反应上报输血科","立即通知值班医师和输血科值班人员,及时检查、治疗、抢救"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"输血完毕后，血袋要保留24小时，期间有问题可用于追溯和检测，所以B选项\"保留12小时\"是错误的，不属于正确的异常情况处理。A、C、D都是输血不良反应的正确处理（减慢或停止输血并用生理盐水维持通路、上报、通知医师和输血科）。该题与第139题\"保留24小时\"的要求一致。"},{"id":"S75","num":75,"type":"single","q":"根据《护理人员值班、交接班制度》,说法错误的是 (   )？","options":["必须坚守岗位,不得擅离职守","按照《护理分级制度》巡视病房","全面履行岗位职责,如遇重大问题,直接上报上级","值班者必须在交班时完成本班各项护理工作,整理好物品"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"按题库答案，D的说法错误。制度要求值班者在交班前完成本班各项护理工作，写好交班报告，整理好用物，为接班者做好准备，不是\"在交班时\"才完成。A、B、C分别是坚守岗位、按护理分级巡视、遇重大问题及时上报，符合要求。本题的表述细节依据本院制度，建议再核对。"},{"id":"S76","num":76,"type":"single","q":"具备以下哪种情况的患者,定为二级护理(   )？","options":["病情趋向稳定的重症患者","病情稳定,仍需卧床的患者","严重创伤或大面积烧伤的患者","生活完全自理且病情稳定的患者"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"二级护理的指征是病情稳定、仍需卧床，或生活部分自理的患者。A（病情趋向稳定的重症患者）属于一级护理；C（严重创伤或大面积烧伤）属于特级护理；D（生活完全自理且病情稳定）属于三级护理。"},{"id":"S77","num":77,"type":"single","q":"执行查对制度时,以下说法不正确的是(   )？","options":["医嘱应每班进行查对,护士长组织每周总查对医嘱两次","使用麻醉、精一类药品时,须经过二人核对无误方可执行,用后保留安瓿","发药或注射时,如患者提出疑问,应及时核查","同时使用多种药物时,要注意配伍禁忌"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"医嘱要每班查对，护士长组织总查对医嘱是每周一次，不是每周两次，所以A不正确。B、C、D符合查对制度：麻醉药品和精一类药品须两人核对并保留安瓿；患者提出疑问要及时核查；多种药物同用要注意配伍禁忌。"},{"id":"S78","num":78,"type":"single","q":"对于不良事件的报告,以下说法正确的是(   )。","options":["报告人在发生或发现Ⅲ、Ⅳ级事件,原则上于72小时内填报《不良事件报告表》报告","Ⅰ、Ⅱ级事件:在确认事件性质后30分钟内电话向所在科室负责人报告","Ⅰ、Ⅱ级事件:所在科室或部门必须于24小时内填 报《不良事件上报表》上报","鼓励当事人或发现者在48小时内登录医疗安全（不良）事件上报系统上报"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"按题库答案，鼓励当事人或发现者在48小时内登录系统上报，所以选D。A、B、C的时限与本院规定不符：Ⅰ级事件科室需24小时内上报，Ⅱ级事件48小时内上报（见第114、115题）。本题依据本院《不良事件报告制度》，请以本院规定为准。"},{"id":"S79","num":79,"type":"single","q":"以下哪项不是不良事件的报告原则(   )？","options":["自愿性","保密性","非惩罚性","公平性"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"不良事件报告遵循自愿性、保密性、非惩罚性等原则，鼓励主动报告，报告人和被报告人的信息都受保护，不因报告而受处罚。\"公平性\"不是报告原则，所以选D。"},{"id":"S80","num":80,"type":"single","q":"《输血查对制度》的有关规定,哪一项是不正确的(  )。","options":["取血前需二人共同核对患者病历并填写取血单","取血者携带取血单、取血箱到血库取血,并做到“一人一箱”","取血者在血库与发血者共同查对输血申请单、交叉配血报告单与血袋标签。","取血者不得擅 自更改血袋标签内容"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"按题库答案，C不正确。从第83题看，取血时双方要核对的是取血单、输血申请单、交叉配血报告单和血袋信息，C漏掉了取血单，可能因此被判为错误。A（二人核对并填写取血单）、B（一人一箱）、D（不得擅自更改血袋标签）是正确要求。建议再对照本院《输血查对制度》核实。"},{"id":"S81","num":81,"type":"single","q":"不良事件的报告形式不包括哪一项(  )。","options":["OA或海泰上报","书面上报","电话上报","邮箱上报"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"本院不良事件的报告形式为OA或海泰系统上报、书面上报和电话上报，不包括邮箱上报，所以选D。"},{"id":"S82","num":82,"type":"single","q":"关于手卫生,下列说法错误的是(  )。","options":["在双手没有明显污迹或者无明确病原体污染的情况下,清洁洗手和手消毒可以相互代替","如有明显污迹则必须清洁洗手","戴手套前后不必再进行手卫生","明确病原体污染时先清洁洗手,再用有效消毒剂擦拭消毒"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"C错误。戴手套不能代替手卫生，戴手套前和脱手套后都要做手卫生，因为手套可能有微小破损，脱手套时手也可能被污染。A、B、D符合手卫生规范。"},{"id":"S83","num":83,"type":"single","q":"关于取血查对内容,下列说法错误的是(   )。","options":["取血与发血的双方必须同时核查取血单、临床输血申请单、交叉配血报告单和血袋信息","取血时间精确到分","核对无误,只需取血者签全名","“一人一箱”,严禁多个患者血制品混放"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"C错误。取血时，核对无误后，取血者和发血者双方都要签全名，不能只由取血者签名。A、B、D是正确要求：双方同时核对各项单据和血袋信息、取血时间精确到分、一人一箱。"},{"id":"S84","num":84,"type":"single","q":"有关不良事件的说法,不正确的是(   )。","options":["是指在医疗机构内发生或发现的，除疾病自然过程之外的各种因素所致的不安全隐患或造成负性后果的事件。","Ⅰ级事件是指非预期死亡或是非疾病自然进展过程中造成的永久性功能丧失。","Ⅱ级事件是指在医疗过程中因诊疗活动而非疾病本身造成的机体与功能损害。","Ⅰ级事件是指发现的任何缺陷或错误,未形成事实,未造成危害,但其再发生很有可能带来严重的不良后果的事件"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"D不正确。Ⅰ级事件是非预期死亡或造成永久性功能丧失。\"发现缺陷或错误，但未形成事实、未造成危害\"是Ⅳ级事件（未造成后果的事件）。A、B、C对不良事件及Ⅰ、Ⅱ级事件的定义正确。"},{"id":"S85","num":85,"type":"single","q":"手卫生包括(   )。","options":["洗手","卫生手消毒","外科手消毒","以上都是"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"手卫生是洗手、卫生手消毒和外科手消毒的总称，所以选D\"以上都是\"。"},{"id":"S86","num":86,"type":"single","q":"有关于高警示药品的管理,以下说法正确的是(   )。","options":["高警示药品包括高浓度电解质、麻醉药品","高警示药品应与精二类药品一起存放,不得与其它药品混放","高警示药品设有全院统一的警示标识","高警示药品应双人双锁管理"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"高警示药品设有全院统一的警示标识，所以C正确。B错：高警示药品要单独存放，不得与其他药品混放，并非与精二类药品一起存放。D错：双人双锁是麻醉药品和精一类药品的要求，不是所有高警示药品都要双人双锁。A的表述不够准确，麻醉药品属于特殊管理药品，要按特殊规定管理。"},{"id":"S87","num":87,"type":"single","q":"《抢救车管理制度》规定,氧气瓶每(  )检查,保持备用状态,配有除颤仪的科室,应定点放置,(  )小时处于充电状态、每(  )行放电测试一次,并做好记录。","options":["每天、24h、每天","每周、48h、每月","每天、24h、每48小时","每班、24h、每周"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"《抢救车管理制度》规定：氧气瓶每班检查，保持备用状态；配有除颤仪的科室应定点放置，24小时处于充电状态，每周进行一次放电测试并记录。所以选D\"每班、24h、每周\"。"},{"id":"S88","num":88,"type":"single","q":"为心脏骤停的患者实施心脏胸外按压时,按压频率为 (   )次/分。","options":["90-100次/分","100-120次/分","80-100次/分","至少100次/分"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"成人心肺复苏时，胸外按压的频率为100-120次/分。频率太慢会使冠脉和脑灌注不足，太快则会让胸廓回弹不完全，影响回心血量。"},{"id":"S89","num":89,"type":"single","q":"下列各项不属于危急值的是(   )？","options":["血钾6.0mmol/L","血钠120mmol/L","血红蛋白200g/L","血糖2.1mmol/L"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"按题库答案，血钾6.0 mmol/L不属于危急值，其余各项都是危急值：血钠120 mmol/L属严重低钠，血红蛋白200 g/L属严重升高，血糖2.1 mmol/L属严重低血糖。血钾危急值上限因医院而异，常见为≥6.5 mmol/L，也有定为≥6.0 mmol/L的，请对照本院《危急值报告制度》核对。"},{"id":"S90","num":90,"type":"single","q":"关于科室内交接说法正确的是(   )。","options":["交班报告包括住院患者总人数、出入院、转科、手术、分娩、当日请假离院、死亡人数","接班者接班后巡视病房","所有抢救仪器和器械设备保持充电备用","各种检查标本必须当班完成"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"交班报告的内容包括住院患者总人数，以及出入院、转科、手术、分娩、请假离院、死亡的人数，所以A正确。该题依据本院《护士值班、交接班制度》，B、C、D的说法与制度细节不符。"},{"id":"S91","num":91,"type":"single","q":"以下哪项不是常见的输液反应(   )？","options":["发热反应","过敏反应","静脉炎","空气栓塞"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"常见的输液反应包括发热反应、急性肺水肿、静脉炎和空气栓塞。按题库答案，过敏反应不属于常见的输液反应，所以选B。"},{"id":"S92","num":92,"type":"single","q":"下列有关《护士值班、交接班制度》的说法正确的是( )。","options":["每班必须按时交接班,接班者提前15分钟到病房,清点物品、 药品","在接班者未到岗,且未交接清楚之前,接班者不得离开岗位","接班时发现问题,由接班者负责","交接后,接班者认真巡视病房,检查是否达到清洁、整齐、安静、安全的要求"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"A正确：接班者提前15分钟到病房，清点药品和物品。B错：交班者在接班者未到岗、交接未清之前不得离开岗位，题干把主体写成了\"接班者\"。C错：接班时发现的问题由交班者负责。D的表述与制度细节不符，所以选A。"},{"id":"S93","num":93,"type":"single","q":"有关抢救工作的要求,以下说法不正确的是(   )？","options":["参加抢救的医护人员应严格遵守相关法律法规,执行各项医疗规章制度和各种技术操作规程","参加抢救的医护人员应密切配合,口头医嘱医嘱要准确、清楚","对需立即手术的患者应及时送手术室施行手术","抢救时立即将患者护送至病房实施抢救"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"抢救应就地进行，患者病情稳定后再转运。\"立即将患者护送至病房实施抢救\"错误，因为病房抢救条件有限，转运会延误抢救，所以选D。A、B、C分别是遵守法规和规程、密切配合并保证口头医嘱准确、需要立即手术的患者及时送手术室，都是正确要求。"},{"id":"S94","num":94,"type":"single","q":"我院《危急值报告制度》中规定,成人血钙的危急值是 (  )mmol/L。","options":["≥3.5,≤1.6","≥5.0,≤2.0","≥4.5,≤3.6","≥4.0,≤1.5"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"按本院《危急值报告制度》，成人血钙的危急值是≥3.5 mmol/L或≤1.6 mmol/L，所以选A。该题依据本院制度，各医院的数值略有不同，请以本院规定为准。"},{"id":"S95","num":95,"type":"single","q":"关于《危急值报告制度》有关规定,正确的是( )。","options":["主管医师或值班医师需4小时内在病程中记录接收到的“危急值”报告结果和所采取的相关诊疗措施","临床科室人员在接到“危急值”报告电话后,应立即将电话转接给主管医师或值班医师","若危急值结果与临床相符,应在30分钟内结合临床情况采取相应处理措施,同时及时报告上级医师或科主任","如发现所拟定“危急值”项目及“危急值”范围需要更改或增减,应及时联系相关科室更改"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"C正确：危急值结果与临床相符时，应在30分钟内结合临床情况采取处理措施，同时报告上级医师或科主任。A错：医师记录时限与题库规定不符（常见为6小时内）。B错：护士接到危急值电话后，应立即报告医师，而不是仅转接电话。D错：危急值项目和范围需要更改，应按制度向相关管理部门提出。本题依据本院制度，建议再核对。"},{"id":"S96","num":96,"type":"single","q":"心电图检查“危急值”项目包括(   )。","options":["急性心肌梗死(超急性期,急性发展期);","急性心肌缺血;","各种严重心率失常;","以上都是"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"心电图危急值项目包括急性心肌梗死（超急性期、急性发展期）、急性心肌缺血、各种严重心律失常等，A、B、C都属于，所以选D\"以上都是\"。"},{"id":"S97","num":97,"type":"single","q":"关于查对制度,以下说法错误的是(   )。","options":["三查是指操作前查、操作中查和操作后查","麻精类药品用后安瓿可在自己科室进行处理","同时使用多种药物时,查询药物配伍禁忌","使用易过敏药物时,皮试前需询问患者有无过敏史"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"B错误。麻醉药品和精神药品用后的空安瓿要按规定回收（交回药房），不能在科室自行处理，以防流失。A（三查是操作前、操作中、操作后查）、C（多种药物同用要查配伍禁忌）、D（皮试前询问过敏史）都是正确的。"},{"id":"S98","num":98,"type":"single","q":"交接班完成后,如因交接不清楚发生的问题,由( )负责。","options":["交班者","接班者","护士长","责任组长"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"交接班完成后，因交接不清楚发生的问题由接班者负责，所以选B。交接班时发现的问题则由交班者负责（见第119题）。"},{"id":"S99","num":99,"type":"single","q":"灭菌是指用物理或者化学的方法杀灭全部的微生物包括 (   )。","options":["致病微生物","非致病微生物","细菌芽孢","以上都是"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"灭菌是用物理或化学方法杀灭全部微生物，包括致病微生物、非致病微生物和细菌芽孢，所以选D\"以上都是\"。灭菌与消毒的区别就在于能杀灭细菌芽孢。"},{"id":"S100","num":100,"type":"single","q":"患者，男，69岁，高血压心脏病10年，近一年来病人明显感觉体力活动受限，洗脸、刷牙即可引起呼吸困难、心悸，此病人目前心功能处于(    ) 。","options":["代偿期","Ⅰ级","Ⅱ级","Ⅲ级"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"心功能分级：Ⅰ级为体力活动不受限；Ⅱ级为一般活动即出现症状；Ⅲ级为轻于日常活动即出现症状，体力活动明显受限；Ⅳ级为休息时也有症状。本题患者洗脸、刷牙就引起呼吸困难、心悸，属于Ⅲ级，所以选D。"},{"id":"S101","num":101,"type":"single","q":"女性，22岁，不能唤醒，呼吸不规则，血压测不出，大小便失禁，两侧瞳孔扩大，角膜反射消失，对针刺无反应，其意识状态是(    ) 。","options":["嗜睡","意识模糊","浅昏迷","深昏迷"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"深昏迷表现为意识完全丧失，对各种刺激（包括强刺激）均无反应，角膜反射、瞳孔对光反射消失，常伴大小便失禁、呼吸不规则、血压下降。本题患者不能唤醒、针刺无反应、角膜反射消失、双侧瞳孔散大，符合深昏迷，所以选D。浅昏迷对强刺激仍有痛苦表情或肢体防御反应，角膜反射、瞳孔对光反射仍存在。"},{"id":"S102","num":102,"type":"single","q":"深静脉血栓形成后不正确的护理措施是(  )。","options":["按摩患肢","绝对卧床休息","抬高患肢","禁烟"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"深静脉血栓形成后，禁止按摩患肢，按摩或用力活动可能使血栓脱落，随血流到肺部造成肺栓塞，所以A不正确。B（急性期绝对卧床）、C（抬高患肢促进静脉回流）、D（禁烟，避免血管收缩）都是正确的护理措施。"},{"id":"S103","num":103,"type":"single","q":"给氧的适应证不包括(   )。","options":["急性左心衰竭","休克","心肌梗死","急性肾盂肾炎"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"给氧适用于各种原因引起的低氧血症，如急性左心衰竭、休克、心肌梗死等，都会造成组织缺氧。急性肾盂肾炎是泌尿系统感染，一般不引起缺氧，不是给氧的适应证，所以选D。"},{"id":"S104","num":104,"type":"single","q":"简易呼吸器使用中,错误的是(    )。","options":["先清理呼吸道分泌物","解开病人衣领、腰带","病人平卧头向后仰","一次挤压300-400ml空气进入肺内"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"使用简易呼吸器前要先清理呼吸道分泌物，解开衣领和腰带，让患者平卧、头后仰以开放气道。成人每次挤压的送气量约为400-600ml（约为球囊的1/2到2/3），300-400ml偏少，所以D错误，按题库答案选D。"},{"id":"S105","num":105,"type":"single","q":"在肌力分级中，肢体收缩可引起关节活动，但不能对抗地心引力，即不能抬起，此肌力属于（   ）级。","options":["0级","1级","2级","3级"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"肌力分级：0级无肌肉收缩；1级可见肌肉收缩，但无关节活动；2级肢体能在床面上水平移动，但不能抬离床面（不能对抗重力）；3级能抬离床面，但不能对抗阻力；4级能对抗一定阻力；5级正常。本题描述的是2级，所以选C。"},{"id":"S106","num":106,"type":"single","q":"肌无力是指肌力（   ）。","options":["≤3级","≤2级","≤1级","≤4级"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"按题库答案，肌无力是指肌力≤3级，也就是肢体不能对抗阻力，所以选A。这个划分与第135题的约束评估一致。不同教材对\"肌无力\"的分界略有差异（有的以4级为界），本题以题库为准。"},{"id":"S107","num":107,"type":"single","q":"关于胃肠镜检查，以下说法错误的是（  ）？","options":["肠镜检查的患者，在检查前一天需进食无渣半流质饮食","检查前一天可以吃含纤维素较高的蔬菜和水果","检查当日禁食、禁水4-6小时","对于便秘患者，检查前一晚可通过加用泻药、肠道准备时增加饮水量、检查前半小时清水灌肠等做好肠道准备"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"B错误。肠镜检查前一天应进食无渣或少渣的半流质饮食，不能吃含纤维素高的蔬菜和水果，因为残渣会影响肠道清洁度和观察。A（无渣半流质）、C（检查当日禁食禁水4-6小时）、D（便秘患者加强肠道准备）都是正确的。"},{"id":"S108","num":108,"type":"single","q":"下列哪项是留置导尿的禁忌症（  ）？","options":["急、慢性尿潴留","难治性尿失禁","外科手术时的围术期使用","急性前列腺炎"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"急性前列腺炎时，尿道内置入导尿管会加重炎症，并可能引起菌血症，所以是留置导尿的禁忌症，选D。急、慢性尿潴留、难治性尿失禁、围术期使用都是留置导尿的适应证。"},{"id":"S109","num":109,"type":"single","q":"《留置导尿管护理指南 》中明确指出：导尿时，成年女性插入 4 ~ 6cm，见尿后再插入（  ）？","options":["5-7cm","10-15cm","15-20cm","20-25cm"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"《留置导尿管护理指南》规定，成年女性导尿时先插入4~6cm，见尿后再插入5~7cm，使气囊完全进入膀胱后再充盈气囊，避免气囊在尿道内充盈损伤尿道。所以选A。"},{"id":"S110","num":110,"type":"single","q":"《留置导尿管护理指南 》中明确指出：导尿时，成年男性插入深度是（  ）？","options":["直插至尿管Y型处","10-15cm","15-20cm","20-25cm"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"男性尿道较长，且有生理弯曲，按指南要求，导尿时应将导尿管直插至尿管Y型分叉处，确保气囊完全在膀胱内，再充盈气囊，避免气囊在尿道内充盈造成尿道损伤。所以选A。"},{"id":"S111","num":111,"type":"single","q":"采集尿液标本时，用无菌注射器穿刺尿管Y型远端留取尿培养标本，留取后（ ）小时内及时送检？","options":["1小时","1.5小时","2小时","2.5小时"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"尿培养标本留取后应在2小时内送检。放置时间过长，细菌会在尿液中继续繁殖，使培养结果不能反映真实感染情况。所以选C。"},{"id":"S112","num":112,"type":"single","q":"尿管插入进行外固定时，采用高举平台法，需要固定在（  ）位置，保持导尿管稳定，防止导尿管移位及尿道牵拉？","options":["下腹部或大腿内侧上1/3","下腹部或大腿内侧上2/3","大腿外侧上1/3","大腿外侧上2/3"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"高举平台法固定导尿管，应固定在下腹部或大腿内侧上1/3，使导尿管有一定活动度，又不被牵拉移位，减少对尿道的牵拉和损伤。所以选A。"},{"id":"S113","num":113,"type":"single","q":"肢体导联电极连接方法，以下哪项正确是（  )。","options":["红色接右手、黄色接左手、黑色接右脚、绿色接左脚","红色接左手、黄色接右手、黑色接右脚、绿色接左脚","红色接右手、黄色接左手、黑色与绿色一起接左脚","红色接左手、黄色接右手、黑色与绿色一起接左脚"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"心电图肢体导联的连接口诀是\"红右手、黄左手、绿左脚、黑右脚\"。题目中的A符合这一口诀（红接右手、黄接左手、黑接右脚、绿接左脚），所以选A。其余选项把颜色和肢体接反，或把黑、绿两线接在一起，都不正确。"},{"id":"S114","num":114,"type":"single","q":"Ⅰ级事件发生后应当立即报告科室负责人，所在科室或部门于（  ）内登录医疗安全（不良）事件上报系统上报。","options":["24小时","半小时","12小时","48小时"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"Ⅰ级事件（非预期死亡或永久功能丧失）后果最严重，发生后要立即报告科室负责人，所在科室或部门于24小时内登录系统上报，所以选A。这与第78题一致。"},{"id":"S115","num":115,"type":"single","q":"科室若发生Ⅱ级不良事件，所在科室或部门应于（  ）内登录医疗安全（不良）事件上报系统上报 。","options":["48小时","12小时","6小时","24小时"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"Ⅱ级不良事件，所在科室或部门应在48小时内登录医疗安全（不良）事件上报系统上报，所以选A。Ⅰ级事件的时限则是24小时（见第114题）。"},{"id":"S116","num":116,"type":"single","q":"患者78岁，因腹泻3天来院，化验结果示低钠、低钾，患者夜间独自入厕，起身返回途中因行走不稳跌倒，右侧眉弓可见2厘米长伤口，给予清创缝合，给予拍片检查示右侧眉弓骨折，请问该事件属于几级事件？","options":["Ⅰ级事件","Ⅱ级事件","Ⅲ级事件","Ⅳ级事件"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"患者因低钠、低钾行走不稳跌倒，造成眉弓骨折，并需要清创缝合，属于在诊疗过程中因疾病以外因素造成的机体与功能损害，所以是Ⅱ级事件。Ⅰ级是非预期死亡或永久功能丧失，这里没有达到。"},{"id":"S117","num":117,"type":"single","q":"患者老年男性，脑梗死，一周前，因左侧肢体偏瘫加重入院，入院后吞咽困难，饮水呛咳，给予留置胃管，并间断行吞咽功能锻炼，昨日夜间患者不慎将胃管拔除，经评估，患者可自行吞咽，进食缓慢，但无呛咳，未再重置胃管，以下说法正确的是(  )。","options":["该事件属于Ⅱ级不良事件，应在15分中内上报","该事件属于Ⅲ级不良事件，应在48小时内上报","该事件不属于不良事件，不必上报","该事件属于Ⅳ级不良事件，可不上报"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"患者自行拔除胃管，评估后能自行吞咽、无呛咳，未再重置，属于造成轻微后果、无需额外处理的事件，题库定为Ⅲ级，应在48小时内上报，所以选B。C、D都不对，非计划拔管属于不良事件，需要上报。分级细则依据本院制度，请以本院规定为准。"},{"id":"S118","num":118,"type":"single","q":"以下哪项事件属于不良事件？","options":["小红在家因食用 了农药残留的水果导致食物中毒","张阿姨带着1岁的小孙子去公园的路上被电动车撞倒导致胫骨骨折","患者王先生在去医院餐厅的路上被地面水渍滑倒导致脚踝韧带撕裂伤","张医生下班回家途中手提电脑被抢"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"不良事件是在医疗机构内发生或发现的、与诊疗服务相关的事件，也包括就诊患者在院内发生的跌倒等意外。C项王先生在去医院餐厅的路上被地面水渍滑倒受伤，发生在医疗机构内，属于不良事件。A、B、D都发生在院外或与医疗机构无关，所以选C。"},{"id":"S119","num":119,"type":"single","q":"护理人员应如何履行交接班制度?","options":["接班者应提前5分钟到达科室，准备交接班","若接班者未按时到岗，交班者在下班前完成本班工作就可以下班了","交接班时发现的问题，由交班者负责","交接班后，接班者再全面清点病区物品、仪器等"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"交接班时发现的问题由交班者负责，所以选C。A错：接班者应提前15分钟到岗，不是5分钟。B错：接班者未到岗时，交班者不得离开岗位。D错：清点物品应在交接班时由双方共同完成，不是交接后接班者再单独清点。"},{"id":"S120","num":120,"type":"single","q":"在抢救患者时，医生下达了许多口头医嘱，抢救结束后，医生立即补下了医嘱，护士该如何签署执行时间?","options":["签署当下签字时的时间","签署抢救结束后的时间","签署抢救当时执行医嘱的时间","不必签署执行时间"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"补下的医嘱，执行时间要如实记录为抢救当时执行该医嘱的时间，不能写补记的时间，这样才能真实反映抢救过程的时间顺序，所以选C。"},{"id":"S121","num":121,"type":"single","q":"患者张某，癌痛难以忍受，遵医嘱肌肉注射吗啡，请问护士的以下做法不正确的是?","options":["持红方到药房取药","按要求做好使用登记记录","两名护理人员共同核对无误后方可执行","执行后保留空安瓿，再次核对后方可丢弃"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"吗啡属于麻醉药品，应凭专用处方取药、做好使用登记、由两人核对后执行。用后的空安瓿要交回药房并登记，不能自行核对后丢弃，以防麻醉药品流失，所以D不正确。"},{"id":"S122","num":122,"type":"single","q":"在输液过程中发生急性肺水肿，处理措施错误的是?","options":["给予酒精湿化的氧气吸入","采取半卧位，双腿抬高，必要时四肢轮扎","给予利尿剂、平喘剂、强心剂等药物治疗","立即停止输液，通知医生"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"输液引起急性肺水肿时，应让患者取端坐位、双腿下垂，以减少回心血量，必要时四肢轮扎。\"半卧位、双腿抬高\"会增加回心血量，加重肺水肿，所以B错误。A（20%-30%酒精湿化氧气，起消泡作用）、C（利尿、平喘、强心药物）、D（立即停止输液并通知医生）都是正确措施。"},{"id":"S123","num":123,"type":"single","q":"某科室，护理人员发现患者体温不升，在未上报医生的情况下，私自为患者使用升温毯升温及热水瓶升温，导致患者发生严重烫伤，请问该事件属于哪一级医疗安全（不良）事件？","options":["Ⅰ级","Ⅱ级","Ⅳ级","Ⅲ级"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"护士私自使用升温毯和热水瓶，导致患者严重烫伤，属于诊疗护理过程中造成的机体与功能损害，所以是Ⅱ级事件。Ⅰ级事件是非预期死亡或永久功能丧失，本题没有达到。"},{"id":"S124","num":124,"type":"single","q":"对多重耐药菌的定植者或感染者需采取什么隔离手段？","options":["接触隔离，蓝色标识","空气隔离，黄色标识","飞沫隔离，粉色标识","普通隔离，黄色标识"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"多重耐药菌主要通过接触传播，所以对定植者或感染者采取接触隔离，使用蓝色标识。空气隔离用黄色标识，飞沫隔离用粉色标识。所以选A。"},{"id":"S125","num":125,"type":"single","q":"患者张某，头痛难忍，疼痛评分为6分，遵医嘱给予止疼药口服，请问，护士应于何时需再次进行疼痛评估？","options":["服药后30min","服药后1h","服药后2h","服药后4h"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"口服止痛药后，要在1小时后再次评估疼痛，因为口服药物起效需要一定时间。静脉给药则在15-30分钟评估。所以选B。具体时限依据本院《疼痛护理制度》。"},{"id":"S126","num":126,"type":"single","q":"机采血小板和冷沉淀以患者能够耐受的最快速度输注，应控制在（  ）内输注完毕","options":["30min","60min","15min","10min"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"机采血小板和冷沉淀中的血小板、凝血因子易失活，输注时间过长会影响疗效，所以应以患者能耐受的最快速度输注，在30分钟内输完。"},{"id":"S127","num":127,"type":"single","q":"一旦离开正确的贮存条件，血液制剂即有发生细菌繁殖或丧失功能的危险，一般成人输血，2U红细胞类血液应在（  ）小时内输完。","options":["24h内","12h内","应在2小时内输完，最长不超过4小时","不可过快，应在8小时内输注完毕"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"血液制剂离开贮存条件后，细菌容易繁殖，红细胞类血液应在2小时内输完，最长不超过4小时。输注时间太长会增加污染风险，太快则会加重心脏负担，所以选C。"},{"id":"S128","num":128,"type":"single","q":"关于防止术后肺不张，下列叙述不正确的是?","options":["术前练习深呼吸","嗜烟者术前 1 周禁烟","及时用镇咳药控制咳嗽","防止术后呕吐物吸人"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"术后肺不张是由于痰液堵塞支气管，所以要鼓励患者有效咳嗽、排痰，不能用镇咳药抑制咳嗽，否则痰液潴留会加重肺不张，所以C不正确。A（术前练习深呼吸）、B（吸烟者术前至少禁烟1周）、D（防止呕吐物误吸）都是正确的预防措施。"},{"id":"S129","num":129,"type":"single","q":"下列有关护理工作的描述，不正确的是?","options":["无菌物品必须一人一用一灭菌","起封抽吸的各种溶媒超过 36h 不得使用，最好采用大包装","各种治疗、护理、换药操作应按清洁伤、感染伤口、隔离伤口依次进行","灭菌物品提倡使用小包装，无菌棉球或纱布罐一经打开，使用时间不得超过 24h"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"起封抽吸的各种溶媒，使用时限不得超过24小时，而不是36小时，所以B不正确。A（无菌物品一人一用一灭菌）、C（换药按清洁伤口、感染伤口、隔离伤口的顺序）、D（无菌棉球、纱布罐开启后不超过24小时）都符合要求。"},{"id":"S130","num":130,"type":"single","q":"输液中发生空气栓塞时应立即让患者取的卧位是?","options":["平卧位","右侧卧位并头低足高","半卧位","左侧卧位并头低足高"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"输液中发生空气栓塞，应让患者取左侧卧位并头低足高。这样气体浮向右心室尖部，避开肺动脉入口，随着心脏搏动，空气被打成泡沫，逐步进入肺动脉而被吸收。所以选D。"},{"id":"S131","num":131,"type":"single","q":"心肺复苏 A、B、C 治疗法中的 A 是指?","options":["开放气道","转运患者","人工呼吸","胸外心脏按压"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"心肺复苏的A、B、C分别是：A（Airway）开放气道，B（Breathing）人工呼吸，C（Circulation）胸外心脏按压。所以A是开放气道，选A。"},{"id":"S132","num":132,"type":"single","q":"大咯血患者首要的护理措施是?","options":["保持呼吸道通畅","高浓度氧疗","防止大出血休克","使用呼吸兴奋药"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"大咯血的主要致死原因是血块或血液堵塞气道引起窒息，所以首要护理措施是保持呼吸道通畅（如患侧卧位、鼓励排出血液，必要时吸引）。防止休克、氧疗等都在保持呼吸道通畅的基础上进行；呼吸兴奋药可能使咯血加重，不宜使用。"},{"id":"S133","num":133,"type":"single","q":"肝胆外科5床患者，今晨在全麻下实施胆囊切除术，并留置引流管，术后返回病房，责任护士安置好患者后，为患者实施各项评估，在约束前评估的行为评估中，患者的评分为0分，请问，接下来，护士该怎么做？","options":["继续进行下一项评估内容","结束评估，为患者实施约束","遵医嘱为患者应用止痛、镇静药物，避免患者自行拔除管道","结束评估，不需要为患者实施约束"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"约束前评估的行为评分为0分，说明患者没有躁动或不配合的表现，没有约束指征，所以结束评估，不需要约束，选D。约束是限制患者自由的措施，要在评估达到指征时才使用。具体评分规则依据本院《约束评估表》。"},{"id":"S134","num":134,"type":"single","q":"张某，因外伤致脑出血收入院，入院后行手术治疗，术后留置气管切开套管、尿管、胃管、脑室引流管，患者神志不清，烦躁不安，经常出现谵妄行为，镇静效果较差，经评估后，符合约束指征，遵医嘱给予四肢约束护理，请问护士应该多久为患者进行一次约束评估？","options":["每周评估2次，直至约束解除","每24小时评估一次，直至约束解除","每周评估一次，直至约束解除","每12小时评估一次，直至约束解除"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"患者已经约束后，护士应每24小时评估一次，直至约束解除，评估约束的必要性和肢体血运、皮肤情况。所以选B。评估频次依据本院《约束护理制度》。"},{"id":"S135","num":135,"type":"single","q":"神经内科护理人员对一名新入院患者实施约束前评估，患者右侧的肌力为3级，左侧的肌力为0级，请问该护士接下来该如何做？","options":["进行下一项评估","仅仅约束右侧肢体即可","立即为患者实施四肢约束","不需要再继续评估，也不需要为患者实施约束"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"肌力≤3级视为肌无力（见第106题），患者自行拔除管道的能力低；本题右侧3级、左侧0级，不具备约束指征，所以不需要继续评估，也不需要约束，选D。评分规则依据本院《约束评估表》。"},{"id":"S136","num":136,"type":"single","q":"张某，50岁，因脑出血入院，入院后留置脑室引流管，给予气管插管，并给予脱水降颅压、改善脑代谢、止血、营养脑神经、镇静等药物治疗，患者约束前评估得分具体如下：意识状态10分，肌力：左侧4级，右侧2级，行为：-2分，请问，针对该项评估的评估结果，护士的以下做法正确的是？","options":["遵医嘱停用镇静药物","遵医嘱为患者实施约束","不需要为患者实施约束","不需要下医嘱，直接给予约束"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"该患者留置气管插管和脑室引流管，意识状态、肌力（左侧4级）和行为评分等符合约束指征，所以应遵医嘱为患者实施约束，选B。约束需要医嘱，紧急情况也需要先处理再及时补下医嘱，所以D错；镇静药不应擅自停用，A错；C与评估结果不符。"},{"id":"S137","num":137,"type":"single","q":"《护士条例》何时开始实施？","options":["2010年1月1日","2006年4月20日","2008年5月12日","2000年5月1日"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"《护士条例》于2008年1月公布，自2008年5月12日起施行，所以选C。"},{"id":"S138","num":138,"type":"single","q":"当患者发生输液反应时，以下做法错误的是？","options":["立即停止输液，更换输液器，销毁原输注液体及输液器","用生理盐水或5%GS维持静脉通道","立即报告医师","测量生命体征，必要时予以吸氧、监护等，遵医嘱采取相应措施"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"发生输液反应时，应立即停止输液，更换输液器和液体，同时保留原来的液体和输液器，必要时送检，以查找原因，所以\"销毁原输注液体及输液器\"错误，选A。B（用生理盐水或5%葡萄糖维持通路）、C（立即报告医师）、D（测生命体征、吸氧、监护）都是正确做法。"},{"id":"S139","num":139,"type":"single","q":"关于输血的相关要求，哪一项是正确的？","options":["避免剧烈震荡血液","刚取回的血液温度较低，可适当加热升温后输注","输血后，血袋放在处置室保留24小时，无疑问后，丢弃于黄色垃圾桶内","全血或红细胞应在取血后50分钟内开始输注"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"A正确，剧烈震荡会使红细胞破坏而溶血。B错：血液不能加热，加热可造成溶血。C错：输血后血袋应送回输血科，放在2-6℃冰箱保存24小时，不是放在处置室。D错：全血或红细胞应在取血后30分钟内开始输注，不是50分钟。"},{"id":"S140","num":140,"type":"single","q":"实习护士小王在带教老师的监督下进行静脉输液，因未严格查对，错将22床青霉素输给21床患者，导致21床患者发生过敏性休克而死亡。该事故属于（  ）？","options":["二级医疗事故","四级医疗事故","三级医疗事故","一级医疗事故"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"一级医疗事故是指造成患者死亡、重度残疾的医疗事故。本题患者因错输药物发生过敏性休克死亡，属于一级医疗事故，所以选D。实习护生在带教老师监督下操作，责任仍由医疗机构承担。"},{"id":"S141","num":141,"type":"single","q":"以下说法正确的是（   ）？","options":["对有疑问的医嘱，与医生认真核实无误后再执行","无条件的立即执行口头医嘱","将乙肝患者的姓名标注在护士站，以提醒大家注意","临时医嘱应在2小时内执行"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"对有疑问的医嘱，必须与医生认真核实无误后再执行，所以A正确。B错：口头医嘱只在抢救等紧急情况下使用，并且要复述确认，不是无条件执行。C错：患者姓名和病情属于隐私，不能公开标注。D的时限与本院规定不一致，以本院制度为准。"},{"id":"S142","num":142,"type":"single","q":"外周静脉留置针穿刺处的皮肤消毒范围直径应大于（ ）厘米？","options":["8cm","10cm","6cm","5cm"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"外周静脉留置针穿刺前，皮肤消毒范围的直径应大于8cm，保证消毒面积大于透明敷料的覆盖范围，减少感染风险。所以选A。"},{"id":"S143","num":143,"type":"single","q":"如何选择外周静脉留置针的穿刺部位？","options":["宜选择手背部","宜选择手腕内侧面","宜选择下肢","宜选择前臂"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"成人外周静脉留置针宜选择前臂。前臂血管较粗、位置较固定，离关节较远，不影响患者活动。手背、手腕内侧及关节部位不宜选用，下肢静脉易形成血栓、感染，成人也不宜选用。所以选D。"},{"id":"S144","num":144,"type":"single","q":"导管相关血流感染指的是带有血管内导管或拔除血管内导管（  ）内的患者出现菌血症或真菌血症，并伴有发热（体温＞38.5℃）、寒战或低血压等表现，除血管导管外没有其他明确的感染源。","options":["96小时","72小时","48小时","24小时"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"导管相关血流感染（CRBSI）是指带有血管内导管或拔除血管内导管48小时内的患者出现菌血症或真菌血症，并伴有发热（体温＞38.5℃）、寒战或低血压等表现，且除导管外没有其他明确的感染源。所以选C。"},{"id":"S145","num":145,"type":"single","q":"深静脉血栓最早出现的症状是？","options":["瘙痒","溃疡","疼痛","肿胀"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"按题库答案，深静脉血栓最早出现的症状是疼痛，选C。血栓形成时，血管壁炎症刺激可引起患肢疼痛，之后随着静脉回流障碍出现肿胀。临床上也有以肿胀为首发表现的，本题以题库为准。"},{"id":"S146","num":146,"type":"single","q":"对于下肢急性深静脉血栓形成患者，下列正确的护理措施是？","options":["床上活动","患肢按摩","行走练习","卧床休息，抬高患肢"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"急性期下肢深静脉血栓形成的患者，要卧床休息并抬高患肢（高于心脏水平20-30cm），促进静脉回流、减轻肿胀。床上活动、按摩和行走都可能使血栓脱落造成肺栓塞，所以选D。"},{"id":"S147","num":147,"type":"single","q":"对于抗凝剂皮下注射时，以下说法正确的是？","options":["注射前应抽回血","注射时速度应快，注射后立即拔针","注射后应停留10秒再拔针","拔针后需按压10分钟"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"抗凝剂皮下注射的要点是：注射前不抽回血；缓慢注射（约10秒），注射后停留10秒再拔针；拔针后不按揉，必要时轻压，避免皮下出血。所以C正确，A、B、D都不符合要求。"},{"id":"S148","num":148,"type":"single","q":"抗凝剂皮下注射时，患者采取的卧位？","options":["侧卧位","屈膝仰卧位","坐位","平卧位"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"腹壁注射抗凝剂时，患者宜取屈膝仰卧位，使腹部放松，便于捏起皮肤注射，也能减轻疼痛，所以选B。"},{"id":"S149","num":149,"type":"single","q":"以下属于高危导管的是？","options":["胸腔引流管","导尿管","输液港","PICC"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"高危导管是指一旦脱出就可能危及生命或造成严重后果的导管，如胸腔引流管、气管插管、脑室引流管等，所以选A。导尿管、输液港和PICC的风险较低，不属于高危导管。具体分类依据本院《管道分类管理制度》。"},{"id":"S150","num":150,"type":"single","q":"使用《非计划拔管风险评估表》进行管道风险评估，分值达到（   ）为高风险？","options":["1-3分","4-6分","≥7分","≥6分"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"使用《非计划拔管风险评估表》评估时，分值≥7分为高风险，应采取重点预防措施，所以选C。1-3分为低风险，4-6分为中风险。具体分值界限依据本院制度。"},{"id":"S151","num":151,"type":"single","q":"病房内的患者发生下列情况，哪个是需要紧急处理的 (     )？","options":["患者突发意识不清","患者发烧，体温38度","新入院一名骨折患者","患者要求办理出院手续"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"突发意识不清可能提示脑血管意外、严重低血糖、休克、心脏骤停等危及生命的情况，必须立即处理，所以选A。体温38℃属于低热，可先观察并采取物理降温等措施；新入院患者和办理出院手续属于常规工作，都不需要紧急处理。"},{"id":"S152","num":152,"type":"single","q":"下列护士的行为不正确的是（      ）。","options":["着装整洁，淡妆上岗","态度诚恳，语调平和","技术操作熟练","佩戴耳钉，涂抹指甲"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"护士仪表要求着装整洁、淡妆上岗、态度诚恳、操作熟练。佩戴耳钉等饰物、涂抹指甲油不符合要求：饰物和指甲油容易藏污纳垢，影响手卫生，增加交叉感染风险，所以选D。"},{"id":"S153","num":153,"type":"single","q":"对于危重患者，只要胃肠道解剖与功能允许，建议（ ）开始鼻饲 ？","options":["发病后早期（12—24h内）","发病后早期（24—48h内）","发病后早期（24内）","发病后早期（48h内）"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"危重患者只要胃肠道解剖和功能允许，应尽早开始肠内营养，一般在发病后24-48小时内开始鼻饲。早期肠内营养有助于维护肠黏膜屏障、减少感染并发症，所以选B。"},{"id":"S154","num":154,"type":"single","q":"不能抽胃内容物或者pH试纸判断鼻胃管位置失败时， （   ）是首选的重要检测手段。","options":["X线","彩超","听气过水声","看外露长度"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"抽不出胃内容物、pH试纸也无法判断时，X线检查是确认鼻胃管位置的金标准，所以选A。听气过水声不可靠，容易误判；看外露长度只能判断管道有无移位，不能确定管端位置；彩超不作为首选。"},{"id":"S155","num":155,"type":"single","q":"硅胶胃管至少（  ）更换1次。","options":["每3周","每2周","每1周","每5周"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"按题库答案，硅胶胃管至少每3周更换1次，所以选A。胃管留置时间与材质有关，具体更换周期还要参照产品说明书和本院规定。"},{"id":"S156","num":156,"type":"single","q":"鼻饲时，保持床头抬高角度为（   ），禁忌症除外。","options":["平卧位","90°","30—45°","10-20°"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"鼻饲时床头应抬高30-45°（禁忌症除外），利用重力减少胃内容物反流，降低误吸和吸入性肺炎的风险。平卧位和低角度容易反流；90°不利于患者长时间保持，也不是推荐角度，所以选C。"},{"id":"S157","num":157,"type":"single","q":"鼻饲结束后保持（  ）。","options":["平卧位30—60min","半卧位30—60min","俯卧位30—60min","头低脚高位30—60min"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"鼻饲结束后应保持半卧位30-60分钟，使营养液充分进入肠道，避免平卧或翻身造成反流误吸，所以选B。"},{"id":"S158","num":158,"type":"single","q":"营养泵持续喂养的速度：建议使用营养泵持续喂养时，速度（  ），每日约12—24h内输注完毕。","options":["从快到慢，即首日速度为50—20ml/h","从慢到快，即首日速度为20—50ml/h","从慢到快，即首日速度为50—100ml/h","从慢到快，即首日速度为100—150ml/h"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"营养泵持续喂养应遵循\"从慢到快、逐渐增加\"的原则，首日速度为20-50ml/h，耐受后逐步加快，每日约12-24小时内输注完毕。这样可减少腹胀、腹泻等胃肠道不耐受反应，所以选B。"},{"id":"S159","num":159,"type":"single","q":"鼻饲营养液加温：持续输注鼻饲营养液时，可使用加温器，营养液温度维持在（  ），但加温器需谨慎使用 。","options":["32—38℃","36—38℃","40—45℃","38—40℃"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"持续输注时营养液温度应维持在38-40℃，接近人体体温。温度过低容易引起腹痛、腹泻；过高会烫伤胃肠黏膜、破坏营养成分，所以选D。加温器要谨慎使用，防止温度失控。"},{"id":"S160","num":160,"type":"single","q":"持续鼻饲时，每(    )用20—30ml温水脉冲式冲管1次。","options":["4h","2h","3h","1h"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"持续鼻饲时，每4小时用20-30ml温水脉冲式冲管1次，防止营养液残留堵管，所以选A。"},{"id":"S161","num":161,"type":"single","q":"鼻饲患者，间歇或分次喂养时，每次喂养前后用(  )。","options":["100—200ml温水脉冲式冲管","200—300ml温水脉冲式冲管","20—30ml温水脉冲式冲管","50—100ml温水脉冲式冲管"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"间歇或分次喂养时，每次喂养前后都要用20-30ml温水脉冲式冲管，既确认管道通畅，也冲净管壁残留的营养液，防止堵管，所以选C。"},{"id":"S162","num":162,"type":"single","q":"鼻饲营养袋、营养管和营养液容器应每 (    )更换 。","options":["2h","12h","24h","48h"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"营养液是细菌的良好培养基，营养袋、营养管和营养液容器应每24小时更换，以减少污染和感染风险，所以选C。"},{"id":"S163","num":163,"type":"single","q":"患者张某，女，神志恍惚，言语不清，卧于气垫床上，无家属陪护，护理人员在为其进行静脉输液，该如何进行有效的身份识别？","options":["让患者家属报患者姓名，PDA与床头牌、腕带核对","查看患者腕带，PDA扫描，与腕带、输液执行单及操作物核对","让患者自报姓名、PDA扫描，与腕带、床头牌、输液执行单及操作物核对","与床头牌、操作物核对"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"患者神志恍惚、言语不清，不能自己报姓名，又没有家属陪护，所以应以腕带为准：查看腕带，PDA扫描，再与腕带、输液执行单和操作物核对，选B。A错：无家属可问。C错：患者无法可靠自报姓名。D错：床头牌容易放错，不能单独作为身份识别依据。"},{"id":"S164","num":164,"type":"single","q":"关于压疮的预防措施，以下说法不正确的是（  ）。","options":["用清水和中性的清洗剂清洁皮肤","交接班时发现发红的皮肤应用力按摩，尽快促进循环，避免局部区域受压","日常使用弱酸性、不含乙醇的润肤剂，干性皮肤应每天使用","使用气垫床、海绵垫、水垫、凝胶垫等以改善局部血液供应状态"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"B不正确。发红的皮肤说明局部已受压受损，禁止用力按摩，按摩会加重软组织损伤，应解除局部受压。A（清水和中性清洗剂）、C（弱酸性、不含乙醇的润肤剂）、D（使用减压垫改善局部血供）都是正确的预防措施。"},{"id":"S165","num":165,"type":"single","q":"下列关于口服药物的目的和注意事项，不正确的是（ ）。","options":["对牙齿有腐蚀作用的药物，应使用吸水管吸服后漱口","健胃药应在饭后服用","缓释片、肠溶片、将囊服用时不应嚼服","服用对呼吸道粘膜有安抚作用的药物，如止咳糖浆后不宜大量饮水"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"B不正确。健胃药要刺激胃液分泌，应在饭前服用，不是饭后。A（腐蚀牙齿的药物用吸水管吸服后漱口）、C（缓释片、肠溶片、胶囊不应嚼服，以免破坏药物释放）、D（止咳糖浆服后不宜大量饮水，以免冲淡药物对呼吸道黏膜的保护作用）都是正确的。"},{"id":"S166","num":166,"type":"single","q":"某女性患者，70岁，脑出血术后1年，长期卧床，今晨交接班时发现骶尾部皮肤有一2*2cm的红色皮损，周围可见小水疱，未见肉芽组织，该患者的压疮分期是（  ）。","options":["1期","2期","3期","不可分期"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"2期压疮是部分皮层缺失，创面呈红色或粉红色，无腐肉、无肉芽，也可表现为浆液性水疱。本题骶尾部有2*2cm红色皮损，周围有小水疱，未见肉芽，符合2期，所以选B。1期皮肤完整；3期有全层皮肤缺失。"},{"id":"S167","num":167,"type":"single","q":"林奶奶，75岁，因肺部感染收入院，既往脑梗死，长期卧床，入院时患者大小便失禁，神志模糊状态，左侧上下肢肌力2级，肌张力正常，骶尾部皮肤可见5*5cm指压不变白的红斑，请问，属于那一期压疮？","options":["1期","2期","3期","4期"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"1期压疮的特点是皮肤完整，局部出现指压不变白的红斑。本题骶尾部皮肤有5*5cm指压不变白的红斑，皮肤没有破损，所以是1期，选A。"},{"id":"S168","num":168,"type":"single","q":"责任护士为患者更换液体前PDA扫描显示该医嘱不存在，经再次核对发现此药液为另一患者的药液，护士立即取回正确的药液，经PDA扫描匹配后为患者更换，此不良事件的分级为（  ）级？","options":["I级事件","II级事件","III级事件","IV级事件"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"给药前PDA扫描时发现药液不对，核对后换上正确的药液，错误在到达患者之前就被拦截，没有给患者造成任何后果，属于Ⅳ级事件（未造成后果的事件），所以选D。具体分级依据本院《不良事件分级标准》。"},{"id":"S169","num":169,"type":"single","q":"患者男，76岁，脑梗死遗留右侧肢体偏瘫，卧床2年余，压疮风险评估为13分，请问该患者属于哪一风险等级？","options":["高危","低危","中危","无风险"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"Braden评分的风险分级为：15-18分低危，13-14分中危，10-12分高危，≤9分极高危。本题患者13分，属于中危，所以选C。"},{"id":"S170","num":170,"type":"single","q":"CPR开放气道，患者怀疑颈椎损伤时采取何种开放气道方法？","options":["仰头抬颌法","仰头抬颈法","托下颌法","禁止开放气道"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"怀疑颈椎损伤时，仰头抬颌法和仰头抬颈法都会使颈部后仰，可能加重脊髓损伤，应采用托下颌法开放气道，所以选C。如果托下颌法无法开放气道，才考虑改用仰头抬颌法。"},{"id":"S171","num":171,"type":"single","q":"患者男性，68岁，急性脑梗死，神志清，左下肢肢体肌力三级，吞咽困难，2天前留置胃管，为患者进行鼻饲前，应注意什么？","options":["为患者采取平卧位","评估胃管是否在胃内，有无胃潴留","确保鼻饲液的温度在45℃左右","一次鼻饲量大约400ml"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"每次鼻饲前要先评估胃管是否在胃内、有无胃潴留（回抽观察），确认安全后再喂，所以选B。A错：应取半卧位（床头抬高30-45°），不是平卧。C错：鼻饲液温度一般为38-40℃，45℃偏高。D错：一次鼻饲量一般不超过200ml，400ml太多。"},{"id":"S172","num":172,"type":"single","q":"男性，67岁，3周前因脑血管意外导致左侧肢体瘫痪，病人神志清楚，说话口齿不清，体质瘦弱，大小便失禁，护士帮助其更换衣服的步骤是（  ）","options":["先脱右侧，后穿左侧","先脱右侧，后穿右侧","先脱左侧，后穿左侧","先脱左侧，不穿左侧"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"题库答案为B。但按基础护理的一般原则，为一侧肢体瘫痪的患者更衣，应先脱健侧（右侧）、再脱患侧；先穿患侧（左侧）、再穿健侧，这样能减少对患侧的牵拉和损伤。照此原则，应是\"先脱右侧，后穿左侧\"（选项A）。题库答案和这个原则不一致，建议再核对原题或题库答案。"},{"id":"S173","num":173,"type":"single","q":"膀胱高度膨胀且又极度衰弱的病人，首次放尿不应该超过（  ）","options":["500ml","600ml","800ml","1000ml"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"膀胱高度膨胀又极度衰弱的患者，如果一次放尿过多过快，腹腔内压力突然降低，血液大量滞留在腹腔血管内，会导致血压下降甚至虚脱；膀胱内压突然下降还可能引起膀胱黏膜急剧充血，发生血尿。所以首次放尿不应超过1000ml，选D。"},{"id":"S174","num":174,"type":"single","q":"国内外公认的抗凝剂皮下注射首选部位是（  ）？","options":["腹壁","双侧大腿前外侧上1/3","双侧臀部外上侧","上臂外侧中1/3"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"腹壁皮下脂肪丰富、血管少、吸收稳定，是抗凝剂皮下注射国内外公认的首选部位。注射点选在脐周两侧约5cm以外的区域，所以选A。"},{"id":"S175","num":175,"type":"single","q":"接诊身份不明患者，如何命名？（  ）","options":["无名氏+年月日+时分编号","性别、就诊月日和 24 小时制的时分","无名氏+年月日","无名氏+科室"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"按题库答案，接诊身份不明患者，命名方式是\"性别＋就诊月日＋24小时制的时分\"，所以选B。这样的命名唯一性强，便于身份识别。具体格式依据本院《患者身份识别制度》。"},{"id":"S176","num":176,"type":"single","q":"下列不属于护理核心制度的是（  ）？","options":["值班和交接班制度","查对制度","分级护理制度","病房管理制度"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"护理核心制度包括值班和交接班制度、查对制度、分级护理制度、病情观察制度、护理会诊制度等。病房管理制度属于一般管理制度，不属于护理核心制度，所以选D。"},{"id":"S177","num":177,"type":"single","q":"中心静脉导管导管尖端位于（  ）位置？","options":["上腔静脉","上腔静脉或下腔静脉","下腔静脉","胸导管"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"中心静脉导管的尖端应位于上腔静脉或下腔静脉的大血管内，这里血流量大，能迅速稀释药物，减少对血管壁的刺激，所以选B。胸导管属于淋巴管道，不是静脉。"},{"id":"S178","num":178,"type":"single","q":"对于血液高凝状态并使用CVC的患者，如何进行冲封管？(  )","options":["A. 建议使用肝素盐水冲、封管","建议先使用生理盐水冲管， 再使用肝素盐水封管","建议先使用肝素盐水冲管， 再使用生理盐水封管","建议使用生理盐水冲管， 不推荐常规使用含抗凝药物的封管液"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"按题库答案，血液高凝状态使用CVC的患者，先用生理盐水冲管，再用肝素盐水封管，所以选B。常规情况下不推荐使用含抗凝药物的封管液（选项D），但血液高凝状态属于特殊情况，需要用肝素盐水封管来防止导管内形成血栓。"},{"id":"S179","num":179,"type":"single","q":"无菌透明敷料应至少每( ) 更换一次，无菌纱布敷料应至少每 ( )更换一次；若穿刺部位发生渗液、渗血时应 (  )更换敷料；穿刺部位的敷料发生松动、污染等完整性受损时应( )更换？","options":["2d，7d,及时,立即","2d，2d,及时,立即","7d，2d,及时,立即","7d，7d,及时,立即"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"无菌透明敷料至少每7天更换一次，无菌纱布敷料至少每2天更换一次。穿刺部位渗液、渗血时应及时更换，敷料松动、污染等完整性受损时应立即更换，所以选C。"},{"id":"S180","num":180,"type":"single","q":"如何选择外周静脉留置针的穿刺部位？(  )","options":["宜选择手腕内侧面","宜选择手背部","宜选择下肢","宜选择前臂"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"成人外周静脉留置针宜选择前臂。前臂血管较粗、位置较固定，离关节较远，不影响活动。手腕内侧面、手背部、关节处不宜选用；下肢静脉易形成血栓、感染，成人也不宜选用。所以选D。这与第143题一致。"},{"id":"S181","num":181,"type":"single","q":"导管维护过程中棉棒清洁皮肤的顺序是什么？（ ）","options":["先洗必泰棉棒顺时针，逆时针， 再顺时针,消毒3遍,再酒精棉棒顺时针，逆时针，再顺时针,消毒3遍,","先酒精棉棒顺时针，逆时针，再顺时针, 消毒3遍,再洗必泰棉棒顺时针，逆时针，再顺时针,消毒3遍,","先酒精棉棒顺时针，顺时针， 再逆时针,消毒3遍,再洗必泰棉棒顺时针，顺时针，再逆时针,消毒3遍,","先洗必泰棉棒顺时针，顺时针， 再逆时针,消毒3遍,再酒精棉棒顺时针，顺时针，再逆时针,消毒3遍,"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"导管维护时，先用酒精棉棒脱脂去污，再用洗必泰（氯己定）棉棒消毒，每种都按\"顺时针、逆时针、再顺时针\"的顺序擦拭3遍，使皮肤各个方向都被消毒到。酒精先去脂有利于洗必泰发挥作用，所以选B。"},{"id":"S182","num":182,"type":"single","q":"李女士因发热、咳嗽、咳痰、纳差来诊，CT检查示右侧肺炎，收住院治疗，遵医嘱给予0.9%NaCL100ml+头孢哌酮舒巴坦2g，BID、0.9%NaCL250ml+VC1g+KCL5ml，QD静脉输液治疗，请问，该为患者选择哪种输液工具？(  )","options":["CVC","PICC","一次性静脉输液钢针","外周静脉留置针"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"该患者是肺炎，用的是头孢哌酮舒巴坦和维生素C、氯化钾的普通补液，药物刺激性小，疗程短，选择外周静脉留置针即可，所以选D。CVC、PICC适用于长期输液或腐蚀性、刺激性强的药物；一次性钢针不适合需每天多次输液的患者。"},{"id":"S183","num":183,"type":"single","q":"静脉输液完毕应如何正压封管？(  )","options":["应用至少20ml生理盐水 或肝素盐水正压封管","应用至少10ml生理盐水 或肝素盐水正压封管","封管液最应为导管及附加装置 管腔容积的1.2倍","应使用导管容积加延长管容积1倍的 生理盐水或肝素盐水正压封管"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"正压封管时，封管液量应为导管及附加装置管腔容积的1.2倍，这样既能把管腔内的药液冲净，又不会过量，所以选C。"},{"id":"S184","num":184,"type":"single","q":"输液港持续输液时无损伤针（   ）天更换一次？","options":["3","5","7","2"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"输液港持续输液时，无损伤针应每7天更换一次，同时更换穿刺点的敷料，所以选C。"},{"id":"S185","num":185,"type":"single","q":"使用PICC输血、输蛋白、输脂肪乳等高粘滞性药物后应如何操作？（  ）","options":["立即静脉滴注生理盐水， 冲洗导管","常规冲管后,立即用10ml-20ml生理盐水 脉冲式冲管，再输注其他液体","以上都不是","以上都不是"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"输血、输蛋白、输脂肪乳等高黏滞性药物容易附着在导管壁上，输完后应在常规冲管后，立即用10-20ml生理盐水脉冲式冲管，再输注其他液体，防止药物混合沉淀和堵管，所以选B。"},{"id":"S186","num":186,"type":"single","q":"使用止痛贴剂后（   ）（或遵照说明书）进行评估并记录。","options":["15min","30min","1h","4h"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"止痛贴剂经皮肤缓慢吸收，起效较慢，所以使用后4小时（或遵照说明书）进行评估并记录，选D。"},{"id":"S187","num":187,"type":"single","q":"若患者主诉疼痛评分（   ）分，护士应及时报告主管（或值班）医师，医师应及时对其进行疼痛评估。","options":["≥3分","≥4分","≥5分","≥7分"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"疼痛评分≥4分属于中度及以上疼痛，需要及时干预，所以护士应及时报告主管（或值班）医师，由医师评估并调整镇痛方案，选B。具体分值界限依据本院《疼痛管理制度》。"},{"id":"S188","num":188,"type":"single","q":"患者出现疼痛时应首选的给药途径为（   ）。","options":["口服","肌肉注射","静脉输液","贴剂"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"镇痛给药应首选口服，因为口服方便、无创、安全，也是WHO癌痛三阶梯治疗推荐的首选途径。口服无效或不能口服时，才考虑其他途径，所以选A。"},{"id":"S189","num":189,"type":"single","q":"患者入院或转入后（   ）内完成疼痛评估，如遇急症手术、病情变化等特殊情况，手术及病情稳定后及时完成估。","options":["半小时","1小时","2小时","当班"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"患者入院或转入后2小时内应完成疼痛评估。遇急症手术、病情变化等特殊情况，在手术及病情稳定后及时补评，所以选C。"},{"id":"S190","num":190,"type":"single","q":"关于压力性损伤，下列属于坐位时好发部位的是(    )。","options":["坐骨结节","骶尾部","肩胛骨","足跟"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"坐位时身体的重量主要由坐骨结节承担，所以坐骨结节是坐位的好发部位，选A。骶尾部、肩胛骨、足跟则是平卧位的好发部位。"},{"id":"S191","num":191,"type":"single","q":"体温多少时，体温单需体现降温？","options":["38","39","37.8","38.5"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"体温单规定，体温达到39℃时需要体现降温措施及降温后的体温，所以选B。该标准依据本院《体温单书写规范》。"},{"id":"S192","num":192,"type":"single","q":"持续监测血压的患者，每日在体温单上记录（）次。","options":["1","2","3","4"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"持续监测血压的患者，每日在体温单上记录2次（按题库规定，通常是上、下午各记录1次），所以选B。具体记录要求依据本院《体温单书写规范》。"},{"id":"S193","num":193,"type":"single","q":"临时医嘱有效期在几小时内？","options":["2小时","6小时","12小时","24小时"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"临时医嘱的有效期在24小时以内，应在短时间内执行，一般只执行一次，所以选D。有的情况另有规定（如限时执行的医嘱），以医嘱要求为准。"},{"id":"S194","num":194,"type":"single","q":"患者男，54岁，两次灌肠后排便4次，应记录为（）。","options":["4/E","2/4E","42/E","4/2E","24/E"],"letters":["A","B","C","D","E"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"灌肠的缩写是E。记录排便次数时，分子为排便次数，E前面的数字为灌肠次数。例如\"1/E\"表示灌肠后排便1次，\"2/4E\"并非规范写法。两次灌肠后排便4次，应记为4/2E，所以选D。"},{"id":"S195","num":195,"type":"single","q":"临时备用医嘱的效期是？","options":["6小时","12小时","24小时","32小时","48小时"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"临时备用医嘱（sos医嘱）仅在必要时执行，有效期为12小时，超过12小时未执行则自动失效，所以选B。"},{"id":"S196","num":196,"type":"single","q":"当医嘱内容不详时护士应怎样做？","options":["拒绝执行","询问主治医师后执行","询问同班护士后执行","询问护士长后执行","询问患者后执行"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"医嘱内容不详时，护士不能盲目执行，也不能擅自更改或询问同事、患者，应向开具医嘱的医师（主治医师）询问清楚后再执行，所以选B。"},{"id":"S197","num":197,"type":"single","q":"下列不符合护理文书书写要求的是?","options":["文字生动、形象","记录及时、准确","内容简明扼要","医学术语确切","记录者签全名"],"letters":["A","B","C","D","E"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"护理文书应当客观、真实、准确、及时、完整、简明扼要，使用确切的医学术语，记录者签全名。\"文字生动、形象\"属于文学化表达，不符合护理文书的严谨要求，所以选A。"},{"id":"S198","num":198,"type":"single","q":"下列有关医疗与护理文件管理要求的描述正确的一项是?","options":["患者不得复印医嘱单","未经护士同意,患者不得随意翻阅","患者出院后，特别护理记录单送病案室保存2年","医疗与护理文件按规定放置,用后必须放回原处","发生医疗事故纠纷时，封存的病历资料不可以是复印件"],"letters":["A","B","C","D","E"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"D正确：医疗与护理文件应按规定放置，用后必须放回原处，不得随意带出病区。A错：患者有权依法复印医嘱单等病历资料。B错：患者查阅病历要按医院规定程序办理，不是由护士个人同意。C错：护理记录单应随病历归档，保存期限按国家规定执行，不是2年。E错：病历资料封存时可以是复印件。"},{"id":"S199","num":199,"type":"single","q":"住院病历不包括(    )?","options":["病程记录","护理记录","交班报告","会诊记录","检验记录"],"letters":["A","B","C","D","E"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"住院病历包括病程记录、护理记录、会诊记录、检验记录、医嘱单等。交班报告是病区护士之间交接工作的记录，不属于住院病历，不随病历归档，所以选C。"},{"id":"S200","num":200,"type":"single","q":"护士处理医嘱时，应先执行(   )?","options":["停止医嘱","临时医嘱","临时备用医嘱","长期备用医嘱","新开的长期医嘱"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"处理医嘱遵循\"先急后缓\"的原则。临时医嘱时效性强、需要尽快执行（如急症用药、检查），所以按题库答案先执行临时医嘱，选B。有的教材强调先处理停止医嘱，题库以临时医嘱为准，建议你结合所用教材或本院规定核对。"},{"id":"S201","num":201,"type":"single","q":"下列有关危重患者护理记录单的书写描述正确的一项是?","options":["计量单位随数字填写在记录栏内","记录出入量时只需将量精确记录在记录栏内","病情及处理栏内需详细记录病情变化、措施及效果，无需签名","护理记录单不随病历留档保存","总结24h 出入液量后记录于体温单上"],"letters":["A","B","C","D","E"],"answer":[4],"answerLetters":["E"],"cat":"综合护理题库","explanation":"危重患者护理记录单的书写要求是：24小时出入液量总结后，记录在体温单相应的栏内，所以选E。A错：计量单位应写在记录栏的表头，不随每个数字重复填写。B错：记录出入量时，除了量，还要记录液体的性质、颜色等。C错：病情及处理栏需详细记录病情变化、措施及效果，并且记录者必须签全名。D错：护理记录单属于病历资料，要随病历留档保存。"},{"id":"S202","num":202,"type":"single","q":"书写病区交接班报告时，应先书写的患者是（  ）？","options":["危重患者","出院患者","新入院患者","行特殊治疗的患者","施行手术的患者"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"交接班报告按固定顺序书写：先写离开病区的患者（出院、转出、死亡），再写进入病区的患者（新入院、转入），最后写病区内需要重点交接的患者（危重、手术、特殊治疗等）。所以先写出院患者，选B。其余几类患者都排在出院患者之后。"},{"id":"S203","num":203,"type":"single","q":"下列健康教育评估正确的是？","options":["根据患者住院时间，结合患者病情及治疗护理医嘱、各项护理工作的执行情况，及时、准确实施健康宣教","当患者发生病情变化时，不用结合病情及治疗护理医嘱给予相应宣教","住院时给予健康宣教，住院期间不用给予相应宣教，直到出院","对同一内容进行宣教后，再次宣教时教育时机仍然选择首次宣教"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"健康教育要贯穿住院全过程，并且要个体化。A符合要求：根据住院时间、病情、治疗护理医嘱和各项护理工作的执行情况，及时、准确地实施宣教，所以选A。B错：病情变化时，要结合病情和医嘱给予相应宣教。C错：宣教要贯穿入院、住院期间和出院的各个阶段，不能只在入院时和出院前做。D错：同一内容再次宣教时，要重新评估患者掌握情况，并选择合适的时机，不能照搬首次时机。"},{"id":"S204","num":204,"type":"single","q":"下列有关护理文书书写基本要求不正确的是？","options":["书写记录的护士均具备执业资质","规范、及时完成各项记录，无漏记","可以提前书写护理文书","各项表单均与医嘱、患者实际情况一致"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"护理文书必须在事件发生后及时、据实书写，不能提前书写或预先记录，否则会失去真实性，也可能引发法律风险，所以C不正确。A（书写者具备执业资质）、B（规范、及时、无漏记）、D（各项表单与医嘱、患者实际情况一致）都符合要求。"},{"id":"S205","num":205,"type":"single","q":"口头医嘱的正确处理方式是（  ）？","options":["任何时候只执行书面医嘱","任何情况下应执行口头医嘱","对错误的口头医嘱不可有异议","抢救时，护士不需要复述便可执行口头医嘱","抢救完毕，应在6小时内请医师补写医嘱"],"letters":["A","B","C","D","E"],"answer":[4],"answerLetters":["E"],"cat":"综合护理题库","explanation":"口头医嘱只在抢救等紧急情况下使用，护士要复述确认后再执行，抢救完毕后，在6小时内请医师补写医嘱，所以选E。A、B错：不是任何时候只执行书面医嘱，也不是任何情况下都执行口头医嘱。C错：对有疑问的口头医嘱可以提出异议。D错：抢救时护士也要复述确认后再执行。这与第63题的6小时要求一致。"},{"id":"S206","num":206,"type":"single","q":"护士申请延续注册的时间应为（  ）？","options":["有效期届满前半年","有效期届满前30日","有效期届满后30日","有效期届满后半年"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"《护士条例》规定，护士执业注册有效期为5年；需要延续注册的，应当在有效期届满前30日向原注册部门提出申请。故选B。"},{"id":"S207","num":207,"type":"single","q":"对于患职业病的护士,应享受以下权利,但除外？","options":["依法享受国家规定的职业病待遇","诊疗、康复费用,按照国家有关工伤社会保险的规定执行","被诊断患有职业病,但用人单位没有依法参加工伤社会保险的,其医疗的生活保障由用人单位承担","用人单位除负责患职业病护士的生活保障外,不负责其他经济损失,护士不得向用人单位提出赔偿要求"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"患职业病的护士依法享受职业病待遇，诊疗、康复费用按工伤保险规定执行；用人单位未参保的，由单位承担医疗和生活保障。护士依法有权就损害提出赔偿要求，D项\"不得提出赔偿\"错误，题干问\"除外\"，故选D。"},{"id":"S208","num":208,"type":"single","q":"医疗事故技术鉴定费用的支付原则是（  ）？","options":["医疗机构支付","患方支付","提出医疗事故处理申请的一方支付","属于医疗事故的,鉴定费由医疗机构支付;不属于医疗事故的,由提出医疗事故处理申请的一方支付"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"按《医疗事故处理条例》，鉴定费用实行\"谁有责谁付\"的原则：属于医疗事故的，由医疗机构支付；不属于医疗事故的，由提出处理申请的一方支付。故选D。"},{"id":"S209","num":209,"type":"single","q":"对于在医疗卫生机构中殴打护士或者故意伤害护士身体的人,可以处以（  ）？","options":["五日以下拘留","二百元以上五百元以下罚款","五日以上十日以下拘留,并处二百元以上五百元以下罚款","五日以上十日以下拘留,并处二百元以下罚款"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"按题库依据（《护士条例》及治安管理处罚相关规定），殴打护士或故意伤害护士身体的，可处五日以上十日以下拘留，并处二百元以上五百元以下罚款，拘留与罚款并处。故选C。"},{"id":"S210","num":210,"type":"single","q":"护士执业注册被吊销,是指（  ）？","options":["是基于特定事实的出现,有卫生行政部门依据法定程序收回护士执业注册证书","不具备取得护士执业注册的条件而取得护士执业注册的,由有关行政机关予以吊销","具备取得护士执业注册的条件,但因执业注册所依据的法律、法规、规章修改或废止,或客观情况发生重大变化,基于公共利益的需要,由有关行政机关予以吊销","护士取得执业注册后从事违法活动,行政机关依法予以吊销执业注册"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"\"吊销\"是对违法行为的处罚：护士取得执业注册后从事违法活动，由行政机关依法吊销。A是\"收回/注销\"的表述，B是\"撤销\"（不具备条件而取得），C是\"撤回\"（因法律修改或公共利益需要），均不是吊销。故选D。"},{"id":"S211","num":211,"type":"single","q":"艾滋病病毒职业暴露三级的暴露类型是指？","options":["暴露沾染了有损伤的皮肤或者粘膜,暴露量小且暴露时间短","暴露沾染了有损伤的皮肤或者粘膜,暴露量大且暴露时间较长","暴露源刺伤或者割伤皮肤,但损伤程度较轻,为表皮擦伤或者针刺伤","暴露源刺伤或者割伤皮肤,但损伤程度较重,为深部伤口或者割伤物有明显可见的血液"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"艾滋病病毒职业暴露分三级。一级：沾染有损伤的皮肤或黏膜，暴露量小、时间短；二级：沾染有损伤的皮肤或黏膜，量大、时间长，或刺伤/割伤但损伤较轻（表皮擦伤、针刺伤）；三级：刺伤/割伤且损伤较重（深部伤口或割伤物有明显可见的血液）。故选D。"},{"id":"S212","num":212,"type":"single","q":"对于医疗事故赔偿中的被扶养人生活费,对60岁以上的,不超过？","options":["5年","10年","15年","20年"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"《医疗事故处理条例》规定：被扶养人不满16周岁的，扶养到16周岁；年满16周岁但无劳动能力的，扶养20年；60周岁以上的不超过15年，70周岁以上的不超过5年。故选C（15年）。"},{"id":"S213","num":213,"type":"single","q":"受聘人员有以下哪种情形,聘用单位可以随时单方面解除聘用合同是？","options":["受聘人员在试用期内","女职工在孕期、产期和哺乳期内","严重扰乱工作秩序,致使聘用单位、其他单位工作不能正常进行","患病或者非因公负伤,医疗期满后,不能从事原工作也不能从事由聘用单位安排的其他工作"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"受聘人员严重扰乱工作秩序、致使单位工作无法正常进行的，属于过错性情形，聘用单位可随时单方解除合同。A试用期内一般是可解除但需符合规定；B孕产哺乳期属于法律保护，不得解除；D患病/非因公负伤医疗期满的需提前通知，不能\"随时\"解除。故选C。"},{"id":"S214","num":214,"type":"single","q":"护士执业证书由以下哪个部门颁发？","options":["中央人民政府","中央人民政府卫生主管部门","省、自治区、直辖市人民政府","省、自治区、直辖市人民政府卫生主管部门"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"护士执业注册由省、自治区、直辖市人民政府卫生主管部门负责，护士执业证书也由其颁发，国家层面不直接发证。故选D。"},{"id":"S215","num":215,"type":"single","q":"取得以下哪种法律文书,则代表持有者具备护士执业资格,可以从事护理专业技术活动？","options":["《护士执业证书》","高等学校护理学专业毕业证书","《专科护士培训合格证书》","《护理员资格证书》"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"护士执业资格的法定证明是《护士执业证书》，取得后方可从事护理专业技术活动。毕业证书、培训合格证书、护理员证书均不能代表具备护士执业资格。故选A。"},{"id":"S216","num":216,"type":"single","q":"护士发现医师医嘱可能存在错误,但仍然执行错误医嘱,对病人造成严重后果,该后果的法律责任承担者是？","options":["开写医嘱的医师","执行医嘱的护士","医师和护士共同承担","医师和护士无需承担责任"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"护士发现医嘱可能有误，应当向开具医嘱的医师提出；明知有误仍执行并造成严重后果的，护士存在过错，应与开具错误医嘱的医师共同承担责任。故选C。"},{"id":"S217","num":217,"type":"single","q":"护理人员在进行执业前必须经过？","options":["专业培训","临床实践3个月","护士执业注册","积累一定的护理经验"],"letters":["A","B","C","D"],"answer":[2],"answerLetters":["C"],"cat":"综合护理题库","explanation":"护理人员必须依法取得护士执业证书并经执业注册后才能执业，这是法定前置条件，培训、实践或经验均不能代替。故选C。"},{"id":"S218","num":218,"type":"single","q":"以下那一项说法是不正确的？","options":["具有工作经验的实习护士应鼓励单独执行护理技术操作","医疗机构应设置专门机构或专职（兼）人员负责护理管理工作","未取得护士职执业证书的人员不得在医疗机构进行执业","有效期届满未延续注册的护理人员不得继续执业"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"实习护士不具有独立执业资格，必须在执业护士的指导和监督下进行操作，不得独立执行护理技术操作，因此A\"鼓励单独执行\"
