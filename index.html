"id":"S520","num":520,"type":"single","q":"查体心律不齐，心电图R-R长短不一，P波强弱不等消失，首选诊断","options":["室早二联律","心房颤动","房早","室上速","室颤"],"letters":["A","B","C","D","E"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"R-R间期长短不一（绝对不齐）、P波消失并被f波取代，是心房颤动的典型心电图表现。故选B。"},{"id":"S521","num":521,"type":"single","q":"尖端扭转型室速关键是","options":["宽 QRS、主波扭转、QT 延长","规律锯齿波","逆行 P 波、突发突止","A.绝对不齐、f 波"],"letters":["A","B","C","D"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"尖端扭转型室速的特点是宽QRS、QRS主波方向围绕等电位线扭转，常伴QT间期延长；锯齿波是房扑，逆行P波突发突止是室上速，绝对不齐加f波是房颤。故选A。"},{"id":"S522","num":522,"type":"single","q":"二度 Ⅱ 型房室传导阻滞特点是","options":["PR 渐长伴漏搏","PR 固定伴漏搏","P 与 QRS 无关","PR 延长无漏搏"],"letters":["A","B","C","D"],"answer":[1],"answerLetters":["B"],"cat":"综合护理题库","explanation":"二度Ⅱ型房室传导阻滞的特点是PR间期固定（可正常或延长），突然出现QRS脱落（漏搏）；PR间期逐渐延长直到漏搏的是二度Ⅰ型。故选B。"},{"id":"S523","num":523,"type":"single","q":"室性早搏最典型心电图特征是","options":["提前宽大畸形QRS，无相关P波，代偿间歇完全","提前异形P波，QRS正常","RR绝对不齐","PR固定延长","ST持续抬高"],"letters":["A","B","C","D","E"],"answer":[0],"answerLetters":["A"],"cat":"综合护理题库","explanation":"室性早搏的典型表现：提前出现宽大畸形的QRS波（>0.12秒），其前无相关P波，代偿间歇完全。故选A。"},{"id":"S524","num":524,"type":"single","q":"下列哪项不是心肌缺血心电图改变","options":["ST水平下移","倒置T波","T波低平","病理性Q波"],"letters":["A","B","C","D"],"answer":[3],"answerLetters":["D"],"cat":"综合护理题库","explanation":"心肌缺血表现为ST段水平或下斜型压低、T波低平或倒置；病理性Q波是心肌坏死（梗死）的表现，不属于缺血性改变。题干问\"不是\"，故选D。"},{"id":"M1","num":1,"type":"multiple","q":"2025版CRBSI指南中，可有效降低血流感染的措施有（）","options":["每日评估导管留置必要性","规范接头消毒与更换","严格无菌置管操作","尽早拔除无用导管"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"CRBSI（导管相关血流感染）预防的核心是：严格无菌置管、规范接头消毒与更换、每日评估导管必要性并尽早拔除无用导管。四项均有效，故选ABCD。"},{"id":"M2","num":2,"type":"multiple","q":"中心静脉导管规范冲封管的目的包括（）","options":["预防药物沉淀堵塞","预防血液反流堵管","降低血栓风险","杜绝配伍禁忌反应"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"规范冲封管可冲净管腔内残留药液和血液，预防药物沉淀、血液反流堵管，降低血栓风险，并避免配伍禁忌药物在管内接触产生反应。故选ABCD。"},{"id":"M3","num":3,"type":"multiple","q":"CVC拔管前评估内容包含（）","options":["凝血功能","导管留置目的是否完成","局部皮肤有无感染","患者生命体征"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"CVC拔管前需评估凝血功能（防出血）、留置目的是否完成、局部皮肤有无感染及生命体征，确认可安全拔除。故选ABCD。"},{"id":"M4","num":4,"type":"multiple","q":"T/CNAS22-2021血管活性药物输注禁忌包括（）","options":["外周细短导管长期输注","与其他药物混合同路推注","无泵控重力输注","药物外渗后热敷"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"血管活性药物刺激性强、外渗后损伤重，应经中心静脉、用泵控输注，避免外周细短导管长期输注、与其他药物混合推注、无泵重力输注；外渗后应冷敷或按方案处理，禁止热敷（可加重损伤）。四项均为禁忌，故选ABCD。"},{"id":"M5","num":5,"type":"multiple","q":"预防静脉导管相关血栓的护理措施包括（）","options":["规范脉冲冲管正压封管","指导患者置管肢体适度活动","避免导管打折受压","长期制动患肢"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"预防导管相关血栓的措施包括脉冲冲管+正压封管、置管肢体适度活动、避免导管打折受压；长期制动患肢使血流缓慢，会增加血栓风险。故选ABC。"},{"id":"M6","num":6,"type":"multiple","q":"PICC日常生活注意事项?(  )","options":["线片确定 PICC 尖端位置正确后方可治疗。","置管侧手臂不可测量血压，严禁使用高保往射器经PICC 注射造影剂（耐高压导管除外），防止导管破裂。","不能在穿刺点上方扎止血带进行静脉采血。","不能提超过 5kg 的重物。","晚上睡觉不要长时间侧卧于置管侧。"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"PICC日常注意事项：X线确认尖端位置后方可使用；置管侧不测血压、不扎止血带采血、不用高压注射器推注（耐高压导管除外）；避免提超过5 kg重物；睡眠避免长时间压迫置管侧。五项均正确，故选ABCDE。"},{"id":"M7","num":7,"type":"multiple","q":"PVC穿刺部位的选择：（）。","options":["宜选择上肢，避开静脉瓣、关节部位及炎症、疤痕、硬结等","成人不宜选择下肢静脉","小儿不宜首选头皮静脉","不宜选择有血栓的静脉","腋下淋巴结清扫术应选择健侧的静脉"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"外周静脉留置针穿刺：成人宜选上肢，避开静脉瓣、关节及炎症硬结处，不宜选下肢；小儿不宜首选头皮静脉；避开有血栓的静脉；腋下淋巴结清扫术后选择健侧。五项均正确，故选ABCDE。"},{"id":"M8","num":8,"type":"multiple","q":"穿刺工具选择原则:（）。","options":["满足治疗需求","尽量选择最细、最短的导管","留置时间最短","对患者损伤最少","穿刺次数最少"],"letters":["A","B","C","D","E"],"answer":[0,1,3,4],"answerLetters":["A","B","D","E"],"cat":"综合护理题库","explanation":"穿刺工具选择原则：满足治疗需求前提下，选择最细、最短的导管，对患者损伤最少、穿刺次数最少。\"留置时间最短\"不是选择工具的原则（留置时间取决于治疗需要）。故选ABDE。"},{"id":"M9","num":9,"type":"multiple","q":"对于双腔或多腔的中心静脉导管，该如何进行冲封管?(  )","options":["按照使用哪个官腔，对哪个管腔进行冲封管的原则执行，未使用的管腔不需要冲封管","每个管腔均需进行冲管、封管","逐个对所有管腔进行冲封管","要单手同时冲管、封管"],"letters":["A","B","C","D"],"answer":[1,3],"answerLetters":["B","D"],"cat":"综合护理题库","explanation":"按题库答案，双腔/多腔中心静脉导管应对每个管腔都进行冲封管（B）；冲封管时要单手同时冲管封管（D）。A\"未使用的管腔不需要冲封管\"错误，C虽表述类似B但题库未选。故选BD。"},{"id":"M10","num":10,"type":"multiple","q":"关于输液港的适应症，描述正确的是（）。","options":["长期或重复静脉输注药物","输注化疗药物","TPN及其他高渗性液体输入","输血、抽血、输入药物、普通静脉输液等"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"输液港适用于长期或重复静脉输液、化疗、TPN及高渗液体输注，也可用于输血、抽血和普通输液。四项均正确，故选ABCD。"},{"id":"M11","num":11,"type":"multiple","q":"关于中心静脉导管的冲封管操作，以下哪项是正确的？(  )","options":["发生 CVC 相关性血栓时，可采用含尿激酶封管液进行封管","不推荐常规使用含抗生素封管液预防 CRBSI","对于长期使用 CVC、有多次 CRBSI 病史的高感染风险患","不推荐常规使用含尿激酶封管液预防 CVC 相关性血栓堵塞"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"CVC相关血栓可用含尿激酶封管液；不推荐常规用含抗生素封管液预防CRBSI（仅限长期使用、有多次CRBSI史的高风险患者）；不推荐常规用尿激酶封管预防血栓堵塞。四项表述均符合共识，故选ABCD。"},{"id":"M12","num":12,"type":"multiple","q":"如何选择适宜的 VAD，应根据以下哪方面来评估()。","options":["输液治疗史","治疗方案","预期治疗的时间","血管特征","患者年龄"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"选择血管通路装置（VAD）时应综合评估输液治疗史、治疗方案、预期治疗时间、血管特征和患者年龄等。故选ABCDE。"},{"id":"M13","num":13,"type":"multiple","q":"输液导管相关静脉血栓（CRT）的分类（）。","options":["深静脉血栓（DVT）","无症状血栓","血栓性浅静脉炎","血栓性导管失功"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"输液导管相关静脉血栓（CRT）包括深静脉血栓、无症状血栓、血栓性浅静脉炎和血栓性导管失功。故选ABCD。"},{"id":"M14","num":14,"type":"multiple","q":"输液附加装置包括（），应尽可能减少输液附加装置的使用。","options":["三通、延长管","肝素帽","无针接头","过滤器"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"输液附加装置包括三通、延长管、肝素帽、无针接头和过滤器等，使用越多，污染和感染风险越高，应尽量减少。故选ABCD。"},{"id":"M15","num":15,"type":"multiple","q":"输液港拔除指征?(  )","options":["导管出现夹闭综合征。","注射座渗漏。","出现导管相关性血流感染。","导管相关性血栓合并感染。","导管与港座分离或断裂。"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"输液港拔除指征包括：导管夹闭综合征、注射座渗漏、导管相关血流感染、血栓合并感染、导管与港座分离或断裂。五项均属拔除指征，故选ABCDE。"},{"id":"M16","num":16,"type":"multiple","q":"输液港的冲管时机为（）。","options":["每次使用输液港前后","抽血或输注高粘滞性液体(输血、成分血、TPN、脂肪乳剂等)后，应立即冲净导管再接其他输液","两种有配伍禁忌的液体之间","治疗间歇期每4周冲管一次"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"输液港冲管时机：每次使用前后；抽血或输注高黏滞性液体（血、TPN、脂肪乳）后立即冲净；两种有配伍禁忌液体之间；治疗间歇期每4周一次。四项均正确，故选ABCD。"},{"id":"M17","num":17,"type":"multiple","q":"输液港港体周围局部评估内容有哪些(）。","options":["穿刺港体周围皮肤完整性情况","导管功能及导管管腔内有无血液残留","导管是否存在脱出、移位、打折、折断等情况","穿刺点距离港座的皮下厚度"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"输液港港体局部评估包括：港体周围皮肤完整性、导管功能及管腔血液残留、导管有无脱出移位打折折断，以及穿刺点距港座的皮下厚度（影响针的选择和穿刺）。故选ABCD。"},{"id":"M18","num":18,"type":"multiple","q":"输液港维护时注意事项?(  )","options":["输液期间每周由专人负责更换无损伤针，操作时需严格无菌技术操作。","无损伤针从输液港中点垂直、轻柔刺入，避免穿刺力度过大导致针尖弯曲形成倒钩，针尖斜面宜与输液港座出口反方向，使其冲管效果最佳。","每次注射用药前应抽回血证实无损伤针位于输液港内方可用药，难免药物注入皮下或局部组织，造成局部组织积液、感染或坏死。","避免使用10ml以下注射器注药，避免高压推注造影剂（耐高压输液港除外)。","密切观察穿刺部位有无局部肿胀、疼痛、皮疹等症状。"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"输液港维护要点：输液期间每周由专人更换无损伤针；垂直轻柔刺入；每次用药前抽回血确认位置；避免用10 ml以下注射器高压推注；密切观察局部有无肿胀疼痛等。五项均正确，故选ABCDE。"},{"id":"M19","num":19,"type":"multiple","q":"为留置导管患者提供导管维护的相关知识具体内容包括但不限于()。","options":["静脉导管应定期进行维护","观察穿刺点有无渗血渗液等异常情况","观察全身不适状况，有无发热等不适","观察导管外露长度的变化，以及是否有打折、破损","观察贴膜有无出现潮湿、脱落、卷边情况"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"导管维护宣教内容包括定期维护，观察穿刺点渗血渗液、全身症状（如发热）、导管外露长度及打折破损、贴膜潮湿脱落卷边等。五项均属宣教内容，故选ABCDE。"},{"id":"M20","num":20,"type":"multiple","q":"选择冲管容积时应考虑的因素包括()。","options":["导管的类型","导管的大小","患者的年龄","输液治疗的类型"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"冲管容积应根据导管类型、大小、患者年龄及输液治疗类型确定，以充分冲净管腔为宜。故选ABCD。"},{"id":"M21","num":21,"type":"multiple","q":"药物渗出与外渗常见危险因素主要包括:(  )。","options":["物理因素","生理因素","疾病因素","年龄因素"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"药物渗出与外渗的危险因素包括物理因素（如穿刺技术、固定）、生理因素、疾病因素和年龄因素等。故选ABCD。"},{"id":"M22","num":22,"type":"multiple","q":"以下情况应立即更换输液接头()。","options":["输液接头内有血液残留或有残留物","完整性受损或被取下","在血管通路装置血液培养取样之前","明确被污染时","96小时内"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"输液接头内有血液或残留物、完整性受损或被取下、血培养取样前、明确被污染时，应立即更换；常规更换周期是不超过7天，并非\"96小时内\"。故选ABCD。"},{"id":"M23","num":23,"type":"multiple","q":"植入式给药装置又称输液港（PORT）早期并发症包括（ ）。","options":["导管相关性血栓","切口不愈合或裂开","港体翻转","淋巴瘘或乳糜胸"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"输液港早期并发症包括导管相关血栓、切口不愈合或裂开、港体翻转、淋巴瘘或乳糜胸、气胸、血肿等。故选ABCD。"},{"id":"M24","num":24,"type":"multiple","q":"中等长度导管静脉穿刺血管选择?(   )","options":["选择上臂血管  贵要静脉、肱静脉、肘正中静脉及头静脉，首选贵要静脉。","成人：首选上臂静脉。","婴幼儿：除以上静脉外，还可以选择头部静脉（导管尖端在颈部或胸部以下静脉内）和腿部静脉（导管尖端位于腹股沟以上的静脉内)。","应避免穿刺小血管（中等长度导管的导管外径/血管内径比值≤45%)。"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"中等长度导管穿刺：成人首选上臂静脉，首选贵要静脉；婴幼儿可另选头部或腿部静脉；应避免穿刺小血管（导管外径/血管内径比≤45%）。四项均正确，故选ABCD。"},{"id":"M25","num":25,"type":"multiple","q":"中长导管适应症有哪些？（ ）。","options":["预计治疗时间1-4周天的病人","持续输注等渗或接近等渗的药物","短期静脉注射万古霉素的病人（少于6天的治疗）","需持续镇静与镇痛的病人"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"中长导管适用于预计治疗1～4周、持续输注等渗或接近等渗药物、短期使用万古霉素（少于6天）、需持续镇静镇痛的患者。故选ABCD。"},{"id":"M26","num":26,"type":"multiple","q":"静脉留置针穿刺成功后，如何做好固定工作？","options":["使用无菌敷料，以穿刺点为中心覆盖留置针","无张力垂放贴膜，将隔离塞端口处完全覆盖","要先捏抚按压进行贴膜的塑形，再抚平按压整个贴膜，使之与皮肤充分黏贴","延长管呈U型固定，肝素帽固定位置与血管平行稍高于导管尖端"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"留置针固定要点：无菌敷料以穿刺点为中心覆盖；无张力垂放贴膜并覆盖隔离塞端口；先塑形再抚平，使贴膜与皮肤充分黏合；延长管U型固定，肝素帽高于导管尖端、与血管平行。故选ABCD。"},{"id":"M27","num":27,"type":"multiple","q":"静脉炎常见的临床表现有哪些？","options":["红肿热痛","沿静脉走向出现红色条纹","静脉呈条索状","滴速减慢"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"静脉炎表现为局部红肿热痛，沿静脉走向出现红色条纹，静脉呈条索状，输液滴速减慢等。故选ABCD。"},{"id":"M28","num":28,"type":"multiple","q":"静脉留置针穿刺部位?(   )","options":["从远心端静脉开始有计划地使用、更换穿刺部位","避开炎症、硬结及水肿部位","避开神经、局部组织损伤部位","避开关节和活动受限部位","成人应避免下肢静脉穿刺。"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"留置针穿刺部位应从远心端开始有计划地更换，避开炎症硬结水肿、神经和组织损伤部位、关节和活动受限部位，成人避免下肢静脉。五项均正确，故选ABCDE。"},{"id":"M29","num":29,"type":"multiple","q":"外周静脉留置针慎用或禁用范围?(   )","options":["输入pH  9 的液体或药物","渗透压> 600mmol/L 的液体","肠外营养液（TPN）","腐蚀性药物"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"外周留置针慎用或禁用于pH9的药物、渗透压>600 mmol/L的液体、肠外营养液（TPN）和腐蚀性药物，这些应经中心静脉输注。故选ABCD。"},{"id":"M30","num":30,"type":"multiple","q":"静脉炎的类型?(  )","options":["机械性","化学性","血栓性","感染性","输注后静脉炎"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"静脉炎按成因分为机械性、化学性、血栓性、感染性和输注后静脉炎五类。故选ABCDE。"},{"id":"M31","num":31,"type":"multiple","q":"关于中心静脉导管的冲封管操作，以下哪项是正确的？ (  )","options":["发生 CVC 相关性血栓时， 可采用含尿激酶封管液进行封管","不推荐常规使用含抗生素 封管液预防 CRBSI","对于长期使用 CVC、有多次 CRBSI 病史的高感染风险患","不推荐常规使用含尿激酶封管液 预防 CVC 相关性血栓堵塞"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"与第11题相同：CVC相关血栓可用含尿激酶封管液；不推荐常规用抗生素封管液预防CRBSI；高感染风险患者可考虑；不推荐常规用尿激酶封管预防血栓堵塞。故选ABCD。"},{"id":"M32","num":32,"type":"multiple","q":"对于双腔或多腔的中心静脉导管，该如何进行冲封管? (  )","options":["按照使用哪个官腔，对哪个管腔进行 冲封管的原则执行，未使用的管腔不需要冲封管","每个管腔均需进行冲管、封管","逐个对所有管腔进行冲封管","要单手同时冲管、封管"],"letters":["A","B","C","D"],"answer":[1,3],"answerLetters":["B","D"],"cat":"综合护理题库","explanation":"与第9题相同，按题库答案：每个管腔均需冲封管（B），并要单手同时冲管封管（D）；\"未使用的管腔不需要冲封管\"的说法错误。故选BD。"},{"id":"M33","num":33,"type":"multiple","q":"PICC、CVC、PORT 的冲管和封管可以使用(  )mL 注射器。","options":["5ml","20ml","2ml","10ml"],"letters":["A","B","C","D"],"answer":[1,3],"answerLetters":["B","D"],"cat":"综合护理题库","explanation":"PICC、CVC、PORT冲封管应使用≥10 ml的注射器（如10 ml、20 ml），小注射器产生的压力过大，可能使导管破裂。2 ml、5 ml不可用。故选BD。"},{"id":"M34","num":34,"type":"multiple","q":"关于静脉导管的冲管频率，以下哪项是正确的？(  )","options":["治疗间歇期的PICC，至少1周冲封管1次","治疗间歇期的PORT，一般4周 冲封管1次","暂不使用的外周静脉导管， 应间隔24h冲封管1次","每次输液治疗结束后， 应进行冲封管"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"冲封管频率：治疗间歇期PICC至少每周1次，PORT一般每4周1次，暂不使用的外周静脉导管每24小时1次；每次输液治疗结束后都应冲封管。四项均正确，故选ABCD。"},{"id":"M35","num":35,"type":"multiple","q":"关于静脉导管冲管溶液的选择，以下哪项是正确的？ (  )","options":["应使用不含防腐剂的生理盐水进行冲封管","冲管液宜使用一次性单剂量的 生理盐水","输注药物与生理盐水不相容时， 应先使用5%葡萄糖注射液冲洗，再使用生理盐水冲管","应使用无菌注射用水冲洗导管"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"冲管应使用不含防腐剂的一次性单剂量生理盐水；药物与生理盐水不相容时，先用5%葡萄糖冲洗再用生理盐水冲管。不应使用无菌注射用水冲洗导管（低渗，可引起溶血和不适）。故选ABC。"},{"id":"M36","num":36,"type":"multiple","q":"王某，48岁，因反复胃痛入院，经一系列检查，确诊为胃癌，需住院进行周期化疗，请问责任护士可以为患者选择哪种静脉导管？(  )","options":["外周静脉留置针","PICC","输液港","一次性静脉输液钢针"],"letters":["A","B","C","D"],"answer":[1,2],"answerLetters":["B","C"],"cat":"综合护理题库","explanation":"胃癌周期化疗药物刺激性强、疗程长，应选择中心静脉通路，即PICC或输液港。外周留置针和钢针易致外渗和静脉炎，不适合。故选BC。"},{"id":"M37","num":37,"type":"multiple","q":"根据《中心静脉导管冲管及封管专家共识》要求， 使用中心静脉导管的患者，应在何时进行冲封管？(  )","options":["输注中成药制剂、血管活性药后，宜进行冲管","输液前后需要进行冲、封管","输注高渗药、化疗药物、抗生素等血管刺激性药物后，宜进行冲管","输血前后需要进行冲、封管"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"中心静脉导管冲封管时机：输液前后、输血前后，以及输注中成药、血管活性药、高渗药、化疗药、抗生素等刺激性药物后均应冲管。四项均正确，故选ABCD。"},{"id":"M38","num":38,"type":"multiple","q":"穿刺点渗血的程度，根据渗血面积分为?(  )","options":["轻度:渗血浸湿敷料直径<1cm。","中度:渗血浸湿敷料直径≥1cm，<2cm。","重度:渗血浸湿敷料直径≥2cm。","极重：渗血浸湿敷料 直径≥2cm，<5cm。"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"穿刺点渗血按浸湿敷料直径分级：轻度<1 cm，中度≥1 cm且<2 cm，重度≥2 cm。没有\"极重\"一级。故选ABC。"},{"id":"M39","num":39,"type":"multiple","q":"约束解除指征有哪些？","options":["可使用约束替代措施","患者深度镇静状态、昏迷、肌无力","患者意识清楚，情绪稳定，精神或定向力恢复正常，可配合治疗及护理，无攻击拔管行为或倾向","支持生命的治疗/设备已终止"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"约束解除指征包括：可使用替代措施、患者深度镇静/昏迷/肌无力无法自主活动、意识清楚情绪稳定能配合治疗、支持生命的治疗或设备已终止。四项均成立，故选ABCD。"},{"id":"M40","num":40,"type":"multiple","q":"哪些人员需要进行约束前评估？","options":["出院患者","病区所有新转入的患者","病区所有新入院的患者","跌倒高风险的患者"],"letters":["A","B","C","D"],"answer":[1,2],"answerLetters":["B","C"],"cat":"综合护理题库","explanation":"约束前评估对象是病区所有新入院和新转入的患者；出院患者无需评估，跌倒高风险只是评估内容之一，并非单独的评估对象范围。故选BC。"},{"id":"M41","num":41,"type":"multiple","q":"为了保护不能自主控制行为的患者，医护人员通常会采取保护性身体约束措施，请问在实施保护性身体约束时，以下做法正确的是？","options":["应当遵循做小范围及最短时间的最小化约束性原则","不能作为常规手段，只有在患者必须使用约束时才能实施","实施约束前，必须由医生对患者实施评估并下达医嘱后，才能为患者使用约束用具","重症医学科患者多存在神志不清、躁动的行为，当患者入科后，应常规实施身体约束"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"保护性约束应遵循最小化原则，不能作为常规手段，且必须经医生评估并下达医嘱后实施。重症患者不能一入科就常规约束。故选ABC。"},{"id":"M42","num":42,"type":"multiple","q":"张某因家庭琐事产生轻生念头，自服农药敌敌畏50ml，被家人发现后送来医院抢救，抢救结束后，将患者转运至重症医学科治疗，住院期间，患者烦躁不安，拒绝配合医护人员，试图拔除留置的各项管道，医生在充分评估并征求家属同意后，下达保护性约束医嘱，请问责任护士的以下哪项做法是正确的？","options":["约束用具的松紧度以能容纳1-2横指为宜，并在约束部位给予皮肤保护措施","给予患者四肢及躯干的全身约束，以免发生非计划性拔管","保持约束肢体的功能位及一定活动度","要动态观察约束的松紧度、局部皮肤颜色、温度、血运等情况"],"letters":["A","B","C","D"],"answer":[0,2,3],"answerLetters":["A","C","D"],"cat":"综合护理题库","explanation":"约束松紧以容纳1～2横指为宜并保护皮肤，保持肢体功能位和一定活动度，动态观察局部皮肤颜色、温度、血运；不应对四肢及躯干全身约束，应只约束必要部位。故选ACD。"},{"id":"M43","num":43,"type":"multiple","q":"以下哪些药品属于高警示药物？","options":["高浓度电解质制剂","胰岛素制剂","肌肉松弛剂","细胞毒性药品"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"高警示药物是使用不当时易造成严重伤害的药物，包括高浓度电解质、胰岛素、肌肉松弛剂、细胞毒性药品等。故选ABCD。"},{"id":"M44","num":44,"type":"multiple","q":"某科室，护理人员发现患者体温不升，在未上报医生的情况下，私自为患者使用升温毯升温及热水瓶升温，导致患者发生严重烫伤，护理人员怕被追究责任，未上报护士长，并要求其他护理人员帮助隐瞒，2天后，仍没有护理人员主动报告护士长，医院质控小组人员发现患者烫伤的皮肤后，通知科室护士长。通过该事件可以看出科室人员违反了哪些制度？","options":["医疗差错、事故登记和报告制度","急危重患者抢救制度","医疗安全（不良）事件管理制度","值班和交接班制度"],"letters":["A","B","C","D"],"answer":[0,2,3],"answerLetters":["A","C","D"],"cat":"综合护理题库","explanation":"护士未上报即私自处理、发生烫伤后隐瞒不报，违反了医疗差错事故登记报告制度、医疗安全（不良）事件管理制度，以及值班交接班制度（病情和异常未交接）。与急危重患者抢救制度无关。故选ACD。"},{"id":"M45","num":45,"type":"multiple","q":"患者张某，癌痛难以忍受，遵医嘱肌肉注射吗啡，请问护士的以下做法正确的是？","options":["两名护理人员共同核对无误后方可执行","执行后保留空安瓿，再次核对后方可丢弃","持红方到药房取药","按要求做好使用登记记录"],"letters":["A","B","C","D"],"answer":[0,2,3],"answerLetters":["A","C","D"],"cat":"综合护理题库","explanation":"麻醉药品（吗啡）管理：凭专用红色处方领药，两人核对后执行，并做好使用登记；使用后须回收空安瓿（交回药房并登记），而非自行保留后丢弃。故选ACD。"},{"id":"M46","num":46,"type":"multiple","q":"导管相关性血流感染的定义，以下正确的是（ ）？","options":["从导管段和外周培养出相同种类、相同药敏结果的致病菌","带有血管内导管或拔除血管内导管48小时内的患者出现菌血症或真菌血症","伴有发热（＞38℃）、寒战或低血压等感染表现，除血管导管外没有其他明确的感染源","外周静脉血培养细菌或真菌阳性"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"CRBSI定义要点：带导管或拔管48小时内出现菌血症/真菌血症；有发热、寒战或低血压等表现，且除导管外无其他明确感染源；外周血培养阳性；或导管段和外周血培养出相同菌种、相同药敏。四项均成立，故选ABCD。"},{"id":"M47","num":47,"type":"multiple","q":"观察下肢周径时，以髌骨中点为标记，双下肢周径的测量位置为？","options":["髌骨中点下15cm","髌骨中点下10cm","髌骨中点上15cm","髌骨中点上10cm"],"letters":["A","B","C","D"],"answer":[1,2],"answerLetters":["B","C"],"cat":"综合护理题库","explanation":"观察下肢周径统一以髌骨中点为标记，测量髌骨上15 cm和髌骨下10 cm处，便于双侧对比。故选BC。"},{"id":"M48","num":48,"type":"multiple","q":"踝泵运动是指踝关节的什么运动？","options":["屈伸运动","足底运动","环绕运动","直腿抬高运动"],"letters":["A","B","C","D"],"answer":[0,2],"answerLetters":["A","C"],"cat":"综合护理题库","explanation":"踝泵运动是踝关节的屈伸运动（背伸、跖屈）和环绕运动，通过小腿肌肉收缩促进静脉回流；直腿抬高属于另一种运动。故选AC。"},{"id":"M49","num":49,"type":"multiple","q":"以下哪项属于与留置及维护导尿管相关的手卫生时机？","options":["留置尿管前","戴无菌手套前","收集尿液标本或者排空引流袋等接触患者的操作前","拔除尿管后"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"留置及维护导尿管的手卫生时机包括：留置尿管前、戴无菌手套前、收集尿标本或排空引流袋等接触患者操作前，以及拔除尿管后。四项均正确，故选ABCD。"},{"id":"M50","num":50,"type":"multiple","q":"以下说法正确的是？","options":["在不违反集尿袋使用说明书的前提下，不推荐定期常规更换集尿袋，建议在出现临床指征时更换，如感染、阻塞或密闭系统开放时","使用无菌技术插入导尿管时，连接好导尿管和集尿袋，不要轻易脱开连接装置","始终将集尿袋保持在膀胱水平以下，在将集尿袋升高到膀胱水平以上之前要夹闭引流管","不要让集尿袋过满(不要超过3/4)"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"保持密闭引流系统：不推荐常规定期更换集尿袋，出现感染、阻塞或密闭系统开放时更换；不轻易脱开连接；集尿袋始终低于膀胱水平，抬高前先夹闭引流管；集尿袋不要超过3/4满。四项均正确，故选ABCD。"},{"id":"M51","num":51,"type":"multiple","q":"关于尿液标本采集，以下正确的是？","options":["尿液标本留取必须采用无菌技术","留取尿培养标本应在使用抗菌药物之前","留取时可暂时夹闭导尿管，时间不超过半小时，给予尿管Y型远端两遍消毒后，用无菌注射器穿刺尿管Y型远端留取尿培养标本","留取后2小时内及时送检，如不能及时送检，应暂存于2-8℃冰箱中"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"尿培养标本必须无菌留取，在使用抗菌药物前采集；留置尿管者可暂夹闭尿管（不超过半小时），消毒Y型管远端后用无菌注射器穿刺抽取；2小时内送检，不能及时送检应暂存于2～8℃。四项均正确，故选ABCD。"},{"id":"M52","num":52,"type":"multiple","q":"关于导尿管气囊破裂的处理措施正确的是？","options":["检查气囊是否完整","观察患者的排尿情况，有无尿频、尿急、尿痛、血尿等症状","必要时行膀胱镜检查","以上措施都不正确"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"导尿管气囊破裂应检查气囊是否完整（防碎片残留），观察有无尿频、尿急、尿痛、血尿，必要时行膀胱镜检查取出碎片。故选ABC。"},{"id":"M53","num":53,"type":"multiple","q":"关于发生意外拔管，以下说法正确的是？","options":["根据《非计划拔管风险因素评估量表》评估管路是否存在拔管危险，如存在危险因素，妥善固定，加强巡视，做到每班交接，落实防范措施","对置管患者及家属做好宣教，使其了解如何预防管路拔管 ，以及预防拔管的重要性","护士熟练掌握管路拔管的紧急处理方法，一旦滑脱迅速采取有效措施，使对患者的危害降低到最低","护士长要组织科内护士认真讨论管路拔管的原因和相关因素，提出有效的整改措施并落实，必要时邀请医生参加，及时按照《医疗安全（不良）事件管理制度》上报"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"防范意外拔管：用《非计划拔管风险评估量表》评估并妥善固定、加强巡视交接；宣教患者及家属；护士掌握紧急处理方法；护士长组织讨论原因并按《医疗安全（不良）事件管理制度》上报。四项均正确，故选ABCD。"},{"id":"M54","num":54,"type":"multiple","q":"病区工作人员应做到四轻，包括 (  ) 。","options":["说话轻","走路轻","开关门轻","操作轻"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"病区\"四轻\"指说话轻、走路轻、操作轻、关门轻，以保持病区安静。故选ABCD。"},{"id":"M55","num":55,"type":"multiple","q":"科室物品管理应做到(  ) 。","options":["计划领取","先进先出","先进后出","多领多出"],"letters":["A","B","C","D"],"answer":[0,1],"answerLetters":["A","B"],"cat":"综合护理题库","explanation":"科室物品管理应计划领取、先进先出，避免积压过期；\"先进后出\"\"多领多出\"会造成浪费或过期。故选AB。"},{"id":"M56","num":56,"type":"multiple","q":"对于患者，我们护理人员要做到(  ) 。","options":["知道患者病情变化","知道患者家庭成员","知道患者有思想问题","知道患者有不尊医行为"],"letters":["A","B","C","D"],"answer":[0,2,3],"answerLetters":["A","C","D"],"cat":"综合护理题库","explanation":"护理工作中应做到\"三知道\"：知道患者病情变化、知道患者有无思想问题、知道患者有无不尊医行为，以便针对性护理和沟通。家庭成员不在此列。故选ACD。"},{"id":"M57","num":57,"type":"multiple","q":"心内科今晨10点因抢救一名患者，打开了抢救车，使用了抢救药品和物品，经抢救，现患者病情稳定，请问护士该如何处置抢救车？","options":["清点物品，擦拭消毒抢救车及抢救器械","本周内按数量配置补齐抢救物品","将抢救车放回原处，确保定位放置","做好开启及封存记录，严格交接班"],"letters":["A","B","C","D"],"answer":[0,2,3],"answerLetters":["A","C","D"],"cat":"综合护理题库","explanation":"抢救后处置抢救车：清点物品并擦拭消毒抢救车及器械，放回原处定位放置，做好开启和封存记录并严格交接；抢救物品应及时（当班）补齐，不能拖到\"本周内\"。故选ACD。"},{"id":"M58","num":58,"type":"multiple","q":"关于内镜检查的注意事项，以下说法正确的是（  ）。","options":["长期口服阿司匹林、氯吡格雷、华法林等抗凝药物的患者，停药至少5天，防止发生消化道大出血","吸烟的患者，检查前1天起需戒烟","检查前需进行感染性疾病筛查","有活动的假牙提前取下"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"内镜检查注意事项：长期服抗凝药者按医嘱停药（题库为至少5天）防出血；吸烟者检查前1天起戒烟；检查前做感染性疾病筛查；活动假牙提前取下。四项均按题库正确，故选ABCD。"},{"id":"M59","num":59,"type":"multiple","q":"患者女，74岁，既往高血压病史，腹泻、脓血便2周，医生建议行结肠镜检查，该患者需做好哪些检查前准备？","options":["检查前完善心电图、感染性疾病筛查等相关检查","需由检查医师评估后预约检查","检查当日禁食","检查前一晚口服导泻剂或清洁灌肠"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"结肠镜检查前准备：完善心电图和感染性疾病筛查；高龄合并高血压者需检查医师评估后预约；检查当日禁食；检查前一晚口服导泻剂或清洁灌肠，以保证肠道清洁。故选ABCD。"},{"id":"M60","num":60,"type":"multiple","q":"患者男性，60岁，既往高血压病史，因胃溃疡收入院，并于今日晨行无痛胃镜检查，现已检查完毕，应给予哪些宣教？","options":["2小时以后可进食水","给予腹部按摩缓解腹胀腹痛","术后24小时禁止饮酒及从事危险性工作，避免洗热水澡","若腹痛剧烈或出现黑色粪便，须告知医师"], "],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"护理首次评估须在入院后2小时内完成；自理能力评估在入院或转入后接诊护士30分钟内完成；儿童营养风险筛查适用于2～18岁。D、E属于评估单存在的缺陷（空项、未及时评估），不是正确做法。故选ABC。"},{"id":"M100","num":100,"type":"multiple","q":"护理记录书写，有哪些要求（  ）？","options":["护理记录应体现整体护理理念，体现护理程序的基本方法， 反映护理工作的连续性","应根据病情需要决定记录频次，实时反映病情及治疗护理动动态","每一条护理记录的时间应具体到分钟","每一条护理记录的时间应具体到秒","3天以内无大便者，根据患者病情遵医嘱给予酌情处理，处理后大便次数记录于体温单内"],"letters":["A","B","C","D","E"],"answer":[0,1,2,4],"answerLetters":["A","B","C","E"],"cat":"综合护理题库","explanation":"护理记录要求：体现整体护理和护理程序，反映连续性；按病情决定记录频次；每条记录时间具体到分钟（不必到秒）；3天以内无大便者按医嘱处理后记录于体温单。故选ABCE。"},{"id":"M101","num":101,"type":"multiple","q":"下列关于体温单记录正确的是（  ）。","options":["入院当天测量体重并记录，住院期间每周至少1次","转入时间由转出科室书写","外出期间，在体温单40-42℃之间的相应格内填写“不在”两字","用☆表示大便失禁","手术后3天内每日常规测试2次（7:00、15:00）"],"letters":["A","B","C","D","E"],"answer":[0,2,4],"answerLetters":["A","C","E"],"cat":"综合护理题库","explanation":"体温单记录：入院当天测体重，住院期间每周至少1次；外出期间在40～42℃之间填写\"不在\"；手术后3天内每日常规测2次（7:00、15:00）。B（转入时间应由转入科室书写）、D（大便失禁用\"*\"表示）说法错误。故选ACE。"},{"id":"M102","num":102,"type":"multiple","q":"下列有关护理计划不正确的是（  ）。","options":["根据患者疾病相关情况提出对应的专科护理计划","护理计划提出时间与达成时间一致","根据疾病的恢复情况确定护理及计划是否达成目标，并确定是否执行新的护理措施","提出的护理计划过少，且患者发生病情变化时，护理计划中未有所体现","当患者发生病情变化时，及时新增对应的护理计划"],"letters":["A","B","C","D","E"],"answer":[1,3],"answerLetters":["B","D"],"cat":"综合护理题库","explanation":"题干问\"不正确\"：护理计划提出时间与达成时间一致（B）不合理，计划应有持续跟进；计划过少且病情变化时未体现（D）也是缺陷。A、C、E为正确做法。故选BD。"},{"id":"M103","num":103,"type":"multiple","q":"服用以下哪些药物，应当更加注意防范跌倒？","options":["脱水利尿剂","降压、降糖药","抗生素类","镇静催眠药"],"letters":["A","B","C","D"],"answer":[0,1,3],"answerLetters":["A","B","D"],"cat":"综合护理题库","explanation":"脱水利尿剂、降压降糖药、镇静催眠药可引起体位性低血压、头晕、低血糖或嗜睡，增加跌倒风险；抗生素类一般不增加跌倒风险。故选ABD。"},{"id":"M104","num":104,"type":"multiple","q":"在预防跌倒针对性措施中，头晕、眩晕的预防措施包括哪些？","options":["将头晕、眩晕引起跌倒的可能性提前告知患者和/或照护者。","可鼓励患者记录头晕、眩晕病史日记。","应评估头晕及眩晕感受、诱发因素、持续时间和强度、性质、相关症状、缓解方法。","指导患者头晕及眩晕时及时蹲下或扶靠牢固稳定物体。"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"头晕眩晕预防：提前告知跌倒可能性；鼓励记录头晕日记；评估头晕的感受、诱因、持续时间等；指导头晕时及时蹲下或扶靠牢固物体。四项均正确，故选ABCD。"},{"id":"M105","num":105,"type":"multiple","q":"在预防跌倒针对性措施中，视力障碍的预防措施包括哪些？","options":["如有不同用途的两副以上眼镜，应贴上相应的标签。","指导因视力减弱曾有跌倒史或跌倒风险的患者使用单光眼镜。","护理偏盲患者时，宜站在盲侧，并通过声音等增强患者对空间、位置的感知。","发现患者存在尚未诊断的视力问题时，应报告医师。"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"视力障碍预防：多副眼镜贴标签区分；视力减弱者使用单光眼镜（多焦点眼镜易致跌倒）；护理偏盲患者站于盲侧并以声音增强空间感知；发现未诊断视力问题报告医师。故选ABCD。"},{"id":"M106","num":106,"type":"multiple","q":"在预防跌倒针对性措施中，肌力、平衡及步态异常的预防措施包括哪些？","options":["观察和询问患者在行走或平衡方面遇到的问题。","鼓励患者参加由康复医师制订的肌力、平衡及步态训练计划，并督促实施。","指导患者正确使用助行器等保护性器具。","对严重骨质疏松、髋关节骨折的患者，可协助佩戴髋部保护器。"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"肌力、平衡及步态异常预防：观察和询问行走平衡问题；鼓励参加康复医师制订的训练计划；指导正确使用助行器；严重骨质疏松、髋部骨折风险者可佩戴髋部保护器。故选ABCD。"},{"id":"M107","num":107,"type":"multiple","q":"在预防跌倒针对性措施中，位性低血压的预防措施包括哪些？","options":["指导患者体位转换时速度缓慢，避免弯腰后突然站起，减少弯腰动作及弯腰程度。","指导患者卧位转为站位时，遵循“三部曲”，即平躺30 s、坐起30 s、站立30 s再行走。","指导患者睡眠时抬高床头10℃～30℃，以舒适为宜。","指导患者淋浴时有人陪伴，水温以40℃～50℃为宜。","指导患者一旦发生体位性低血压，或出现头晕、肢体无力等症状时，应立即就近坐下或搀扶平躺休息；指导陪同人员按摩四肢并立即呼救。"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"体位性低血压预防：体位转换缓慢；卧位到站位遵循\"三部曲\"（平躺、坐起、站立各30秒）；睡眠抬高床头；淋浴时有人陪伴、水温适宜；一旦发生立即就近坐下或平躺并呼救。五项均符合指南，故选ABCDE（C、D中的单位或温度范围按题库）。"},{"id":"M108","num":108,"type":"multiple","q":"患者患有哪些基础疾病时，尤其重点预防跌倒的发生？","options":["心脑血管疾病","躁动、意识障碍","高血压、糖尿病","肢体功能障碍","重度贫血"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"心脑血管疾病、躁动意识障碍、高血压糖尿病、肢体功能障碍、重度贫血均可导致头晕、乏力、感知或行动能力下降，是跌倒的重点防范人群。故选ABCDE。"},{"id":"M109","num":109,"type":"multiple","q":"患者发生跌倒事件后，护士应如何处理？","options":["护士应立刻赶到病人身边","评估环境、伤情，采取合适的搬运方式","去办公室通知值班医生","书写护理记录，对患者进行再次评估并宣教","上报不良事件"],"letters":["A","B","C","D","E"],"answer":[0,1,3,4],"answerLetters":["A","B","D","E"],"cat":"综合护理题库","explanation":"患者跌倒后，护士应立刻到场，评估环境和伤情并选择合适搬运方式，书写记录、再次评估宣教，并上报不良事件。不应\"去办公室通知\"而离开患者，应呼叫他人通知医生。故选ABDE。"},{"id":"M110","num":110,"type":"multiple","q":"为预防患者发生跌倒，必须提供安全的环境，下列哪些因素与跌倒有关？","options":["地面湿滑","过道上有障碍物","地面凹凸不平","灯光昏暗","拖地时未放置防滑标识"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"地面湿滑、过道障碍物、地面不平、灯光昏暗、拖地未放防滑标识，均是环境性跌倒危险因素。故选ABCDE。"},{"id":"M111","num":111,"type":"multiple","q":"关于患者下床前三部曲，正确的是？","options":["起床时，醒来睁开眼睛后，继续平卧30秒","在床上坐30秒","床旁站立30秒","起床时，醒来睁开眼睛后，平卧30秒后直接下床"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"下床\"三部曲\"：醒来后平卧30秒，床上坐30秒，床旁站立30秒，再行走。D\"平卧30秒后直接下床\"漏了中间步骤，错误。故选ABC。"},{"id":"M112","num":112,"type":"multiple","q":"患者发生跌倒/坠床后，要记录内容包括哪些？","options":["时间、地点、受伤经过","受伤部位及伴随症状与体征","周围环境","生命特征","采取的措施"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"跌倒/坠床记录应包括时间、地点、受伤经过，受伤部位及伴随症状与体征，周围环境，生命体征及采取的措施。故选ABCDE。"},{"id":"M113","num":113,"type":"multiple","q":"以下属于高危导管的是（）","options":["T管、脑室引流管、肝下引流管","动静脉插管、气管导管、腰大池引流管","胸腔闭式引流管、腹腔引流管、前列腺术后导尿管","硬膜下引流管、吻合口下鼻胃管、吻合口下鼻肠管"],"letters":["A","B","C","D"],"answer":[0,1,3],"answerLetters":["A","B","D"],"cat":"综合护理题库","explanation":"高危导管包括T管、脑室引流管、肝下引流管，动静脉插管、气管导管、腰大池引流管，硬膜下引流管及吻合口下鼻胃管、鼻肠管等；胸腔闭式引流管、腹腔引流管、前列腺术后导尿管按本院分级归为低危（C不选）。故选ABD。"},{"id":"M114","num":114,"type":"multiple","q":"以下属于低危导管的是（）","options":["普通胃管、普通尿管、腋窝引流管","盆腔引流管、颈部引流管、胸壁引流管","胸腔闭式引流管、腹腔引流管、腋窝引流管","鼻肠管、造瘘管、腹腔引流管"],"letters":["A","B","C","D"],"answer":[0,1,3],"answerLetters":["A","B","D"],"cat":"综合护理题库","explanation":"按本院分级：普通胃管、普通尿管、腋窝引流管，盆腔、颈部、胸壁引流管，鼻肠管、造瘘管、腹腔引流管属低危；C项中胸腔闭式引流管、腹腔引流管、腋窝引流管的组合与题库不一致。故选ABD（以院内分级表为准）。"},{"id":"M115","num":115,"type":"multiple","q":"留置胃管常见的并发症有哪些（）","options":["败血症","声音嘶哑","呃逆","食管狭窄","咽、食道黏膜损伤"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"留置胃管常见并发症有败血症（感染）、声音嘶哑、呃逆、食管狭窄、咽及食管黏膜损伤等。五项均属并发症，故选ABCDE。"},{"id":"M116","num":116,"type":"multiple","q":"以下哪项是留置胃管的相对禁忌症（）","options":["食管梗塞","脑脊液漏","颅底骨折","食管静脉曲张"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"留置胃管的相对禁忌证包括食管梗阻、脑脊液漏、颅底骨折、食管静脉曲张，插管可能加重损伤或出血，需谨慎评估。故选ABCD。"},{"id":"M117","num":117,"type":"multiple","q":"以下是引流管护理的原则是(  )","options":["有效的连接引流管","妥善固定","标识清晰","保持引流通畅","观察记录"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"引流管护理原则：有效连接、妥善固定、标识清晰、保持引流通畅、观察记录。五项均正确，故选ABCDE。"},{"id":"M118","num":118,"type":"multiple","q":"血栓高风险患者观察下肢腿围的变化，如何进行测量","options":["髌骨中点上15cm","髌骨中点上10cm","髌骨中点下10cm","髌骨中点下15cm"],"letters":["A","B","C","D"],"answer":[0,2],"answerLetters":["A","C"],"cat":"综合护理题库","explanation":"与第47题相同：测量腿围的位置为髌骨中点上15 cm和髌骨中点下10 cm。故选AC。"},{"id":"M119","num":119,"type":"multiple","q":"关于皮下注射抗凝剂的注意事项，以下哪些是对的","options":["注射前需要排气","注射前先抽回血","注射前不抽回血","持续匀速注射10s，注射后停留10s，再快速拔针","拔针后无需按压"],"letters":["A","B","C","D","E"],"answer":[2,3,4],"answerLetters":["C","D","E"],"cat":"综合护理题库","explanation":"按题库答案：皮下注射抗凝剂前不抽回血（C），持续匀速注射10秒、停留10秒后快速拔针（D），拔针后无需按压（E，避免揉搓导致皮下出血，题库按此）。注射前一般不需排气（预充针），也不抽回血。故选CDE。"},{"id":"M120","num":120,"type":"multiple","q":"导致下肢深静脉血栓形成的要素有","options":["血液高凝","血流缓慢","血管壁损伤","肿瘤疾病"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"Virchow三要素：血液高凝、血流缓慢、血管壁损伤。肿瘤是危险因素，但不属于三要素本身。故选ABC。"},{"id":"M121","num":121,"type":"multiple","q":"利伐沙班片主要的不良反应有哪些","options":["停药前后卒中风险升高","出血风险升高","硬膜外血肿","出血","心动过速"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"利伐沙班主要不良反应是出血和出血风险升高，椎管内（硬膜外）穿刺相关的硬膜外血肿，以及过早停药使卒中等血栓事件风险升高；心动过速不是其主要不良反应。故选ABCD。"},{"id":"M122","num":122,"type":"multiple","q":"深静脉血栓按发生部位，分为哪几种类型","options":["中央型","混合型","周围型","复杂型","表浅型"],"letters":["A","B","C","D","E"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"深静脉血栓按发生部位分为中央型（髂股静脉）、周围型（小腿静脉）和混合型（全下肢）。故选ABC。"},{"id":"M123","num":123,"type":"multiple","q":"下肢静脉血栓易患人群有","options":["孕产期妇女","老年人","肿瘤患者","血管内膜受损者","儿童及青少年"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"下肢静脉血栓易患人群包括孕产期妇女、老年人、肿瘤患者、血管内膜受损者；儿童及青少年相对少见。故选ABCD。"},{"id":"M124","num":124,"type":"multiple","q":"深静脉血栓的预防措施包括以下哪些","options":["术后主动活动，抬高下肢，有利于静脉回流，尽早下床活动","长期卧床的患者，家属应每天给与肢体按摩，加速血液循环","患者应多做深呼吸，有效咳嗽","可进行下肢气压治疗","病情允许的情况下可以穿弹力袜或使用弹力绷带减少静脉淤血"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"DVT预防措施：术后主动活动并抬高下肢、尽早下床；长期卧床者做肢体被动活动；深呼吸有效咳嗽；下肢气压治疗；穿弹力袜或使用弹力绷带。按题库五项均选，故选ABCDE（已确诊血栓的患者则禁忌按摩）。"},{"id":"M125","num":125,"type":"multiple","q":"下列哪些是DVT患者出院宣教的内容","options":["告知患者适量运动，如散步等有氧运动","告知患者定期复查","告知患者遵医嘱服药","指导患者观察出血倾向","告知患者若乘飞机，汽车等长途旅行应经常解开鞋带或穿拖鞋，多做足背伸屈运动"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"DVT患者出院宣教：适量有氧运动，定期复查，遵医嘱服药，观察出血倾向，长途旅行时多做足背伸屈运动。五项均正确，故选ABCDE。"},{"id":"M126","num":126,"type":"multiple","q":"VTE的预防措施具体包括","options":["基本预防","物理预防","药物预防","深静脉造影"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"VTE预防分为基本预防、物理预防和药物预防三类；深静脉造影是诊断方法，不是预防措施。故选ABC。"},{"id":"M127","num":127,"type":"multiple","q":"下列哪些是预防DVT发生的药物","options":["低分子肝素钙","Vit K 拮抗剂","磺达肝葵钠","利伐沙班片","尿激酶"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"预防DVT的药物包括低分子肝素、维生素K拮抗剂（如华法林）、磺达肝癸钠、利伐沙班等抗凝药；尿激酶是溶栓药，用于治疗，不用于预防。故选ABCD。"},{"id":"M128","num":128,"type":"multiple","q":"应用抗凝药物的护理观察要点有","options":["严格遵医嘱给药","严密监测生命体征","注意观察有无出血倾向","警惕原发疾病","观察患者有无恶心呕吐等症状"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"应用抗凝药物的护理：严格遵医嘱给药；严密监测生命体征；观察有无出血倾向；警惕原发疾病变化；观察有无恶心呕吐等不适。五项均正确，故选ABCDE。"},{"id":"M129","num":129,"type":"multiple","q":"压疮治疗中伤口评估的目的","options":["提供伤口现状资料，作为伤口治疗和评估伤口进展的资料。","以相同的方法及工具去评估伤口，便于临床工作人员沟通和统计。","预知可能需要的治疗时间及费用","以发展有系统且实用的临床方法以供有效教学之用"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"压疮伤口评估的目的：提供现状资料用于治疗和评估进展；使用统一方法和工具便于沟通统计；预知治疗时间和费用；为临床教学提供系统方法。四项均正确，故选ABCD。"},{"id":"M130","num":130,"type":"multiple","q":"下列敷料可以用来压疮治疗的是","options":["纱布垫","银离子藻酸盐","水胶体敷料","水凝胶"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"按伤口分期和渗液情况，纱布垫、银离子藻酸盐、水胶体敷料和水凝胶均可用于压疮治疗。故选ABCD。"},{"id":"M131","num":131,"type":"multiple","q":"容易引起压疮的常见器具有","options":["血氧指套","气管插管","胃管","床单皱褶"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"血氧指套、气管插管、胃管等医疗器械以及床单皱褶，都可对皮肤持续压迫，引起器械相关性压力性损伤。故选ABCD。"},{"id":"M132","num":132,"type":"multiple","q":"压疮发生的方程式中，研究证明与压力有关相关因素","options":["作用于皮肤的压力","作用于组织的压力的时间长度","皮肤和组织从压力的影响中恢复的能力","患者活动度"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"压疮方程式中与压力相关的因素：作用于皮肤的压力大小、压力作用时间的长短、皮肤和组织从压力影响中恢复的能力。患者活动度属于外在危险因素，不在此三项中。故选ABC。"},{"id":"M133","num":133,"type":"multiple","q":"关于漂浮的足跟下列说法正确的是","options":["确保足跟不和床面接触","膝关节应呈轻度屈曲","使用泡沫垫沿小腿全长将足跟抬起","膝关节屈曲30°"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"足跟悬浮要求足跟不与床面接触，膝关节轻度屈曲（5°～10°），用泡沫垫沿小腿全长抬起足跟；屈曲30°过大，不推荐。故选ABC。"},{"id":"M134","num":134,"type":"multiple","q":"非计划拔管风险评估，首次评估时机","options":["患者入院时留置导管患者,入院后2小时内完成评估","如遇急症手术等特殊情况，术后及时完成评估，遇抢救等情况可延长至抢救结束后完成。","患者转入时留置导管转入后2小时内完成评估","所有入院或转入患者，2小时内完成评估"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"非计划拔管首次评估：入院或转入时已留置导管者2小时内完成；急症手术等特殊情况术后及时完成，抢救可延至结束后。D\"所有入院或转入患者2小时内评估\"范围过宽，评估对象是留置导管者。故选ABC。"},{"id":"M135","num":135,"type":"multiple","q":"非计划拔管风险评估，再次评估时机","options":["对评估存在低、中风险患者，每3天评估记录1次","存在高风险患者，每24小时评估1次","患者发生病情变化时随时进行评估，如置管后、手术后、拔管后等。","发生非计划拔管后不需要再评估"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"再评估时机：低、中风险按规定频次（按题库为每3天1次）；高风险每24小时1次；病情变化、置管后、手术后、拔管后随时评估。发生非计划拔管后仍需再评估，D错误。故选ABC。"},{"id":"M136","num":136,"type":"multiple","q":"胸腔闭式引流管引流不畅的原因","options":["引流导管残渣阻塞","引流管侧孔紧贴胸壁","胸壁置管伤口太小","引流管打折扭曲"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"胸腔闭式引流管引流不畅的原因：导管被残渣阻塞、侧孔紧贴胸壁、胸壁置管伤口太小压迫导管、导管打折扭曲。故选ABCD。"},{"id":"M137","num":137,"type":"multiple","q":"留置引流管的护理记录应记录的内容","options":["切口敷料是否清洁固定","管道是否通畅","引流管外露的刻度或长度","引流液的颜色、量、性质"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"引流管护理记录包括：切口敷料是否清洁固定、管道是否通畅、引流管外露刻度或长度、引流液颜色量性质。故选ABCD。"},{"id":"M138","num":138,"type":"multiple","q":"阿片类止疼药物常见的不良反应","options":["胃肠道反应","连续使用一周以上可导致成瘾性","过度镇静","呼吸抑制"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"阿片类药物常见不良反应有恶心呕吐便秘等胃肠道反应、过度镇静、呼吸抑制；按题库答案，连续使用一周以上可导致成瘾性也被列为不良反应。故选ABCD。"},{"id":"M139","num":139,"type":"multiple","q":"关于疼痛评估说法正确的是（）","options":["常规用药后需要评估疼痛","使用PCA泵，19:00及3点只评估，不导入体温单","患者出院时，应进行疼痛评估，不导入体温单","无痛或轻度疼痛时，应每日进行一次疼痛评估，直至出院"],"letters":["A","B","C","D"],"answer":[1,2,3],"answerLetters":["B","C","D"],"cat":"综合护理题库","explanation":"使用PCA泵时，19:00及3:00评估但不导入体温单；患者出院时评估疼痛，同样不导入体温单；无痛或轻度疼痛者每日白班至少评估一次直至出院。\"常规用药后需要评估\"表述过于笼统，不选。故选BCD。"},{"id":"M140","num":140,"type":"multiple","q":"关于评估为中、重度疼痛时，应遵医嘱镇痛后复评说法正确的是（）","options":["皮下注射后30min后复评","肌肉注射15min后复评","口服用药1小时后复评","贴剂根据药物说明书达到最大作用时进行复评"],"letters":["A","B","C","D"],"answer":[0,2,3],"answerLetters":["A","C","D"],"cat":"综合护理题库","explanation":"镇痛后复评时机：皮下注射30分钟后、口服1小时后、贴剂在达到最大作用时（按说明书）复评；肌肉注射应在30分钟后复评，B项15分钟有误（静脉才是15分钟）。故选ACD。"},{"id":"M141","num":141,"type":"multiple","q":"关于疼痛预防措施正确的是（）","options":["头部手术后，宜抬高床头15°-30°","颈、胸、腹部手术后，宜抬高床头或取半卧位","四肢手术后，平卧时宜将患肢抬高于心脏平面","疼痛治疗只需要疼痛部分缓解，没必要达到无痛"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"疼痛预防：头部手术后抬高床头15°～30°；颈、胸、腹部手术后取半卧位；四肢手术后平卧时抬高患肢高于心脏。疼痛治疗应争取达到无痛，而不是\"部分缓解即可\"。故选ABC。"},{"id":"M142","num":142,"type":"multiple","q":"世界卫生组织将疼痛分为4级，包括","options":["无痛","轻度疼痛","中度疼痛","重度疼痛"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"按题库依据，疼痛分为无痛、轻度、中度、重度四级。故选ABCD。"},{"id":"M143","num":143,"type":"multiple","q":"在进行疼痛评估时，对于能进行语言或行为交流的患者，宜选用","options":["NRS","FPS-R","VRS","CPOT"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"能进行语言或行为交流的患者宜选用自评量表：数字评分法（NRS）、面部表情疼痛评分（FPS-R）、语言评分法（VRS）；CPOT是行为观察量表，用于无法自述者。故选ABC。"},{"id":"M144","num":144,"type":"multiple","q":"关于干预后，疼痛缓解效果分级包括（）","options":["无效","轻度缓解","部分缓解","完全缓解"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"疼痛干预后缓解效果分为无效、轻度缓解、部分缓解和完全缓解四级。故选ABCD。"},{"id":"M145","num":145,"type":"multiple","q":"PCA泵使用期间，关于疼痛评估下面说法正确的是（）","options":["无痛及轻度疼痛时，应每日白班进行至少1次疼痛评估，直至出院","19:00及3:00评估，并且导入体温单","19:00及3:00评估，不导入体温单","每日白班无需评估"],"letters":["A","B","C","D"],"answer":[0,2],"answerLetters":["A","C"],"cat":"综合护理题库","explanation":"PCA泵使用期间，无痛及轻度疼痛者每日白班至少评估1次直至出院；另在19:00及3:00评估，仅记录不导入体温单。故选AC。"},{"id":"M146","num":146,"type":"multiple","q":"以下哪些情况可能导致患者跌倒？","options":["病房灯光昏暗","患者起床过快","地面有水渍","患者穿着过长的裤子","床的高度不合适"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"灯光昏暗、起床过快、地面水渍、裤子过长、床高不合适，都可能导致跌倒。故选ABCDE。"},{"id":"M147","num":147,"type":"multiple","q":"预防跌倒的措施有哪些？","options":["保持环境整洁，无障碍物","为患者提供合适的辅助器具，如拐杖、轮椅等","定期评估患者的跌倒风险","对患者及家属进行跌倒风险教育","确保患者穿着合适的衣物和鞋子"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"预防跌倒措施：保持环境整洁无障碍；提供合适辅助器具；定期评估风险；对患者及家属宣教；确保穿合适衣物和鞋子。五项均正确，故选ABCDE。"},{"id":"M148","num":148,"type":"multiple","q":"对于高跌倒风险的患者，护士应做到以下哪些？","options":["加强巡视","在患者床头放置跌倒警示标识","与家属沟通共同做好防范","与医生沟通调整可能增加跌倒风险的药物","协助患者进行活动"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"对高跌倒风险患者，应加强巡视、床头放警示标识、与家属沟通共同防范、与医生沟通调整可能增加风险的药物，并协助活动。五项均正确，故选ABCDE。"},{"id":"M149","num":149,"type":"multiple","q":"为降低跌倒风险，医院可以采取以下哪些措施?","options":["安装扶手和防滑设施","改善照明条件","进行跌倒风险标识","定期组织跌倒应急演练","优化病房布局"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"医院层面降低跌倒风险：安装扶手和防滑设施、改善照明、跌倒风险标识、定期应急演练、优化病房布局。五项均正确，故选ABCDE。"},{"id":"M150","num":150,"type":"multiple","q":"为降低跌倒风险，患者应注意哪些方面？","options":["穿着合适的鞋子和衣物","避免快速起身或转身","按医嘱正确服药","熟悉病房环境","在床上活动时使用床栏"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"患者自身预防跌倒：穿合适鞋子衣物、避免快速起身转身、按医嘱服药、熟悉环境、床上活动使用床栏。五项均正确，故选ABCDE。"},{"id":"M151","num":151,"type":"multiple","q":"以下哪些人群属于跌倒高风险人群？","options":["老年人","儿童","视力障碍者","服用镇静药物者","身体虚弱者"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"老年人、儿童、视力障碍者、服用镇静药物者、身体虚弱者均属跌倒高风险人群。故选ABCDE。"},{"id":"M152","num":152,"type":"multiple","q":"种类多样的膳食应由五大类食物组成","options":["谷薯类","蔬菜和水果","动物性食物","大豆类和坚果","烹调油和盐"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"《中国居民膳食指南》要求膳食多样，由谷薯类、蔬菜水果、动物性食物、大豆类和坚果、烹调油和盐五大类食物组成。故选ABCDE。"},{"id":"M153","num":153,"type":"multiple","q":"关于食物血糖生成指数（GI）说法正确的是","options":["GI≤55，为低GI食物；","60＜GI≤70，为中GI食物；","GI＞70，为高GI食物","55＜GI≤70，为中GI食物"],"letters":["A","B","C","D"],"answer":[0,2,3],"answerLetters":["A","C","D"],"cat":"综合护理题库","explanation":"食物GI分级：GI≤55为低GI，5570为高GI。B项\"60<GI≤70\"界限错误。故选ACD。"},{"id":"M154","num":154,"type":"multiple","q":"所有糖尿病患者强化生活方式的改变包括","options":["控油","控盐","不饮酒","控糖"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"糖尿病患者强化生活方式干预包括控油、控盐、不饮酒、控糖（限制添加糖）。故选ABCD。"},{"id":"M155","num":155,"type":"multiple","q":"患者转运过程中的不安全因素有（          ）","options":["低血压","颅内压增高","呼吸回路断开","氧气压力不足"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"转运中的不安全因素包括低血压、颅内压增高、呼吸回路断开、氧气压力不足，均可导致病情恶化或意外。故选ABCD。"},{"id":"M156","num":156,"type":"multiple","q":"外出检查返回科室后处理（        ）","options":["确认身份","测量生命体征","检查各管道和皮肤","进行护理记录"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"外出检查返回科室后应确认身份，测量生命体征，检查各管道和皮肤，并进行护理记录。故选ABCD。"},{"id":"M157","num":157,"type":"multiple","q":"转运的并发症（         ）","options":["死亡","低氧","低血压","心律失常"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"转运可发生低氧、低血压、心律失常，严重时死亡。故选ABCD。"},{"id":"M158","num":158,"type":"multiple","q":"转运患者前的准备工作有哪些？（      ）","options":["检查各引流管、胃管等，保持通畅（必要时夹闭），并妥善固定，防止脱出","检查静脉通路是否通畅，各连接处是否紧密","核对医嘱和患者信息，确认陪同医师、家属，核对携带的设备、药品、氧气","合理规划转运路径"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"转运前准备：检查并妥善固定各引流管（必要时夹闭）；检查静脉通路及连接；核对医嘱、患者信息，确认陪同人员，核对设备药品氧气；合理规划路径。四项均正确，故选ABCD。"},{"id":"M159","num":159,"type":"multiple","q":"胰岛素漏液的原因有","options":["针头和胰岛素笔芯之间密闭不良","未正确按压拇指按钮","针头过快从注射部位拔出","肥胖患者"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"胰岛素漏液原因：针头与笔芯之间密闭不良、未正确按压拇指按钮、针头过快拔出，肥胖患者皮下组织厚也易出现漏液。故选ABCD。"},{"id":"M160","num":160,"type":"multiple","q":"胰岛素制剂按来源分为","options":["动物胰岛素","人胰岛素","胰岛素类食物","双胰岛素类似物"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"胰岛素制剂按来源分为动物胰岛素、人胰岛素和胰岛素类似物（题干\"胰岛素类食物\"为\"类似物\"的笔误）。双胰岛素类似物属于类似物的一种制剂，不是来源分类。故选ABC。"},{"id":"M161","num":161,"type":"multiple","q":"关于胰岛素的预混正确的做法为","options":["在室温下5s内双手水平滚动胰岛素笔芯10次","10s内上下翻转10次","剧烈摇晃","无需混匀"],"letters":["A","B","C","D"],"answer":[0,1],"answerLetters":["A","B"],"cat":"综合护理题库","explanation":"预混胰岛素混匀方法：室温下双手水平滚动10次（约5秒），再上下翻转10次（约10秒）；不可剧烈摇晃（产生气泡影响剂量），也不能不混匀。故选AB。"},{"id":"M162","num":162,"type":"multiple","q":"关于胰岛素的保存下列说法正确的是","options":["注意不要放在阳光直射或者高温的汽车内","乘飞机、汽车不能将胰岛素放在托运行李中，要随身携带","切记笔不能贴身放置，以免体温使得胰岛素失效","开启的胰岛素在室室温、阴凉条件下保存28天下"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"胰岛素保存：避免阳光直射和高温（如汽车内）；乘飞机汽车随身携带，不放托运行李（高空低温可能冻结）；笔不要贴身放置，避免体温影响；开启后室温阴凉保存28天。按题库四项均选，故选ABCD。"},{"id":"M163","num":163,"type":"multiple","q":"胰岛素按效用及作用特点分为","options":["短效胰岛素","速效胰岛素","中、长效胰岛素及类似物","预混胰岛素","双胰岛素类似物"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"胰岛素按效用和作用特点分为短效、速效、中长效及类似物、预混胰岛素和双胰岛素类似物。故选ABCDE。"},{"id":"M164","num":164,"type":"multiple","q":"CVC护理中，以下哪些是更换敷料的指征？","options":["敷料潮湿","敷料污染","敷料松动","患者出现发热"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"CVC敷料潮湿、污染、松动时需立即更换；发热本身不是更换敷料的指征（应评估是否导管感染）。故选ABC。"},{"id":"M165","num":165,"type":"multiple","q":"以下哪些是CVC护理中监测导管位置的常用方法？","options":["影像学检查","触摸导管","观察导管标记","导管抽血"],"letters":["A","B","C","D"],"answer":[0,2,3],"answerLetters":["A","C","D"],"cat":"综合护理题库","explanation":"监测CVC位置的常用方法：影像学检查（金标准）、观察导管外露标记刻度、导管抽血（回血通畅提示在血管内）。\"触摸导管\"不能可靠判断位置。故选ACD。"},{"id":"M166","num":166,"type":"multiple","q":"CVC护理中，以下哪些是预防导管堵塞的措施？","options":["定期冲洗导管","使用肝素盐水封管","避免导管内血液滞留","导管留置时间过长"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"预防CVC堵塞：定期冲管、肝素盐水封管、避免管内血液滞留；导管留置时间过长会增加堵塞风险，不是预防措施。故选ABC。"},{"id":"M167","num":167,"type":"multiple","q":"疼痛管理的目标包括（）","options":["患者疼痛评分≤3分","24小时疼痛频率≤3次","24小时内需要解救药物≤3次","病人疼的时候给药，不疼的时候不用给药"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"疼痛管理目标：评分≤3分，24小时疼痛频率≤3次，24小时解救药物≤3次。\"疼的时候给药，不疼不给药\"违背按时给药原则，错误。故选ABC。"},{"id":"M168","num":168,"type":"multiple","q":"我们在操作过程中应采取哪些措施预防针刺伤的发生？","options":["严格执行各项穿刺操作规范与流程","手术中，避免徒手传递锐器，将锐器放置在弯盘中进行无接触式传递","配备充足的锐器回收容器，放置在操作可及区域","如需回套针帽，应使用双手回套","以上都对"],"letters":["A","B","C","D","E"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"预防针刺伤：严格执行穿刺规范；手术中避免徒手传递锐器，用弯盘无接触传递；配备充足锐器盒并置于操作可及处。不得双手回套针帽（应单手或不回套）。故选ABC。"},{"id":"M169","num":169,"type":"multiple","q":"如何预防静脉血标本发生溶血？","options":["消毒后，要使穿刺部位自然干燥","不可穿过血肿部位采血","如使用注射器采血，避免过度用力抽拉针栓","轻柔颠倒混匀含有添加剂的标本"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"预防静脉血标本溶血：消毒后自然干燥；不穿过血肿部位采血；使用注射器时避免过度用力抽拉；轻柔颠倒混匀含添加剂的标本。四项均正确，故选ABCD。"},{"id":"M170","num":170,"type":"multiple","q":"发生感染性职业暴露后，应如何上报？","options":["进入个人OA系统，填报《感染性职业暴露诊疗记录表》","通过医疗安全不良事件上报系统进行感染性职业暴露上报","通过钉钉进行感染性职业暴露上报","通过瑞美系统进行感染性职业暴露上报","以上都对"],"letters":["A","B","C","D","E"],"answer":[0,1],"answerLetters":["A","B"],"cat":"综合护理题库","explanation":"按本院流程，感染性职业暴露上报途径为：个人OA系统填报《感染性职业暴露诊疗记录表》，并通过医疗安全不良事件上报系统上报。钉钉、瑞美系统不是规定渠道。故选AB。"},{"id":"M171","num":171,"type":"multiple","q":"发生感染性职业暴露的，应当于何时进行追踪？","options":["发生职业暴露的第一个月","发生职业暴露的第三个月","发生职业暴露的第六个月","发生职业暴露的第十二个月","以上都对"],"letters":["A","B","C","D","E"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"按题库依据，职业暴露后应在第1个月、第3个月、第6个月进行追踪检测。故选ABC。"},{"id":"M172","num":172,"type":"multiple","q":"新入院患者张某，遵医嘱明日早晨抽血化验肝功能、血糖、血脂，请问患者应该做好哪些准备？","options":["24 h内不宜饮酒。","夜间保持空腹，至少禁食8 h。","夜间可以少量饮水。","此三项检验不需要空腹，夜间可以进食进水。","以上都对"],"letters":["A","B","C","D","E"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"肝功能、血糖、血脂需空腹采血：24小时内不宜饮酒，夜间禁食至少8小时，夜间可少量饮水（不影响结果）。D\"不需要空腹\"错误。故选ABC。"},{"id":"M173","num":173,"type":"multiple","q":"关于血培养的说法正确的是？","options":["应在寒战或发热初起时采集血液标本。","在抗生素应用之前采集血标本。","严格无菌操作。","应在抗生素使用之后立即采集血标本。","应在患者发热高烧不退的时候采集血标本。"],"letters":["A","B","C","D","E"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"血培养应在寒战或发热初起时采集，在抗生素应用之前采集，并严格无菌操作，以提高阳性率、减少污染。抗生素使用后或高热不退时采集阳性率低。故选ABC。"},{"id":"M174","num":174,"type":"multiple","q":"以下关于静脉采血技术操作的要求，哪一项是正确的？","options":["可以使用碘消毒剂消毒皮肤","开始采血前佩戴医用帽子、口罩与手套","宜在完成每一位患者血液标本采集后更换新的手套","采血前宜至少静息5分钟","采血前卧床休息半小时"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"静脉采血要求：可用碘类消毒剂；采血前戴帽子、口罩、手套；每位患者采集后更换手套；采血前至少静息5分钟。E\"卧床休息半小时\"不是常规要求。故选ABCD。"},{"id":"M175","num":175,"type":"multiple","q":"王护士，正在为患者进行静脉采血操作，她的以下做法正确的是？","options":["将止血带绑扎在采血部位上方7cm","在为患者采集第一管血液标本时，就解开了绑扎好的止血带","为了能够一次穿刺成功，王护士反复拍打采血部位的血管，使其更加充盈","为了血液采集顺畅，穿刺成功后，嘱患者反复攥拳","以上都对"],"letters":["A","B","C","D","E"],"answer":[0,1],"answerLetters":["A","B"],"cat":"综合护理题库","explanation":"止血带绑扎在采血部位上方约7 cm，并在采集第一管血时即解开（绑扎时间不超过1分钟）。反复拍打血管、反复攥拳会造成溶血和结果偏差，是错误做法。故选AB。"},{"id":"M176","num":176,"type":"multiple","q":"对初乳的描述哪项是正确的（ ）？","options":["产后10天内所分泌的乳汁","颜色发黄","含有丰富的抗体","泻剂、促进胎便的排出","蛋白质含量较少"],"letters":["A","B","C","D","E"],"answer":[1,2,3],"answerLetters":["B","C","D"],"cat":"综合护理题库","explanation":"初乳为产后7天内分泌的乳汁，颜色发黄，含丰富抗体，有轻泻作用，促进胎便排出；蛋白质含量较高而非较少。A（10天内）和E错误。故选BCD。"},{"id":"M177","num":177,"type":"multiple","q":"母乳喂养哺乳姿势（ ）？","options":["摇篮式","交叉式","侧卧式","半躺式","橄榄球式"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"常用哺乳姿势有摇篮式、交叉式、侧卧式、半躺式和橄榄球式，应根据母婴情况选择舒适姿势。故选ABCDE。"},{"id":"M178","num":178,"type":"multiple","q":"如何保证母亲有足够的乳汁（ ）？","options":["24小时母婴同室","按需哺乳","实行三早","频繁有效的吸吮","母亲充足睡眠"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"保证乳汁充足：24小时母婴同室、按需哺乳、实行\"三早\"（早接触、早吸吮、早开奶）、频繁有效吸吮、母亲充足睡眠。五项均正确，故选ABCDE。"},{"id":"M179","num":179,"type":"multiple","q":"识别新生儿饥饿的要点（ ）？","options":["睡觉不安稳","婴儿寻找乳房","有吸吮动作","砸嘴唇、伸舌头","烦躁、哭闹"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"新生儿饥饿征象包括睡眠不安稳、寻找乳房、有吸吮动作、砸嘴唇伸舌头，哭闹是较晚的饥饿表现。五项均属，故选ABCDE。"},{"id":"M180","num":180,"type":"multiple","q":"母乳喂养，婴儿正确的含接姿势（ ）？","options":["婴儿张大口","下唇外翻","婴儿口腔上方有更多乳晕","婴儿口腔下方有更多乳晕","舌头呈勺状环绕乳头及乳晕"],"letters":["A","B","C","D","E"],"answer":[0,1,2,4],"answerLetters":["A","B","C","E"],"cat":"综合护理题库","explanation":"正确含接：婴儿口张大、下唇外翻、口腔上方露出更多乳晕（下方含入更多）、舌头呈勺状环绕乳头乳晕。D说成\"下方有更多乳晕\"错误。故选ABCE。"},{"id":"M181","num":181,"type":"multiple","q":"护理管理者对护士关怀主要体现哪些方面？","options":["营造安全和谐的执业环境","促进护士职业生涯发展","管理公平民主","关心思想生活"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"护理管理者的关怀体现在营造安全和谐的执业环境、促进护士职业生涯发展、管理公平民主、关心思想生活。故选ABCD。"},{"id":"M182","num":182,"type":"multiple","q":"以下哪些疾病会出现D二聚体升高的情况？","options":["肺栓塞","深静脉血栓","主动脉夹层","急性心肌梗塞"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"D-二聚体是纤维蛋白降解产物，肺栓塞、深静脉血栓、主动脉夹层、急性心肌梗死等伴有血栓形成或纤溶亢进的疾病都会升高。故选ABCD。"},{"id":"M183","num":183,"type":"multiple","q":"以下关于D二聚体的说法正确的是？","options":["D二聚体是纤维蛋白降解的产物","是体内凝血和纤溶系统活化的重要标志物","反应心功能是否受损的指标","代表肾功能是否正常"],"letters":["A","B","C","D"],"answer":[0,1],"answerLetters":["A","B"],"cat":"综合护理题库","explanation":"D-二聚体是纤维蛋白降解产物，是体内凝血和纤溶系统活化的标志物；它不反映心功能或肾功能。故选AB。"},{"id":"M184","num":184,"type":"multiple","q":"T/CNAS 51-2025标准的核心目标包括","options":["规范MARSI预防与护理流程","降低MARSI发生率","提升护理质量，保障患者皮肤健康","统一各级医疗机构护理操作规范","简化粘胶产品使用流程"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"T/CNAS 51-2025标准（医用粘胶相关性皮肤损伤预防与护理）旨在规范MARSI预防与护理流程、降低发生率、提升护理质量保障皮肤健康、统一各级机构操作规范；\"简化粘胶产品使用流程\"不是核心目标。故选ABCD。"},{"id":"M185","num":185,"type":"multiple","q":"MARSI的内源性风险因素包括","options":["年龄≥65岁","皮肤敏感史","营养不良","糖尿病病史","粘贴部位活动度大"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"MARSI内源性（患者自身）因素包括高龄、皮肤敏感史、营养不良、糖尿病等；粘贴部位活动度大属于外源性因素。故选ABCD。"},{"id":"M186","num":186,"type":"multiple","q":"医用粘胶粘贴前的皮肤准备规范步骤有","options":["温水清洁皮肤去除污渍","轻柔涂抹润肤剂","待消毒剂完全干燥","用酒精反复擦拭皮肤增强粘性","避开皮肤发红、疼痛异常区域"],"letters":["A","B","C","D","E"],"answer":[0,1,2,4],"answerLetters":["A","B","C","E"],"cat":"综合护理题库","explanation":"粘贴前皮肤准备：温水清洁去污；可轻柔涂润肤剂；待消毒剂完全干燥；避开发红疼痛异常区域。不能用酒精反复擦拭皮肤（会使皮肤干燥、损伤屏障）。故选ABCE。"},{"id":"M187","num":187,"type":"multiple","q":"MARSI发生后需规范记录的内容包括","options":["损伤部位、类型及严重程度","处理措施及效果评估","粘胶产品类型及使用时长","首次发生及每次评估后的动态情况","患者主诉症状（如疼痛、瘙痒）"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3,4],"answerLetters":["A","B","C","D","E"],"cat":"综合护理题库","explanation":"MARSI规范记录应包括损伤部位类型及严重程度、处理措施及效果、粘胶产品类型及使用时长、首次发生及每次评估后的动态情况，以及患者主诉症状。故选ABCDE。"},{"id":"M188","num":188,"type":"multiple","q":"以下属于MARSI转诊指征的有","options":["保守处理3~7天无效","损伤情况持续恶化","出现严重感染迹象","全层皮肤缺损","轻度红斑伴轻微瘙痒"],"letters":["A","B","C","D","E"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"MARSI转诊指征：保守处理3～7天无效、损伤持续恶化、出现严重感染迹象、全层皮肤缺损。轻度红斑伴轻微瘙痒可自行观察处理。故选ABCD。"},{"id":"M189","num":189,"type":"multiple","q":"抗肿瘤药物输注时的操作要点包括","options":["使用全密闭式输注系统","给药前后冲洗输液通路","遵医嘱调节输注速度","严密监测患者生命体征及过敏症状"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"抗肿瘤药物输注要点：全密闭输注系统以防职业暴露；给药前后冲洗通路；遵医嘱调速；严密监测生命体征及过敏症状。故选ABCD。"},{"id":"M190","num":190,"type":"multiple","q":"吞咽障碍常见病因包括","options":["神经系统疾病","头颈部肿瘤","肌源性疾病","皮肤感染"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"吞咽障碍常见病因：脑卒中等神经系统疾病、头颈部肿瘤及其治疗、肌源性疾病；皮肤感染与吞咽功能无关。故选ABC。"},{"id":"M191","num":191,"type":"multiple","q":"吞咽障碍患者口服给药潜在风险包括","options":["误吸","窒息","药物有效性改变","营养不良风险"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"吞咽障碍患者口服给药的潜在风险包括误吸、窒息、药物有效性改变（如不当碾碎）和因服药困难导致的营养不良风险。故选ABCD。"},{"id":"M192","num":192,"type":"multiple","q":"吞咽障碍的患者，口服给药基本要求包括","options":["基于吞咽评估确定安全一口量","确定药物适宜粘稠度","每次服药量不得超过安全一口量，必要时分次","给药过程中识别误吸症状并及时处理"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"吞咽障碍患者口服给药要求：基于吞咽评估确定安全一口量；确定药物适宜黏稠度；每次不超过安全一口量，必要时分次；给药中识别误吸症状并及时处理。故选ABCD。"},{"id":"M193","num":193,"type":"multiple","q":"不可碾碎的口服药物类型通常包括","options":["缓释制剂","控释制剂","肠溶制剂","普通糖衣片"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"缓释、控释、肠溶制剂碾碎会破坏释药结构，导致突释或失效，因此不可碾碎；普通糖衣片可碾碎。故选ABC。"},{"id":"M194","num":194,"type":"multiple","q":"吞咽障碍患者口服给药后观察与并发症预防包括","options":["口腔清洁","误吸症状观察","出现误吸立即停止给药并置侧卧位","记录给药效果及不良反应"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"给药后应做口腔清洁、观察误吸症状；出现误吸立即停止给药并置侧卧位；记录给药效果及不良反应。故选ABCD。"},{"id":"M195","num":195,"type":"multiple","q":"吞咽障碍患者口服给药，患者与家属教育内容包括","options":["疾病知识宣教","用药指导","居家护理指导","应急情况处理"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"患者和家属教育应涵盖疾病知识宣教、用药指导、居家护理指导和应急情况处理。故选ABCD。"},{"id":"M196","num":196,"type":"multiple","q":"POCT的应用与质控要求包括","options":["不能完全替代检验科标准检验","需建立严格质量控制体系","操作人员必须经过专业培训","定期进行结果比对校准"],"letters":["A","B","C","D"],"answer":[0,1,2,3],"answerLetters":["A","B","C","D"],"cat":"综合护理题库","explanation":"POCT不能完全替代检验科标准检验，需建立严格质量控制体系，操作人员须经专业培训，并定期进行结果比对校准。故选ABCD。"},{"id":"M197","num":197,"type":"multiple","q":"POCT质控分级核心标准包括","options":["C级基础合规","B级精准比对","A级卓越保障","D级无需质控"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"POCT质控分级为C级基础合规、B级精准比对、A级卓越保障；不存在\"D级无需质控\"，任何POCT项目都必须质控。故选ABC。"},{"id":"M198","num":198,"type":"multiple","q":"医院对POCT仪器试剂管理要求","options":["必须有国家药品监督管理局许可证","统一购置备案","选用与仪器配套的原装试剂","可由科室自行随意采购"],"letters":["A","B","C","D"],"answer":[0,1,2],"answerLetters":["A","B","C"],"cat":"综合护理题库","explanation":"医院POCT仪器试剂须有国家药监局许可证、统一购置备案、选用与仪器配套的原装试剂；科室不得自行随意采购。故选ABC。"},{"id":"M199","num":199,"type":"multiple","q":"便携式 ,sequenceVisited:[]},JSON.parse(memoryStorage.getItem(KEY)||'{}'));currentUser.textContent=user;stats();updateResumeNote()}function login(){let u=loginUser.value.trim(),p=loginPass.value;if(u===ADMIN_USER&&p===ADMIN_PASSWORD){user=u;memorySession.setItem('nurse_quiz_user',u);loginErr.textContent='';loginScreen.style.display='none';appShell.style.display='block';showAdmin();return}let aa=getAccounts();if(!aa[u]||aa[u]!==p){loginErr.textContent='账号或密码错误';return}user=u;memorySession.setItem('nurse_quiz_user',u);loginErr.textContent='';loginScreen.style.display='none';appShell.style.display='block';loadUser()}function showAdmin(){home.style.display='block';quiz.style.display='none';currentUser.textContent='管理员';adminPanel.style.display='block';let a=getAccounts();accountList.innerHTML=Object.keys(a).sort().map(u=>`<div style="display:flex;gap:8px;align-items:center;margin:9px 0"><b style="width:42px">${u}</b><input id="pw_${u}" value="${a[u]}" style="flex:1;padding:9px;border:1px solid #d8e5e1;border-radius:9px"><button class="primary" style="flex:0 0 auto;padding:9px 12px" onclick="changePw('${u}')">保存</button></div>`).join('')}function changePw(u){let v=document.getElementById('pw_'+u).value.trim();if(v.length<4){alert('密码至少4位');return}let a=getAccounts();a[u]=v;setAccounts(a);alert(u+' 密码已修改')}function logout(){memorySession.removeItem('nurse_quiz_user');user='';appShell.style.display='none';loginScreen.style.display='flex';loginPass.value='';loginErr.textContent=''}function save(){memoryStorage.setItem(KEY,JSON.stringify(state));stats()}function stats(){doneN.textContent=state.done;rightN.textContent=state.right;wrongN.textContent=state.wrong.length;updateResumeNote()}function updateResumeNote(){if(typeof resumeNote!=='undefined'&&user&&user!=='admin'){let n=(state.sequencePosition||0)+1;resumeNote.textContent='顺序练习将从第 '+n+' 题继续（可在题目目录中跳转）'}}if(user){loginScreen.style.display='none';appShell.style.display='block';if(user==='admin')showAdmin();else loadUser()}else{stats()}let counts={};BANK.forEach(x=>counts[x.cat]=(counts[x.cat]||0)+1);Object.keys(counts).sort().forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c+'（'+counts[c]+'题）';cat.appendChild(o)});function filtered(){let s=search.value.trim().toLowerCase();return BANK.filter(x=>(cat.value==='全部'||x.cat===cat.value)&&(!s||(x.q+' '+x.options.join(' ')).toLowerCase().includes(s)))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(mode){currentMode=mode;let base=filtered();if(mode==='wrong')base=base.filter(x=>state.wrong.includes(x.id));if(!base.length){alert('当前没有可练习的题目');return}list=mode==='seq'?[...base]:shuffle(base);if(mode==='exam')list=list.slice(0,Math.min(100,list.length));idx=mode==='seq'?Math.min(state.sequencePosition||0,list.length-1):0;home.style.display='none';quiz.style.display='block';catalogBtn.style.display=mode==='seq'?'block':'none';buildCatalog();render()}function goHome(){toggleCatalog(false);catalogBtn.style.display='none';home.style.display='block';quiz.style.display='none';stats()}function render(){locked=false;sel=[];if(currentMode==='seq'){state.sequencePosition=idx;state.sequenceVisited=state.sequenceVisited||[];save()}let x=list[idx];progress.textContent=`第 ${idx+1}/${list.length}题 · ${x.cat}`;kind.textContent=x.type==='multiple'?'多选题':'单选题';q.textContent=x.id+'、'+x.q;opts.innerHTML='';feedback.style.display='none';submit.style.display='block';next.style.display='none';x.options.forEach((t,i)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${x.letters[i]}.</b><span>${t}</span>`;b.onclick=()=>pick(i,b);opts.appendChild(b)});refreshCatalog()}function pick(i,b){if(locked)return;let x=list[idx];if(x.type==='single'){sel=[i];[...opts.children].forEach(z=>z.classList.remove('sel'));b.classList.add('sel')}else{sel.includes(i)?sel=sel.filter(v=>v!==i):sel.push(i);b.classList.toggle('sel')}}function submitAns(){if(!sel.length){alert('请先选择答案');return}locked=true;let x=list[idx];if(currentMode==='seq'&&!state.sequenceVisited.includes(idx))state.sequenceVisited.push(idx);let ok=[...sel].sort().join()===[...x.answer].sort().join();state.done++;if(ok)state.right++;else if(!state.wrong.includes(x.id))state.wrong.push(x.id);if(ok)state.wrong=state.wrong.filter(id=>id!==x.id);[...opts.children].forEach((b,i)=>{b.classList.remove('sel');if(x.answer.includes(i))b.classList.add('good');else if(sel.includes(i))b.classList.add('bad')});feedback.style.display='block';feedback.innerHTML=(ok?'✅ <b>回答正确</b>':'❌ <b>回答错误</b>')+'<br><b>正确答案：</b>'+x.answerLetters.join('、')+'<div class="why"><b>解析：</b>'+x.explanation+'</div>';save();submit.style.display='none';next.style.display='block';next.textContent=idx===list.length-1?'完成':'下一题'}function nextQ(){if(idx<list.length-1){idx++;render()}else{alert(`练习完成！本地累计答题 ${state.done} 道。`);goHome()}}function toggleCatalog(open){drawer.classList.toggle('open',open);drawerMask.classList.toggle('open',open)}function buildCatalog(){if(currentMode!=='seq'){qgrid.innerHTML='';return}qgrid.innerHTML=list.map((x,i)=>`<button class="qnum" data-i="${i}" onclick="jumpTo(${i})">${i+1}</button>`).join('')}function refreshCatalog(){if(currentMode!=='seq')return;[...qgrid.children].forEach((b,i)=>{b.classList.toggle('current',i===idx);b.classList.toggle('done',(state.sequenceVisited||[]).includes(i))});let cur=qgrid.children[idx];if(cur)cur.scrollIntoView({block:'center'})}function jumpTo(i){if(i<0||i>=list.length)return;idx=i;state.sequencePosition=i;save();toggleCatalog(false);render()}function jumpByInput(){let n=parseInt(jumpInput.value,10);if(!n||n<1||n>list.length){alert('请输入1-'+list.length+'之间的题号');return}jumpTo(n-1)}function restartSequence(){if(confirm('确定从第1题重新开始顺序练习吗？')){state.sequencePosition=0;state.sequenceVisited=[];save();start('seq')}}function resetStats(){if(confirm('确定清空答题记录和错题本吗？')){state={done:0,right:0,wrong:[],sequencePosition:0,sequenceVisited:[]};save()}}</script></div></body></html>
